// ---- The Catalogue (shelves + bias bars + facets) ----
const CAT={sel:{status:new Set(),grade:new Set(),src:new Set(),type:new Set()},q:''};
function catBase(e,skip){const S=CAT.sel;
 for(const k of ['status','grade','src','type']){if(k===skip)continue;const set=S[k];if(!set.size)continue;
  const ev=k==='status'?statusLabel(e):k==='grade'?e.confidence:k==='src'?srcFamily(e.source):e.type;
  if(!set.has(ev))return false;}
 if(CAT.q){const hay=((e.author_identified||'')+' '+(e.title_transcribed||'')+' '+(e.editorial_note||'')+' '+(e.subject||'')+' '+(e.cat_no||'')+' '+(e.edition||'')).toLowerCase();
  if(!CAT.q.split(/\s+/).every(t=>hay.includes(t)))return false;}
 return true;}
function catMatch(e){return catBase(e,null);}
function facetCount(dim,val){return E.filter(e=>{if(!catBase(e,dim))return false;
 const ev=dim==='status'?statusLabel(e):dim==='grade'?e.confidence:dim==='src'?srcFamily(e.source):e.type;return ev===val;}).length;}
function catCard(e){const sv=(e.survivor_ids||[]).length;const st=statusLabel(e);
 return `<div class="card" onclick="openE('${e.id}')">
  <div class="cat">${esc(srcFamily(e.source))}</div>
  <h4>${esc(e.author_identified||e.title_transcribed||e.cat_no)}</h4>
  <div class="meta">${esc((e.title_transcribed||'').slice(0,80))}${e.edition?' &middot; '+esc(e.edition):''}</div>
  <div class="badges"><span class="b ${st}">${esc(statusGloss(st))}</span>
   <span class="b g${e.confidence}" title="Entry confidence ${e.confidence}: how confidently this entry can be asserted as a book Tycho genuinely owned, graded from A (strongest evidence) down to D (weakest).">${e.confidence}</span>
   ${sv?`<span class="b located">${sv} survivor${sv>1?'s':''}</span>`:''}</div></div>`;}
function facetGroup(host,title,dim,vals,labfn){
 let h=`<h3>${title}</h3><div class="facet">`;
 vals.forEach(v=>{const n=facetCount(dim,v);const on=CAT.sel[dim].has(v);
  h+=`<span class="chip ${on?'on':''} ${(!n&&!on)?'off':''}" ${n||on?`onclick="catTog('${dim}','${esc(v)}')"`:''}>${esc(labfn?labfn(v):v)}<span class="n">${n}</span></span>`;});
 host.innerHTML+=h+'</div>';}
window.catTog=(dim,v)=>{const set=CAT.sel[dim];set.has(v)?set.delete(v):set.add(v);drawCatalogue();};
window.catClear=()=>{Object.values(CAT.sel).forEach(s=>s.clear());CAT.q='';const si=document.getElementById('csearch');if(si)si.value='';drawCatalogue();};
function renderCatalogue(){
 const host=document.getElementById('v-catalogue');
 host.innerHTML=`<div class="vintro"><b>What is attested as his, on whose authority, and with what confidence?</b> The ${H.attested} entries, on their subject shelves. Each shelf’s bar shows how much of it is <span style="color:#3a7a45">located</span> versus <span style="color:#9a7b32">still only attested</span> &mdash; the shares differ sharply by shelf, a pattern shaped both by what reached the Prague Jesuits and by how this list was compiled; like every figure on this page, a shelf’s located share is a property of the compilation, not a survival rate.</div>
  <div class="layout"><aside class="facets" id="cfacets"></aside>
   <div><input id="csearch" placeholder="Search title, author, subject, cat no…"><div class="cnt" id="ccount"></div><div id="cresults"></div></div></div>`;
 document.getElementById('csearch').addEventListener('input',e=>{CAT.q=e.target.value.toLowerCase().trim();drawCatalogue();});
 drawCatalogue();}
function drawCatalogue(){
 const fac=document.getElementById('cfacets');fac.innerHTML='';
 const statuses=[...new Set(E.map(statusLabel))];
 facetGroup(fac,'Status','status',statuses,statusGloss);
 facetGroup(fac,'Confidence','grade',['A','B','C','D']);
 fac.innerHTML+=`<div style="font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5">The A&#8211;D grade is how confidently the entry can be asserted as a book Tycho genuinely owned: A the strongest evidence, D the weakest.</div>`;
 const srcs=[...new Set(E.map(e=>srcFamily(e.source)))].sort();
 facetGroup(fac,'Source','src',srcs);
 const types=[...new Set(E.map(e=>e.type))];
 facetGroup(fac,'Type','type',types);
 fac.innerHTML+=`<span class="clear" onclick="catClear()">clear all filters</span>`;
 const shown=E.filter(catMatch);
 document.getElementById('ccount').innerHTML=`${shown.length} of ${E.length} entries`;
 const byShelf={};shown.forEach(e=>{(byShelf[shelfOf(e.subject)]=byShelf[shelfOf(e.subject)]||[]).push(e);});
 const order=SHELF_ORDER.filter(s=>byShelf[s]);
 let h='';
 order.forEach(sh=>{
  const all=E.filter(e=>shelfOf(e.subject)===sh);
  const loc=all.filter(isOwn).length,rest=all.length-loc;
  const locPct=Math.round(loc/all.length*100);
  h+=`<div class="shelf"><div class="shead"><span class="sname">${esc(sh)}</span><span class="scnt">${byShelf[sh].length} shown &middot; of ${all.length}: ${loc} located / ${rest} attested-or-lost</span></div>
   <div class="biasbar"><div class="bias-loc" style="width:${locPct}%"></div><div class="bias-gho" style="width:${100-locPct}%"></div></div>
   <div class="bias-leg">${locPct}% of this shelf is located as his own</div>
   <div class="cards" style="margin-top:10px">${byShelf[sh].map(catCard).join('')}</div></div>`;});
 document.getElementById('cresults').innerHTML=h||'<div class="cnt">No entries match these filters.</div>';}

// ---- The Bindings (entries ↔ volumes) ----
function ownVolMap(){const m={};E.filter(isOwn).forEach(e=>(e.survivor_ids||[]).forEach(sid=>{if(isOwnVol(sid))(m[sid]=m[sid]||[]).push(e);}));return m;}
/* marks_securing_id welds three things into one string: the house's summary of the
   marks, the binding period, and — after " || " — a verbatim quotation of the Prague
   catalogue's provenance note, in Czech. Clipped at 220 characters the card cut inside
   the label, so the collection's most important volume read "…copy-level provenance
   note, verbatim: Na titulním listě…". The three are separated here, at render; the
   store keeps the quotation intact, because it is a quotation. */
function marksParts(m){const [head,tail]=String(m||'').split(' || ');
 const bp=/\s\|\sbinding period:\s(.+)$/.exec(head||'');
 return {mark:(bp?head.slice(0,bp.index):(head||'')).trim(), period:bp?bp[1].trim():'', note:(tail||'').trim()};}
function volCard(sid,ents){const s=SVById[sid]||{};const inst=((IN[s.institution]||{}).name)||s.institution_raw||'';
 const p=marksParts(s.marks_securing_id);
 return `<div class="band"><h4>${esc(s.shelfmark||sid)} <span style="font-size:11.5px;color:var(--muted)">${esc(inst)}${s.id_confidence?' &middot; <span title="How confidently this volume is identified as Tycho&#39;s own copy, graded from A (strongest evidence) down to D (weakest).">identification '+s.id_confidence+'</span>':''}</span></h4>`+
  (p.mark?`<div style="font-size:12px;color:var(--muted)">${clip(p.mark,220)}</div>`:'')+
  (p.period?`<div class="mk"><b>Binding:</b> ${esc(p.period)}</div>`:'')+
  `<div class="works">${ents.map(e=>`<span onclick="openE('${e.id}')">${esc((e.author_identified||e.title_transcribed||e.id).slice(0,46))}</span>`).join('')}</div></div>`;}
/* The dated T.B.O. stamps actually borne by the volumes catalogued here, counted from the
   store rather than typed — with any year the identification key's periods do not cover
   named as such. */
function tboYears(){
 const yrs={};
 const scan=t=>{(String(t||'').match(/T\.?B\.?O\.?[\s,]*1\d{3}/g)||[]).forEach(m=>{
   const y=m.match(/1\d{3}/)[0]; yrs[y]=(yrs[y]||0)+1;});};
 E.forEach(e=>{const m=e.marks||{};scan(m.inscription);scan(m.binding);scan(m.annotations);});
 SV.forEach(s=>{scan(s.marks_securing_id);scan(s.notes);});
 const years=Object.keys(yrs).sort();
 if(!years.length)return '';
 // a year is "covered" if it falls inside some period's date span
 const spans=(HIST.mark_chronology||[]).map(mk=>{
   const d=String(mk.dates||'').match(/1\d{3}/g)||[];
   return d.length?{lo:+d[0],hi:+d[d.length-1],p:mk.period}:null;}).filter(Boolean);
 const uncovered=years.filter(y=>!spans.some(s=>+y>=s.lo&&+y<=s.hi));
 return `<div class="mk" style="margin-top:8px"><b>Dated stamps on the volumes catalogued here:</b> `+
  years.map(y=>`T.B.O. ${esc(y)} <span style="color:#999">(${yrs[y]})</span>`).join(' &middot; ')+
  (uncovered.length?` &mdash; note that ${uncovered.length===1?'one of these years, <b>'+esc(uncovered[0])+'</b>, falls':'the years <b>'+uncovered.map(esc).join(', ')+'</b> fall'} outside every period the key defines above. The periodisation is a model of the bindery, and the volumes do not fit it exactly.`:'')+
  `</div>`;}
function renderBindings(){
 const host=document.getElementById('v-bindings');const m=ownVolMap();
 const sammel=Object.entries(m).filter(([,es])=>es.length>1).sort((a,b)=>b[1].length-a[1].length);
 const singles=Object.entries(m).filter(([,es])=>es.length===1);
 let h=`<div class="vintro"><b>How do ${H.located_own} located works sit in ${H.own_volumes} surviving volumes &mdash; and how do we know each volume was his?</b> A work is not a volume: ${sammel.length} of these volumes carry more than one itemised work. The division below follows this catalogue&rsquo;s itemisation, not the physical bindings alone &mdash; several volumes listed with a single work are physically Sammelb&auml;nde whose other constituents have not yet been itemised.</div>`;
 // identification key
 if(HIST.mark_chronology){
  h+=`<div class="keybox"><h4>Recognising a Tycho volume &mdash; the ownership marks</h4>
   <div class="mk" style="margin:-2px 0 8px">The periodisation is Prandtl&rsquo;s; the numbering is this reconstruction&rsquo;s own, and the copy cards below use the same scale.</div>
   <table class="keytab"><tr><th>Period</th><th>Dates</th><th>Mark</th><th>Indicates</th></tr>`+
   HIST.mark_chronology.map(mk=>`<tr><td>${esc(mk.period)}</td><td>${esc(mk.dates)}</td><td><b>${esc(mk.mark)}</b></td><td style="color:var(--muted)">${esc(mk.indicates)}</td></tr>`).join('')+`</table>`+
   /* The key's periods are the scholarship's; the years below are OUR volumes'. They are
      derived, so the key can never drift from the books it indexes — and where a stamped
      year falls outside every period the key defines, the reader is told so rather than
      left to find a hole. The T.B.O. 1583 Astronomicum Caesareum is exactly such a case. */
   tboYears()+
   (HIST.mark_checklist?`<div class="mk" style="margin-top:8px"><b>Recognition checklist:</b><ul style="margin:6px 0 0;padding-left:18px">`+HIST.mark_checklist.map(c=>`<li style="margin:3px 0">${esc(c)}</li>`).join('')+`</ul></div>`:'')+
   `<div class="mk" style="margin-top:8px"><b>The identification grades:</b> each copy card below carries a grade for how confidently the volume is identified as Tycho&rsquo;s own copy, from A (strongest evidence) down to D (weakest) &mdash; the same A&#8211;D scale the catalogue uses for how confidently an entry is asserted as a book he owned.</div>`+
   `<div class="mk" style="margin-top:8px;border-top:1px solid #cfd8e6;padding-top:8px"><b>The fabrication guard:</b> an &ldquo;Ex Bibliotheca Tychoniana&rdquo; stamp is not proof of Tycho’s ownership &mdash; the Jesuit collection kept growing after he died. Sign. 14 J 199 (below) is a 1606 Kepler imprint, printed five years after Tycho’s death; it is a located volume of the collection’s afterlife, not one of his books.</div></div>`;}
 // sammelbands
 h+=`<h3 style="font-family:Georgia,serif;font-weight:normal">Volumes carrying more than one itemised work &mdash; ${sammel.length}, binding ${sammel.reduce((t,[,es])=>t+es.length,0)} works between them</h3>`;
 h+=sammel.map(([sid,es])=>volCard(sid,es)).join('');
 // singles
 h+=`<h3 style="font-family:Georgia,serif;font-weight:normal;margin-top:22px">Volumes with a single itemised work &mdash; ${singles.length}</h3><div class="cards">`+
  singles.map(([sid,es])=>{const e=es[0];const s=SVById[sid]||{};
   return `<div class="card" onclick="openE('${e.id}')"><h4>${esc((e.author_identified||e.title_transcribed||'').slice(0,60))}</h4><div class="meta">${esc(s.shelfmark||'')} &middot; ${esc(((IN[s.institution]||{}).name)||s.institution_raw||'')}</div></div>`;}).join('')+`</div>`;
 // honest remainder foot-bands
 const afterlife=SV.filter(s=>rclass(s)==='afterlife_volume');
 const ruled=SV.filter(s=>rclass(s)==='rejected_copy');
 if(afterlife.length){h+=`<h3 style="font-family:Georgia,serif;font-weight:normal;margin-top:22px">The collection’s afterlife &mdash; ${afterlife.length} located, but not his</h3>`+
  afterlife.map(s=>`<div class="band foot"><h4>${esc(s.shelfmark||s.id)} <span class="b afterlife">afterlife</span></h4><div style="font-size:12.5px;color:var(--muted)">${clip(s.notes||marksParts(s.marks_securing_id).mark,240)}</div></div>`).join('');}
 if(ruled.length){h+=`<h3 style="font-family:Georgia,serif;font-weight:normal;margin-top:22px">Examined and ruled out &mdash; ${ruled.length} copies</h3>`+
  ruled.map(s=>`<div class="band foot"><h4>${esc(s.shelfmark||s.id)} <span class="b rejected">not a Tycho copy</span></h4><div style="font-size:12.5px;color:var(--muted)">${clip(marksParts(s.marks_securing_id).mark||s.notes||'',240)}</div></div>`).join('');}
 host.innerHTML=h;}

// ---- The Map (dual-geography, ported; over tycho_volume only) ----

"Venice":[45.4408,12.3155],"Tübingen":[48.5216,9.0576],"Paris":[48.8566,2.3522],"Rostock":[54.0887,12.1405],

"Antwerp":[51.2194,4.4025],"Heidelberg":[49.3988,8.6724],"Cologne":[50.9375,6.9603],"Uraniborg":[55.9067,12.6967],
"Rome":[41.9028,12.4964],"Frankfurt":[50.1109,8.6821],"Zürich":[47.3769,8.5417],"Leiden":[52.1601,4.4970],

function acqNorm(p){p=(p||'').split(' (')[0].trim();if(p==='Frankfurt am Main')p='Frankfurt';return p;}
function drawMap(){
 const sec=document.getElementById('v-map');
 sec.innerHTML=`<div class="vintro"><b>Where did his books come from, and where are they now?</b> Toggle between the European book trade he bought into and where the volumes survive today &mdash; overwhelmingly the Prague Clementinum, which received the Jesuit gift in 1642 (the east-bank college was spared the 1648 Swedish sack).</div>
  <div class="maptoggle" id="mapToggle"><button class="mtbtn on" data-l="survive">Where it survives</button><button class="mtbtn" data-l="acquire">Where acquired</button></div>
  <div id="map"></div><div class="cnt" id="survcount" style="margin-top:10px"></div>`;
 const map=L.map('map',{attributionControl:false}).setView([50,11],4);
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{subdomains:'abcd',maxZoom:12,attribution:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors'}).addTo(map);
 const OWN=SV.filter(s=>isOwnVol(s.id));let layer=null;
 function surviveLayer(){const byInst={};OWN.forEach(s=>{if(s.institution)(byInst[s.institution]=byInst[s.institution]||[]).push(s);});
  const g=L.layerGroup();
  Object.entries(byInst).forEach(([iid,list])=>{const i=IN[iid];if(!i||i.lat==null)return;
   L.circleMarker([i.lat,i.lon],{radius:6+Math.sqrt(list.length)*3,color:'#9a7b32',fillColor:'#c9a23f',fillOpacity:.78,weight:1.5}).addTo(g)
    .bindPopup(`<b>${esc(i.name)}</b><br>${esc(i.city)}, ${esc(i.country)}<br>${list.length} surviving volume${list.length==1?'':'s'}`+
     (iid==='NKP'?`<br><a onclick="show('catalogue')" style="cursor:pointer">see the Prague works &rarr;</a>`:'')+`<br>`+
     list.slice(0,8).map(s=>`<a onclick="openE('${esc(s.entry_id)}')" style="cursor:pointer">${esc(titleOf(s.entry_id).slice(0,40))}</a>`).join('<br>'));});
  const unm=OWN.filter(s=>{const i=IN[s.institution];return !i||i.lat==null;}).length;
  const sc=document.getElementById('survcount');
  sc.textContent=`${OWN.length} surviving volumes across ${Object.keys(byInst).length} mapped institutions — overwhelmingly the Prague Clementinum`+(unm?` · ${unm} in private hands, off the map`:'');
  return g;}
 function acquireLayer(){const byPlace={};E.filter(isOwn).forEach(e=>{const p=acqNorm((e.acquisition||{}).place);if(p&&ACQ_GAZ[p])(byPlace[p]=byPlace[p]||[]).push(e);});
  const g=L.layerGroup();
  Object.entries(byPlace).forEach(([p,list])=>{const c=ACQ_GAZ[p];
   L.circleMarker([c[0],c[1]],{radius:5+Math.sqrt(list.length)*2.6,color:'#2c5fa3',fillColor:'#4d82c8',fillOpacity:.72,weight:1.5}).addTo(g)
    .bindPopup(`<b>${esc(p)}</b><br>${list.length} book${list.length==1?'':'s'} acquired here<br>`+
     list.slice(0,8).map(e=>`<a onclick="openE('${esc(e.id)}')" style="cursor:pointer">${esc((e.author_identified||e.title_transcribed||e.id).slice(0,40))}</a>`).join('<br>'));});
  const placed=Object.values(byPlace).reduce((t,l)=>t+l.length,0);
  document.getElementById('survcount').textContent=`${placed} books mapped to ${Object.keys(byPlace).length} places of acquisition — the European book trade Tycho bought into`;
  return g;}
 function setL(w){if(layer)map.removeLayer(layer);layer=(w==='acquire'?acquireLayer():surviveLayer()).addTo(map);
  document.querySelectorAll('#mapToggle .mtbtn').forEach(b=>b.classList.toggle('on',b.dataset.l===w));}
 document.querySelectorAll('#mapToggle .mtbtn').forEach(b=>b.onclick=()=>setL(b.dataset.l));
 setL('survive');}

// ---- The Reading Hand (ported) ----
function renderHand(){
 const host=document.getElementById('v-hand');
 /* record_class filter: only books he owned. The collection's afterlife includes a
    1606 Kepler imprint — the volume the Bindings view uses to prove that a
    Tychoniana stamp is not ownership — and it must not be counted as one he read. */
 const scans=SV.filter(s=>s.annotation_scan&&rclass(s)==='tycho_volume').map(s=>({s,a:s.annotation_scan})).sort((x,y)=>(y.a.confident||0)-(x.a.confident||0));
 const totScan=scans.length,totPages=scans.reduce((t,x)=>t+(x.a.scanned_pages||0),0),totAnn=scans.reduce((t,x)=>t+(x.a.confident||0),0);
 const maxc=scans.length?(scans[0].a.confident||1):1;
 let h=`<div class="vintro"><b>Which of these books did Tycho actually read, pen in hand?</b> Of the located survivors, <b>${totScan}</b> have been page-scanned for manuscript annotation &mdash; <b>${NF(totPages)}</b> pages examined, <b>${NF(totAnn)}</b> of them carrying handwriting. The scan finds where the writing is; it does not say whose it is. Some of it is certainly Tycho&rsquo;s &mdash; an early hand on the title-page of his Ptolemy (Sign. 5 B 70) records that <i>marginales notae sunt Tichonis Brahe</i> &mdash; but these volumes also carry an earlier owner&rsquo;s hand, and the Jesuits&rsquo; own accession notes. Read the figure as pages worth examining, not as pages in his hand, and follow the surrogate to judge for yourself. Ranked by annotated-page count.</div>`;
 /* No quotations here: a scan's transcriptions are machine readings of hands nobody
    has adjudicated, and are stripped from the payload. A row reports where the marks
    are and what kind they are — checkable against the surrogate. */
 const KIND={marginalia:'marginalia',interlinear:'interlinear notes',underline_or_mark:'underlining',
  correction:'corrections',diagram_table:'diagrams and tables',inscription:'ownership inscriptions',
  stamp_seal:'stamps',other:'other marks'};
 scans.forEach(({s,a})=>{const e=EByID[s.entry_id]||{};const inst=((IN[s.institution]||{}).name)||s.institution_raw||'';
  const pct=maxc?Math.round(a.confident/maxc*100):0;
  /* Page lists are sorted numerically, and only the first three show: a scholar reads
     them as "start here" and turns to the surrogate. Unsorted they printed in payload
     order — "p. 299, 74, 27" — which is three arbitrary pages, not the first three. */
  const by={};(a.notable||[]).forEach(n=>{(n.kinds||[]).forEach(k=>{(by[k]=by[k]||[]).push(n.page);});});
  Object.keys(by).forEach(k=>by[k].sort((x,y)=>(Number(x)||0)-(Number(y)||0)));
  const marks=Object.keys(by).sort((x,y)=>by[y].length-by[x].length)
   .map(k=>`${KIND[k]||esc(k)} <span style="color:#999">(p.&thinsp;${by[k].slice(0,3).map(p=>esc(String(p))).join(', ')}${by[k].length>3?'&hellip;':''})</span>`)
   .join(' &middot; ');
  const links=[];
  if(s.iiif_manifest)links.push(`<a href="${esc(s.iiif_manifest)}" target="_blank">IIIF</a>`);
  if(s.graphonomicon_specimen)links.push(`<a href="${GRAPH_BASE}${esc(s.graphonomicon_key||'')}/explorer.html?specimen=${esc(s.graphonomicon_specimen)}" target="_blank">&#9997; hand</a>`);
  h+=`<div class="rh-row" onclick="openE('${esc(s.entry_id)}')"><div><div class="rh-t">${esc(titleOf(s.entry_id))}</div>`+
   `<div class="rh-sub">${esc(s.shelfmark||'')}${inst?' &middot; '+esc(inst):''}${e.edition?' &middot; '+esc(e.edition):''}</div>`+
   (marks?`<div class="rh-marks"><b>Marks recorded:</b> ${marks}</div>`:'')+
   (links.length?`<div class="rh-links" onclick="event.stopPropagation()">${links.join(' &middot; ')}</div>`:'')+`</div>`+
   `<div><div class="rh-bar"><div class="rh-fill" style="width:${pct}%"></div></div><div class="rh-num"><b>${a.confident}</b> annotated / ${a.scanned_pages} pp${a.possible?` (+${a.possible} faint)`:''}</div></div></div>`;});
 host.innerHTML=h;}

// ---- The Unfound (honest remainder) ----
function ufRow(e){const let_=(e.concordance||{}).tekstnet_letter;
 return `<div class="uf-row" onclick="openE('${e.id}')"><div class="t">${esc(e.author_identified||e.title_transcribed||e.cat_no)}</div>`+
  `<div class="a">${esc(srcFamily(e.source))}${e.edition?' &middot; '+esc(e.edition):''}${e.editorial_note?' &middot; '+clip(e.editorial_note,150):''}`+
  (let_?` &middot; <a href="../../epistolarium/index.html?letter=${esc(let_)}" onclick="event.stopPropagation()" style="color:var(--gold-text)">attesting letter &rarr;</a>`:'')+`</div></div>`;}
function renderUnfound(){
 const host=document.getElementById('v-unfound');
 const ghosts=E.filter(e=>e.status==='ghost');
 const findable=ghosts.filter(e=>!e.unlocatable);
 const retired=ghosts.filter(e=>e.unlocatable);
 const lost=E.filter(e=>e.status==='lost');
 const disputed=E.filter(e=>e.status==='disputed');
 let h=`<div class="vintro"><b>Which attested books are still missing &mdash; and what attests each one?</b> The honest remainder: ${H.missing} titles have no located copy. ${findable.length} are judged findable (a title, an attestation, a last-known trace), ${retired.length} are retired as unlocatable (a mass-survival text with no ownership mark to key a search on), and ${lost.length} are recorded as lost.</div>`;
 h+=`<div class="uf-group"><h3>Findable &mdash; ${findable.length} titles with a trace to follow</h3>`+findable.map(ufRow).join('')+`</div>`;
 h+=`<div class="uf-group"><h3>Retired as unlocatable &mdash; ${retired.length}</h3><div class="cnt">No findable ownership mark: a mass-survival text carries no cataloguer flag to distinguish Tycho’s copy.</div>`+retired.map(ufRow).join('')+`</div>`;
 h+=`<div class="uf-group"><h3>Recorded as lost &mdash; ${lost.length}</h3>`+lost.map(ufRow).join('')+`</div>`;
 h+=`<div class="uf-group"><h3>Disputed identifications &mdash; ${disputed.length}</h3><div class="cnt">Ownership or identity contested; kept out of the located count.</div>`+disputed.map(ufRow).join('')+`</div>`;
 host.innerHTML=h;}


// ---- modal (ported) ----

window.openE=id=>{const e=EByID[id];if(!e)return;const sv=SVByEntry[id]||[];
 const conc=Object.entries(e.concordance||{}).filter(([k,v])=>v).map(([k,v])=>`${k}: ${esc(v)}`).join(' · ');
 const st=statusLabel(e);
 const attMap={'Prandtl 1932':'1932 — Prandtl’s inventory of the surviving bound volumes',
  'Kleinschnitzová 1933':'1933 — Kleinschnitzová’s census of the Prague survivors',
  'Šolc 2002':'2002 — Šolc’s extension of the Prague census',
  'Norlind 1970':'1970 — Norlind’s reconstructed catalogue (Bilaga I)',
  'Correspondence':'attested in Tycho’s correspondence',
  'Mortensen':'Mortensen, Fra Tycho Brahes Bogsamling',
  'Gingerich 2002':'2002 — Gingerich, Recent Notes on Tycho’s Library'};
 const att=attMap[srcFamily(e.source)]||esc(e.source);
 const kv=[['Author',e.author_identified],['Title',e.title_transcribed],['Type',e.type],
  ['Edition',e.edition],['Subject',e.subject],
  ['Acquired',[e.acquisition&&e.acquisition.date,e.acquisition&&e.acquisition.place].filter(Boolean).join(', ')],
  ['Attested',att],['Concordance',conc],
  ['Status',statusGloss(st)+' · entry confidence '+e.confidence]].filter(x=>x[1]);
 /* No second scrub here. The desk stamps are stripped once, at emit, by _scrub_note —
    so they are absent from data.json too, not merely hidden from the page. A client-side
    scrub would have kept them in the published payload and only wiped them off the screen. */
 const note=(e.editorial_note||'').trim();
 if(note)kv.push(['Editorial note',note]);
 let h=`<button class="x" onclick="closeM()">×</button><h2>${esc(e.author_identified||e.title_transcribed||e.cat_no)}</h2>
  <div style="font-size:12px;color:var(--gold-text);font-family:ui-monospace,monospace">${esc(e.id)}</div>
  <dl class="kv">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
 if(sv.length){h+=`<div class="src"><b>Surviving copies</b>`+sv.map(s=>{
   const fed=[];
   if(s.permalink)fed.push(`<a href="${esc(s.permalink)}" target="_blank">catalogue</a>`);
   if(s.online_viewer)fed.push(`<a href="${esc(s.online_viewer)}" target="_blank">view online</a>`);
   if(s.iiif_manifest)fed.push(`<a href="${esc(s.iiif_manifest)}" target="_blank">IIIF</a>`);
   if(s.graphonomicon_specimen)fed.push(`<a href="${GRAPH_BASE}${esc(s.graphonomicon_key||'')}/explorer.html?specimen=${esc(s.graphonomicon_specimen)}" target="_blank">&#9997; hand specimen</a>`);
   const cls=rclass(s);const tag=cls==='rejected_copy'?' <span class="b rejected">not a Tycho copy</span>':cls==='afterlife_volume'?' <span class="b afterlife">collection afterlife</span>':'';
   const p=marksParts(s.marks_securing_id);
   /* The Czech provenance note is a verbatim quotation of the Prague catalogue, so it
      is set apart and given its source — not run together with our own summary of the
      marks, where a reader cannot tell whose sentence he is reading. */
   const cat=p.note?`<div style="margin-top:4px;padding-left:9px;border-left:2px solid var(--line);color:var(--muted);font-size:12px">
     <i>Prague catalogue (National Library, Staré tisky), copy-level provenance note, verbatim:</i><br>${
     p.note.replace(/^[^:]*verbatim:\s*/i,'').split(' | ').map(x=>esc(x)).join('<br>')}</div>`:'';
   return `<div style="margin-top:6px">📕 ${esc(s.institution_raw||(IN[s.institution]||{}).name||'?')}${s.shelfmark?' — '+esc(s.shelfmark):''}${tag}<br>
    <span style="color:var(--muted)">${esc(p.mark)||'marks: —'}${p.period?' · binding '+esc(p.period):''} · <span title="How confidently this volume is identified as Tycho&#39;s own copy, graded from A (strongest evidence) down to D (weakest).">identification ${s.id_confidence}</span></span>${fed.length?' · '+fed.join(' · '):''}${cat}</div>`;}).join('')+`</div>`;}
 if(e.census_key&&DATA.census_meta&&DATA.census_meta[e.census_key]){const cm=DATA.census_meta[e.census_key];
  h+=`<div class="src"><b>Census</b> — <a href="../../census/${esc(e.census_key)}/explorer.html" target="_blank" style="color:var(--gold-text)">${esc(cm.title)} &#8599;</a> <span style="color:var(--muted);font-size:11px">&middot; ${cm.copies} cop${cm.copies==1?'y':'ies'}</span></div>`;}
 // cross-pillar bridge: a survivor that is a leaf bound in one of Tycho's own
 // observation codices (one physical object, two pillars)
 {const oc=sv.find(s=>/GKS 318/.test(s.shelfmark||''));
  if(oc)h+=`<div class="src"><b>Also an observation codex</b> — this leaf is bound at <b>${esc(oc.shelfmark)}</b>, inside one of Tycho's own observation volumes. <a href="../../observationes/volumes/index.html#vc-O_GKS318" target="_blank" style="color:var(--gold-text)">See it in Observationes &#8599;</a></div>`;}
 h+=`<div class="permalink">explorer.html?entry=${esc(e.id)}</div>`;
 document.getElementById('modal').innerHTML=h;document.getElementById('modalbg').style.display='flex';
 try{history.replaceState(null,'','?entry='+e.id);}catch(err){}};
window.closeM=()=>{document.getElementById('modalbg').style.display='none';try{history.replaceState(null,'',location.pathname);}catch(e){}};
document.getElementById('modalbg').onclick=e=>{if(e.target.id=='modalbg')closeM();};


const RENDER={fate:renderFate,catalogue:renderCatalogue,bindings:renderBindings,
 map:()=>{},hand:renderHand,unfound:renderUnfound};
renderFate();rendered.fate=true;
// deep-link ?entry=
const qp=new URLSearchParams(location.search).get('entry');
if(qp&&EByID[qp]){show('catalogue');setTimeout(()=>openE(qp),60);}
