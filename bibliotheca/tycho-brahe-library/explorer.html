ond":"","ussher":""},"concordance":{"norlind_headword":"kepler-mysterium"},"census_key":"","survivor_ids":[],"editorial_note":"Kepler's celebrated first work. Confirmed in Tycho's hands by the correspondence: Kepler sent it with his first letter (brahe-t_15971213001, 1597), and Tycho replies he had already seen/read it (brahe-t_15980401001, 1598: 'Librum tuum, quem Prodromum vocas Dissertationum Cosmographicarum, iam ante videram'). Kepler then joined Tycho at Prague 1600. (Norlind's note that no dedication copy came at first stands, but a copy did reach him.) Present copy unlocated. The Tuebingen 1596 edition is not held by the Czech National Library."},{"id":"e-norlind-krabbe-observations","key":"tycho-brahe-library","cat_no":"Norlind-krabbe-observations","type":"Manuscript","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"located","confidence":"A","author_identified":"Johannes Krabbe","title_transcribed":"Manuscript of solar/lunar eclipse observations","title_normalized":"","edition":"1600","subject":"Astronomy (observations)","acquisition":{"date":"","place":"Wolfenbüttel","channel":"","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"krabbe-observations"},"census_key":"","survivor_ids":["s-krabbe-kb-gks318"],"editorial_note":"In April 1600 Tycho wrote to Rollenhagen in Magdeburg (Opera VIII,295) asking him to obtain Johannes Krabbe's careful observations of solar and lunar eclipses -- and the method by which they had been made, since he wanted them in order to fix the meridian difference between the two observing places. Rollenhagen evidently succeeded: bound among Tycho's own observation-books, at KB Copenhagen, GKS 318 2°, fol.159r (Norlind 1970, Bilaga I, s.v. Krabbe), is a leaf headed 'Observationes aliquot Eclipsium Solis et Lunae per Joh. Krabbe, mathematicum ducis H. Julii factae' -- seven lunar and six solar eclipses, 1581-1600 -- carrying Tycho's autograph marginalia. The last observation is of 30 June 1600, so the material reached him some time after that date."},{"id":"e-norlind-pagnini-thesaurus","key":"tycho-brahe-library","cat_no":"Norlind-pagnini-thesaurus","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Sante Pagnini","title_transcribed":"Thesaurus linguae sanctae","title_normalized":"","edition":"1529","subject":"Hebrew lexicography","acquisition":{"date":"","place":"Lyon","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"pagnini-thesaurus"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Någon upplaga har väl ägts av Tycho, som citerar Pagninus' in biblical exegesis (letter to Peucer 1590, Opera VII,234) — probably owned some edition; suggests Tycho had some Hebrew.","unlocatable":true},{"id":"e-norlind-peucer-dimensione","key":"tycho-brahe-library","cat_no":"Norlind-peucer-dimensione","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Caspar Peucer","title_transcribed":"De dimensione terrae et geometrice numerandis locorum intervallis","title_normalized":"","edition":"1550","subject":"Geodesy/Geometry","acquisition":{"date":"","place":"Wittenberg","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"peucer-dimensione"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Har väl Tycho ägt i någon upplaga' — probably owned some edition; cf. Prog. III,146. (Distinct from the located Peucer volumes in the Clementinum spine.)","unlocatable":true},{"id":"e-norlind-praetorius-decometis","key":"tycho-brahe-library","cat_no":"Norlind-praetorius-decometis","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Johannes Praetorius","title_transcribed":"De cometis qui antea visi sunt et de eo qui ... Novembri apparuit, narratio","title_normalized":"","edition":"1578","subject":"Astronomy (comet)","acquisition":{"date":"","place":"Nürnberg","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"praetorius-decometis"},"census_key":"","survivor_ids":[],"editorial_note":"Treated at length in comet-book IV,356-358 (cf. Prog. III,153-157). Thorndike (History of Magic VI, p.8) claimed neither Tycho nor Hagecius owned a copy; Norlind shows Thorndike misunderstood the three correspondence passages (Opera VII,120/147/212), which concern Apianus and Pena, not this book — i.e. Norlind defends Tychonic ownership against Thorndike's denial. A copy-level check of the Czech National Library's old-print catalogue finds the work as the fourth tract (doc 000030674) of the Jesuit-College-Chomutov Hagecius composite (host volume, doc 000030653); it bears no Tycho mark."},{"id":"e-norlind-rheticus-opuspalatinum","key":"tycho-brahe-library","cat_no":"Norlind-rheticus-opuspalatinum","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Georg Joachim Rheticus (compl. L.V. Otho)","title_transcribed":"Opus palatinum de triangulis","title_normalized":"","edition":"1596","subject":"Trigonometry/Tables","acquisition":{"date":"","place":"Neustadt","channel":"","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"rheticus-opuspalatinum"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'kanske detta stora verk som Tycho erhöll som gåva av lantgreve Moritz' — perhaps the 'Opus illud Palatinum' Tycho received as a gift from Landgrave Moritz and thanked him for (Nov 1600, Opera VIII,388; the relevant lines struck in the draft). The Czech National Library holds two copies of the Neustadt/Harnisch 1596 edition -- 14 A 12, complete, and doc 000097869, defective -- but neither record carries a provenance field, only binding, pagination and defect notes. The edition survives; no Tycho-marked copy of it does."},{"id":"e-norlind-valles-sacraphilosophia","key":"tycho-brahe-library","cat_no":"Norlind-valles-sacraphilosophia","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Francisco Valles (Vallesius)","title_transcribed":"De iis quae scripta sunt physice in libris sacris, sive de sacra philosophia","title_normalized":"","edition":"1588","subject":"Natural philosophy/Theology","acquisition":{"date":"","place":"Lyon","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"valles-sacraphilosophia"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Tycho, som möjligen ägt upplagan 1588' (2nd ed., Lyon) — possibly owned; discusses Valles' view that the 1572 nova was not new in Prog. III,87-93.","unlocatable":true},{"id":"e-norlind-paracelsus-biblia","key":"tycho-brahe-library","cat_no":"Norlind-paracelsus-biblia","type":"Manuscript","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"disputed","confidence":"C","author_identified":"Paracelsus (Theophrastus von Hohenheim)","title_transcribed":"Commentationes in integra Biblia (manuscript)","title_normalized":"","edition":"","subject":"Theology/Alchemy","acquisition":{"date":"","place":"","channel":"received/gift/exchange","channel_key":"AQ-FAIR"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"paracelsus-biblia"},"census_key":"","survivor_ids":[],"editorial_note":"The only authority is Joachim Morsius, who in 1625 -- in the dedication to the pseudo-Paracelsian lion-prophecy -- reported on Cort Aslakssøn's word that Tycho had owned a copy, and who further supposed that the manuscript was by then in Prague with Tycho's heirs. Norlind relays both. No inventory and no Clementinum catalogue records it, and no copy is locatable: the ownership is attested at second hand only, and remains unverified."},{"id":"e-ging-gemma-characterismis","key":"tycho-brahe-library","cat_no":"e-ging-gemma-characterismis","type":"Printed Book","source":"Gingerich 2002 (Recent Notes on Tycho Brahe's Library)","status":"located","confidence":"A","author_identified":"Cornelius Gemma","title_transcribed":"De naturae divinis characterismis, libri II (Antwerp, C. Plantin 1575)","title_normalized":"","edition":"1575","subject":"Natural philosophy","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"II","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Harald Mortensen collection, Copenhagen (recorded ~1955) → Martayan Lan, New York (Catalogue 28, 2001, item 55, offered $300,000) → private American collector","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"gemma-characterismis"},"census_key":"","survivor_ids":["s-ging-gemma"],"editorial_note":"A heavily Tycho-annotated copy; the autograph note on the 1572-nova section is quoted in the Progymnasmata. Provenance: Mortensen Copenhagen → Martayan Lan Cat.28 (2001) item 55 → private American collector. Identified by Gingerich 2002, p.326 (with colour plate)."},{"id":"e-ging-apianus-tbo1583","key":"tycho-brahe-library","cat_no":"e-ging-apianus-tbo1583","type":"Printed Book","source":"Gingerich 2002 (Recent Notes on Tycho Brahe's Library)","status":"located","confidence":"A","author_identified":"Peter Apianus (bound with Johann Schöner)","title_transcribed":"Astronomicum Caesareum (Ingolstadt 1540), bound with Schöner's equatorium (Nürnberg 1521)","title_normalized":"","edition":"1540","subject":"Astronomy/Instruments","acquisition":{"date":"","place":"","channel":"","channel_key":"AQ-DIRECT"},"dispersal":{"channel":"II","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Low Countries monastery library (until ~1960) → anonymous American collector (paid ~$1 million)","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-ging-apianus-tbo"],"editorial_note":"Tycho's own retained Astronomicum Caesareum (he gave a second copy to Paul Wittich; this is the one he kept). Surfaced ~2000 via a Belgian email enquiry to Gingerich, who recognised the 'T.B.O. 1583' binding stamp. Likely migrated to the Low Countries via the same Jesuit hands that carried the Wittich Copernicus. Distinct from the located Gotha copy (Prandtl Verz.A no.2, Band VI)."},{"id":"e-ging-apianus-wittich","key":"tycho-brahe-library","cat_no":"e-ging-apianus-wittich","type":"Printed Book","source":"Gingerich 2002 (Recent Notes on Tycho Brahe's Library)","status":"located","confidence":"A","author_identified":"Peter Apianus","title_transcribed":"Astronomicum Caesareum (Ingolstadt 1540) — Tycho's presentation copy to Paul Wittich","title_normalized":"","edition":"1540","subject":"Astronomy","acquisition":{"date":"","place":"","channel":"","channel_key":"AQ-DIRECT"},"dispersal":{"channel":"II","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Paul Wittich (gift from Tycho, ~1580, on leaving Hven) → ... → University of Chicago Library","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-ging-apianus-wittich"],"editorial_note":"Now at the University of Chicago Library. A princely gift from Tycho to Wittich on Wittich's departure from Hven; the book had cost Tycho 20 florins -- Gingerich's benchmark of an expensive book, against roughly one florin for a De revolutionibus (Annotated Census, p. XV); Tycho's own account of the purchase and the gift is in his letter to Hagecius (Norlind 1970, p. 337). It documents a book that passed through Tycho's library, dispersed by a gift in his lifetime rather than in the posthumous scattering."},{"id":"e-mort-kb-calvin-theocritus","key":"tycho-brahe-library","cat_no":"e-mort-kb-calvin-theocritus","type":"Printed Book","source":"Mortensen 1965 / Norlind (non-Prague located)","status":"located","confidence":"A","author_identified":"Jean Calvin; (bound with) Theocritus","title_transcribed":"Calvini Epistolae & responsa (Hanau 1597) bound with Theocriti Idyllia & Epigrammata (gr./lat., Heidelberg 1596)","title_normalized":"","edition":"1597","subject":"Reformed theology/Greek lyric","acquisition":{"date":"","place":"","channel":"","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-mort-kb-calvin"],"editorial_note":"A Tycho Sammelband repatriated from the USA (via Hjalmar Bruhn); the only book from his own library at KB besides the autograph observations. Gifted by Tycho to his cousin Hans Lindenov (pre-1599). Worn parchment binding, gilt portrait/arms supralibros. Mortensen 1965."},{"id":"e-mort-kb-fincke","key":"tycho-brahe-library","cat_no":"e-mort-kb-fincke","type":"Printed Book","source":"Mortensen 1965 / Norlind (non-Prague located)","status":"disputed","confidence":"C","author_identified":"Thomas Fincke","title_transcribed":"Geometriae rotundi libri XIIII (Basel 1583)","title_normalized":"","edition":"1583","subject":"Mathematics/Geometry","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-mort-kb-fincke","s-mort-kb-fincke-c2"],"editorial_note":"Thomas Fincke, Geometriae rotundi libri XIIII (Basel: S. Henricpetri, 1583), the major Danish trigonometry/geometry treatise, dedicated to Frederik II. Both KB copies have been examined through the EEB surrogates, and neither bears any Tycho ownership mark. Copy 1 (LN 599 4 ex.1): autograph 'Horrebow' (the 18th-c Danish Royal Astronomer family) on the title page + royal-cipher/BRH stamps; 18th-c marbled-board binding. Copy 2 (Hielmst. 1661a 4 / ex.2): a contemporary sammelband (Fincke 1583 + Ursus, Fundamentum astronomicum, Strasbourg 1588) in limp vellum, inscribed 'Severinus Pauli[?]... Lipsiae Anno Dni 158[3]' (mottoes 'Superna curato, Humana contemnito' / 'Mens generosa ultra polos') and 'Christiernus Joannis Hafniensis Anno 1620' (motto 'Ex uno omnia'), later Hielmstierne. Norlind nonetheless placed the book in Tycho's library -- 'fanns säkerligen i biblioteket på Uraniborg' (Bilaga I, p.345) -- but his whole basis is Fincke's printed praise of Tycho in the preface, a compliment present in every copy rather than a mark in any copy. No inventory, inscription or ownership mark attests Tycho's ownership, and neither surviving KB copy is his. No published census lists this work."},{"id":"e-mort-kb-flemlose","key":"tycho-brahe-library","cat_no":"e-mort-kb-flemlose","type":"Printed Book","source":"Mortensen 1965 / Norlind (non-Prague located)","status":"disputed","confidence":"C","author_identified":"Peder Jacobsen Flemløse","title_transcribed":"Ægloga de eclipsi solari anno 1574 ... futura","title_normalized":"","edition":"1574","subject":"Astronomy (eclipse)","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-mort-kb-flemlose"],"editorial_note":"Work-level Tychonic ownership is sound (the Aegloga is dedicated to Tycho, 17 Oct 1574; Flemloese became his first famulus 1578) -- but this copy is not demonstrably Tycho's. The only known surviving copy worldwide (unicum, per L. Nielsen via Norlind 1970 p.345) is KB Hielmst. 1226 4, an 18th-c Hielmstierne Danica acquisition with no Tycho mark; no Prague/Clementinum copy exists: the work is absent from Kleinschnitzová, Prandtl and Šolc, and the Czech National Library's owner index records no Brahe copy. Norlind uses no ownership verb: he infers only that a copy was 'högst troligt' on Hven, from the dedication, not that the KB copy is Tycho's. The copy is therefore rejected as Tycho's, while work-level ownership is retained at grade C."},{"id":"e-mort-frederiksborg-agrippa","key":"tycho-brahe-library","cat_no":"e-mort-frederiksborg-agrippa","type":"Printed Book","source":"Mortensen 1965 / Norlind (non-Prague located)","status":"located","confidence":"A","author_identified":"Heinrich Cornelius Agrippa von Nettesheim","title_transcribed":"Opera, tomus I (Lyon, ca. 1550, 8vo)","title_normalized":"","edition":"1550","subject":"Occult philosophy","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Sigurd Wandel (prof.; bought in Germany) -> Harald Mortensen -> Frederiksborgmuseet (gift 1950)","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-mort-frederiksborg-agrippa"],"editorial_note":"Agrippa Opera I at the Frederiksborg Tycho-Brahe display (formerly Mortensen's). Distinct from the Prague Prachtband Agrippa (Prandtl A-48 / Band XX, folio). Mortensen 1965 (the copy Gingerich cites as 'Mortensen 1932')."},{"id":"e-mort-tuwien-alphonsine","key":"tycho-brahe-library","cat_no":"e-mort-tuwien-alphonsine","type":"Printed Book","source":"Mortensen 1965 / Norlind (non-Prague located)","status":"located","confidence":"A","author_identified":"(Alfonso X) — Alphonsine Tables","title_transcribed":"Tabulae Alphonsinae","title_normalized":"","edition":"1492 (Venice: Hamman, ed. Santritter)","subject":"Astronomy/Tables","acquisition":{"date":"","place":"","channel":"","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-mort-tuwien-alphonsine"],"editorial_note":"The Alphonsine Tables at TU Wien, heavily annotated by Tycho; dedicated to him by the Skåne judge Lave Urne (1539-1625) in 1590; formerly the Prague Jesuit College. Mortensen 1965. Distinct from the 1600 Bavarian-ducal loan copy (No.43)."},{"id":"e-onb-commentariolus","key":"tycho-brahe-library","cat_no":"e-onb-commentariolus","type":"Manuscript","source":"Norlind (located Vienna)","status":"located","confidence":"C","author_identified":"Nicolaus Copernicus","title_transcribed":"Commentariolus (De hypothesibus motuum coelestium ... commentariolus) — manuscript","title_normalized":"","edition":"","subject":"Astronomy","acquisition":{"date":"","place":"","channel":"","channel_key":"AQ-ABSORB"},"dispersal":{"channel":"IV","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-onb-commentariolus"],"editorial_note":"A Commentariolus manuscript located at Vienna (Norlind) — Tycho demonstrably had a Commentariolus copy (he printed its text in the Progymnasmata). Whether the surviving Vienna ÖNB Commentariolus is specifically Tycho's remains unconfirmed; the identification is held at medium confidence."},{"id":"e-mainx-eight","key":"tycho-brahe-library","cat_no":"e-mainx-eight","type":"Printed Book","source":"Mortensen 1965 (reporting Mainx 1943)","status":"ghost","confidence":"B","author_identified":"(eight unidentified authors)","title_transcribed":"[Eight unidentified Tycho-owned books, superexlibris and autograph marginalia, found in a Prague monastery, 1943]","title_normalized":"","edition":"","subject":"(various)","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":[],"editorial_note":"Felix Mainx reported finding (1943) eight further books in a Prague monastery library bearing Tycho's superexlibris and many autograph marginalia, never individually catalogued or since traced. Mortensen 1965. A targeted search of the Czech National Library's Clementinum old-print base returns no record citing Mainx in any field, and Manuscriptorium yields only secondary literature: the eight are not retrievable through the open catalogue under Mainx's name, consistent with their never having been individually catalogued."},{"id":"e-orphan-wroclaw","key":"tycho-brahe-library","cat_no":"e-orphan-wroclaw","type":"Printed Book","source":"Orphan-hunt (Głombiowski 1955)","status":"ghost","confidence":"C","author_identified":"(unspecified)","title_transcribed":"[Tychoniana reported at Wrocław University Library, Głombiowski 1955 — no title established]","title_normalized":"","edition":"","subject":"(various)","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"mechanica_census":"wroclaw-bu-h12-monavius"},"census_key":"","survivor_ids":[],"editorial_note":"Karol Głombiowski, 'Tychoniana w Bibliotece Uniwersyteckiej we Wrocławiu' (Wrocław 1955; offprint from Zeszyty Naukowe UWr, Seria A nr 1, Bibliotekoznawstwo 1, pp.83-98). The headline Wrocław 'Tychonianum' is not a book Tycho owned — it is the Astronomiae instauratae Mechanica (1598) he inscribed and gave to Jakob Monau (Jacobus Monavius, 1546-1603), an outgoing gift (dedication on a flyleaf, damaged at binding), and it is the Monau presentation copy in the Mechanica 1598 census. Monavius was also Tycho's Wrocław book-agent (Dudith + Wittich library pursuits, Mosley). BUWr's two catalogued 1602 Mechanica are non-Tycho (407038 = Legnica ducal lib.; 2 D 44 = Säbisch → St Elizabeth's → Rhediger). A provenance search of NUKAT, the Polish union catalogue, returns no Brahe or Wittich copy. Głombiowski's full enumerated list (six plates) has not been seen directly; its substance is known at second hand from Tylewska-Ostrowska (Libri Gedanenses XL, 2023), which relays it, and from the primary description of the Breslau copy in Richter and Cohn (Centralblatt für Bibliothekswesen 20, 1903) — neither of which indicates a Tycho-owned Wrocław copy.","unlocatable":true},{"id":"e-letter-clavius-sacrobosco","key":"tycho-brahe-library","cat_no":"e-letter-clavius-sacrobosco","type":"Printed Book","source":"tekstnet correspondence (book-orbit mining)","status":"ghost","confidence":"B","author_identified":"Christoph Clavius","title_transcribed":"In Sphaeram Ioannis de Sacro Bosco commentarius","title_normalized":"","edition":"","subject":"Astronomy (Sphere)","acquisition":{"date":"1594","place":"","channel":"gift/exchange","channel_key":"AQ-FAIR"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"tekstnet_letter":"brahe-t_15941023001"},"census_key":"","survivor_ids":[],"editorial_note":"Sent to Tycho by Cort Aslaksson 1594 (brahe-t_15941023001: 'CLAVIJ hunc in Sphæram SACROBOSCI Commentarium ad te ablegavi ob tractatulum quendam de Nova Stella'). Received. Not in the located spine (Kl13 is Maestlin's Alterum examen, not Clavius — there is no located Clavius in the Clementinum core). Distinct attested book; present copy unlocated."},{"id":"e-letter-leovitius-mss","key":"tycho-brahe-library","cat_no":"e-letter-leovitius-mss","type":"Manuscript","source":"tekstnet correspondence (book-orbit mining)","status":"disputed","confidence":"D","author_identified":"Cyprian Leovitius","title_transcribed":"Manuscripts at the Fugger Library: Ephemerides; Tabulae directionum resolutae; the great De genethliaca astrologia","title_normalized":"","edition":"","subject":"Astronomy/Astrology","acquisition":{"date":"1599","place":"","channel":"sought (loan/access)","channel_key":"AQ-ABSORB"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"tekstnet_letter":"brahe-t_15991116001"},"census_key":"","survivor_ids":[],"editorial_note":"Tycho sought access to Cyprian Leovitius's unpublished manuscripts (Ephemerides; Tabulae directionum resolutae; the great De genethliaca astrologia) -- Fugger-Library property, bought from Leovitius's widow -- via Herwart von Hohenburg 1599 (brahe-t_15991116001). Thoren p.421 fn.205: Herwart 'travelled from Munich to Augsburg to borrow it from the Fugger library' for Tycho; Mosley p.171 concurs. He never owned them: he sought access, no transfer is documented, and the item therefore sits outside the owned-library spine. The Augsburg Fugger holding (Philipp Eduard Fugger's library) was acquired by the Vienna Hofbibliothek (ÖNB) in 1655 -- the likely route by which the Leovitius manuscripts reached Vienna, and distinct from J. J. Fugger's library, which went to Munich (BSB) in 1571. They have not been identified codex by codex: no ÖNB shelfmark has been established for them in the Tabulae codicum or the Codices astronomici."},{"id":"e-letter-viete-tracts","key":"tycho-brahe-library","cat_no":"e-letter-viete-tracts","type":"Printed Book","source":"tekstnet correspondence (book-orbit mining)","status":"ghost","confidence":"B","author_identified":"François Viète (Vieta)","title_transcribed":"Two recently-published tracts (1600) + Opera mathematica (the works Tycho requested)","title_normalized":"","edition":"1600","subject":"Mathematics","acquisition":{"date":"1600","place":"","channel":"gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"tekstnet_letter":"brahe-t_16000426002"},"census_key":"","survivor_ids":[],"editorial_note":"Herwart von Hohenburg sent Tycho two of Viète's newly-published booklets, Apr 1600 (brahe-t_16000426002: 'libelli duo... ad te mitto'); Tycho confirmed receipt Aug 1600 (brahe-t_16000828002); Herwart held further requested Viète works awaiting a courier, Nov 1600 (brahe-t_16001108001). Owned."},{"id":"e-letter-scaliger-praecessione","key":"tycho-brahe-library","cat_no":"e-letter-scaliger-praecessione","type":"Printed Book","source":"tekstnet correspondence (book-orbit mining)","status":"ghost","confidence":"C","author_identified":"Joseph Justus Scaliger","title_transcribed":"Diatriba de praecessione aequinoctiorum","title_normalized":"","edition":"","subject":"Astronomy/Chronology","acquisition":{"date":"1600","place":"","channel":"gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"chann ed 'Vitellio Mathematicus, Albertus Durerus'. The Dürer here is the Geometriae/Underweysung der Messung (Latin, Paris 1582) — distinct from the Dürer star-charts ghost."},{"id":"e-prandtlA-12","key":"tycho-brahe-library","cat_no":"PrandtlA-12","type":"Printed Book","source":"Prandtl Verzeichnis A","status":"located","confidence":"A","author_identified":"Christmann, Jacob","title_transcribed":"Observationum solarium libri tres","title_normalized":"","edition":"1601","subject":"Astronomy","acquisition":{"date":"1601-05","place":"Basel","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"prandtl_A":"12","prandtl_B_band":"XXVIII","kl_sign":"14 J 164/adl.1"},"census_key":"","survivor_ids":["s-band-xxviii"],"editorial_note":"Prandtl Verzeichnis A no.12; Einzelband XXVIII. One of Tycho's last acquisitions — bought Prague, May 1601, six months before his death."},{"id":"e-prandtlA-40","key":"tycho-brahe-library","cat_no":"PrandtlA-40","type":"Printed Book","source":"Prandtl Verzeichnis A","status":"located","confidence":"A","author_identified":"Reinhold, Erasmus","title_transcribed":"Prutenicae Tabulae coelestium motuum","title_normalized":"","edition":"1551","subject":"Ephemerides/Tables","acquisition":{"date":"1601-06","place":"Tübingen (Morhardus)","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"prandtl_A":"40","prandtl_B_band":"XXIX","kleinschnitzova":"18","kl_sign":"14 J 176"},"census_key":"","survivor_ids":["s-band-xxix"],"editorial_note":"Prandtl Verzeichnis A no.40; Einzelband XXIX. Erasmus Reinhold's own presentation copy to the Counts of Mansfeld; Tycho bought it in Prague, June 1601 — among his very last acquisitions (he died 24 Oct 1601)."},{"id":"e-nkp102-kepler-stella-nova","key":"tycho-brahe-library","cat_no":"NKP102-KEPLER-STELLA-NOVA","type":"Printed Book","source":"Czech National Library, old-print former-owner index (Brahe)","status":"located","confidence":"B","author_identified":"Kepler, Johannes","title_transcribed":"De stella nova in pede serpentarii","title_normalized":"","edition":"1606","subject":"Astronomy (nova)","acquisition":{"date":"","place":"Prague","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"kl_sign":"14 J 199","nkp_doc":"000162606"},"census_key":"","survivor_ids":["s-nkp102-kepler-stella-nova"],"editorial_note":"A post-Tycho imprint (Prague 1606), printed after Tycho's death (24 Oct 1601) and so never personally owned by him, yet it bears 'Ex Biblioth. Tijchoniana' + the 1642 Jesuit inscription + the Tychonian shelf-mark 'T.B. 27'. It survives from the collection's continuation: the Bibliotheca Tychoniana kept accruing under Kepler and the heirs. This is the very Kepler-1606 volume Prandtl (1932) cited as proof the library passed to Kepler.","tycho_ownership":"rejected"},{"id":"e-nkp102-bianchini-tepla","key":"tycho-brahe-library","cat_no":"NKP102-BIANCHINI-TEPLA","type":"Printed Book","source":"Czech National Library, old-print former-owner index (Brahe)","status":"located","confidence":"B","author_identified":"Bianchini, Giovanni","title_transcribed":"Tabulae astronomicae (ed. Luca Gaurico)","title_normalized":"","edition":"1526","subject":"Ephemerides/Tables","acquisition":{"date":"","place":"Venice","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"nkp_doc":"000005829"},"census_key":"","survivor_ids":["s-nkp102-bianchini-tepla"],"editorial_note":"A Tycho-owned copy of Bianchini's astronomical Tables (Venice 1526, ed. Luca Gaurico) bearing the 'Ex Bibliotheca Tychoniana' inscription — but held at the Teplá monastery (Klášter Teplá, West Bohemia), not the Clementinum. A Tychonianum that took a non-Clementinum route — the first located survivor of that stratum."},{"id":"e-kl39-5-ambianus","key":"tycho-brahe-library","cat_no":"e-kl39-5-ambianus","type":"Printed Book","status":"located","confidence":"A","author_identified":"Joannes Ambianus","title_transcribed":"De linearum rectarum per quadratum geometricum dimensionibus","title_normalized":"","edition":"1563","subject":"Mathematics (geometry)","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"Prague → Jesuit College Clementinum (Bibliotheca Tychoniana)","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-kl39-5-ambianus"],"editorial_note":"Fifth item (Kl. 39:5) in the Finæus Sammelband (= Prandtl Verzeichnis A no.17); Tycho's own volume in the original binding with his initials »T.B.O. 1576«. Located NK Clementinum, Prague (Kleinschnitzová 1933 / Norlind 1970, p.337).","source":"Norlind 1970 (Ex Bibliotheca Tychoniana, located discovery)"},{"id":"e-kl39-6-finaeus-speculo","key":"tycho-brahe-library","cat_no":"e-kl39-6-finaeus-speculo","type":"Printed Book","status":"located","confidence":"A","author_identified":"Oronce Finé (Orontius Finaeus)","title_transcribed":"De speculo ustorio liber unicus","title_normalized":"","edition":"1551","subject":"Mathematics/Optics (burning mirrors)","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"Prague → Jesuit College Clementinum (Bibliotheca Tychoniana)","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-kl39-6-finaeus-speculo"],"editorial_note":"Sixth item (Kl. 39:6) in the Finæus Sammelband (= Prandtl Verzeichnis A no.17), Tycho's own »T.B.O. 1576« volume. Located NK Clementinum, Prague (Kleinschnitzová 1933 / Norlind 1970, p.345).","source":"Norlind 1970 (Ex Bibliotheca Tychoniana, located discovery)"},{"id":"e-kl33-4-caselius","key":"tycho-brahe-library","cat_no":"e-kl33-4-caselius","type":"Printed Book","status":"located","confidence":"A","author_identified":"Johannes Caselius","title_transcribed":"Friderico II. regi Daniae ad regni senatores ἐπιτάφιος (panegyric)","title_normalized":"","edition":"1588","subject":"Oration/panegyric","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"Prague → Jesuit College Clementinum (Bibliotheca Tychoniana)","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-kl33-4-caselius"],"editorial_note":"Caselius's panegyric to Frederik II; the author wrote that he would send a copy to Tycho (TBOO VII,121, May 1588). Located NK Clementinum (Kleinschnitzová 33:4 Sammelband; Norlind 1970, p.342).","source":"Norlind 1970 (Ex Bibliotheca Tychoniana, located discovery)"},{"id":"e-norlind-morsing-diarium","key":"tycho-brahe-library","cat_no":"e-norlind-morsing-diarium","type":"Printed Book","status":"ghost","confidence":"B","author_identified":"Elias Olai Morsing","title_transcribed":"Diarium astrologicum et metheorologicum anni 1586","title_normalized":"","edition":"1586","subject":"Astronomy (Hven observations / almanac)","acquisition":{"date":"1585-1586","place":"Uraniborg","channel":"Tycho's own press","channel_key":""},"dispersal":{"channel":"","detail":"Uraniborg-press imprint; Tycho's own copy attested at Uraniborg, not located","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"brahe-diarium-astrologicum-1586","survivor_ids":[],"editorial_note":"Diarium astrologicum et metheorologicum anni 1586 by Elias Olai Morsing, Tycho's assistant, printed at the Uraniborg press under Tycho's imprimatur (the first true book from that press). A book from his own press, so its surviving copies are censused separately: that census documents 20 copies -- 18 held in institutions (KB Copenhagen, incl. the Albert-Meier dedication copy, BnF, Bodleian, BL/Sloane, BSB-Munich, Wellcome, etc.) and 2 known only from the market and currently untraced. No copy is identified by a Tycho ownership mark (consistent with Kleinschnitzová 1933 p.78: not one of Tycho's own works survives among the marked Clementinum Tychoniana). Norlind 1970 p.353 gives no present location for Tycho's own copy, stating only that it 'har med sakerhet befunnit sig i biblioteket pa Uraniborg' -- that Tycho certainly owned it. The entry therefore stands as attested but not located: owned through his own press, with no Tycho-marked survivor.","source":"Norlind 1970 (Ex Bibliotheca Tychoniana, located discovery)","unlocatable":true},{"id":"e-norlind-flemlose-astrologia-da","key":"tycho-brahe-library","cat_no":"e-norlind-flemlose-astrologia-da","type":"Printed Book","status":"ghost","confidence":"B","author_identified":"Peder Jacobsen Flemløse","title_transcribed":"En elementisch oc jordisch Astrologia (Danish)","title_normalized":"","edition":"1591","subject":"Astrology/meteorology (weather-prognostic rules)","acquisition":{"date":"1591","place":"Uraniborg","channel":"Tycho's own press","channel_key":""},"dispersal":{"channel":"","detail":"Uraniborg-press imprint; the only Danish-language Uraniborg book","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"brahe-flemloes-astrologia-1591-da","survivor_ids":[],"editorial_note":"En elementisch oc jordisch Astrologia (Danish, Uraniborg, Hans Gaschitz, June 1591) -- the only Danish-language book from Tycho's press; preface written by Longomontanus on Tycho's command. A book from his own press, so its surviving copies are censused separately: that census documents 2 extant copies (KB Copenhagen; Copenhagen UB). Norlind 1970 (p.346), relaying Lauritz Nielsen, lists two further copies the census has not adjudicated -- a defective copy in Oslo UB, and a Karlsruhe (Badische Landesbibliothek) copy he reports lost. The KB copy is digitised (Royal Library facsimile, barcode 130001664698; CLARIN-DK text). No copy is Tycho-marked (Kleinschnitzová 1933 p.78). The entry therefore stands as owned through his own press, with no Tycho-marked survivor.","source":"Norlind 1970 (Ex Bibliotheca Tychoniana, located discovery)","unlocatable":true},{"id":"e-norlind-flemlose-astrologia-de","key":"tycho-brahe-library","cat_no":"e-norlind-flemlose-astrologia-de","type":"Printed Book","status":"ghost","confidence":"B","author_identified":"Peder Jacobsen Flemløse","title_transcribed":"Ein elementisch und irdische Astrologia (German translation)","title_normalized":"","edition":"1591","subject":"Astrology/meteorology (weather-prognostic rules)","acquisition":{"date":"1591","place":"Uraniborg","channel":"Tycho's own press","channel_key":""},"dispersal":{"channel":"","detail":"Uraniborg-press imprint; German translation, printed months after the Danish","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"brahe-flemloes-astrologia-1591-de","survivor_ids":[],"editorial_note":"Ein elementisch und irdische Astrologia (German translation, Uraniborg, Hans Gaschitz, Sept 1591). A book from his own press, so its surviving copies are censused separately: that census documents 3 copies, all currently recorded extant (TU Wien; Groningen UB, digitised; Karlsruhe, Badische Landesbibliothek, on Nielsen 1921 p.194). Norlind 1970 (p.346), relaying Nielsen, reports the Karlsruhe copy destroyed -- a conflict the census has yet to adjudicate. The Groningen copy is fully digitised: shelfmark uklu NAUTA 197, IIIF https://dbc.rug.nl/iiif/2/boeken:937/info.json, viewer https://dbc.rug.nl/digital/collection/boeken/id/937/ (OCLC 68367430). No copy is Tycho-marked (Kleinschnitzová 1933 p.78). The entry therefore stands as owned through his own press, with no Tycho-marked survivor.","source":"Norlind 1970 (Ex Bibliotheca Tychoniana, located discovery)","unlocatable":true},{"id":"e-ging-apianus-cosmographia-1561","key":"tycho-brahe-library","cat_no":"e-ging-apianus-cosmographia-1561","type":"Printed Book","status":"ghost","confidence":"B","author_identified":"Petrus Apianus","title_transcribed":"Cosmographia (1561 edition)","title_normalized":"","edition":"1561","subject":"Geography/Cosmography","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"sold by a Munich antiquariat to an undisclosed American location (Gingerich)","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":[],"editorial_note":"Tycho's own copy of the 1561 Cosmographia, attested by Gingerich (2002, p.325): 'a copy of the 1561 edition of Petrus Apianus' Cosmographia, was sold by a München antiquariat to an undisclosed location in America.' Distinct from the 1553 Gemma-Frisius edition in the Clementinum (Prandtl Verzeichnis A no.3). Copy survives but present location undisclosed.","source":"Gingerich 2002 (Recent Notes on Tycho Brahe's Library, p.325)"},{"id":"e-norlind-quercetanus-responsio","key":"tycho-brahe-library","cat_no":"e-norlind-quercetanus-responsio","type":"Printed Book","status":"ghost","confidence":"B","author_identified":"Joseph Du Chesne (Quercetanus)","title_transcribed":"Ad Iacobi Auberti Vindonis de ortu et causis metallorum ... brevis responsio","title_normalized":"","edition":"1575","subject":"Alchemy/Chymical medicine","acquisition":{"date":"by 1575","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"owned by Tycho, then given to Hagecius at Regensburg, autumn 1575 (TBOO VII,95)","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Thaddaeus Hagecius (gift, 1575)","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":[],"editorial_note":"Quercetanus (Joseph Du Chesne), 'Ad Iacobi Auberti... brevis responsio' (Lyon 1575, 8vo) — a third-party Paracelsian/chymical-medicine book Tycho owned only briefly: the preface is dated 1 April 1575 and he gave the copy to Thaddaeus Hagecius at Regensburg in autumn 1575 (TBOO VII,95). Identified by Hagecius's marginal note 'Libellus est Josephi Quercetani' on Tycho's letter (autograph in Vienna, ÖNB), not on the book (Norlind p.358). Because Tycho gave the book away new, there is no Tycho ownership mark to hunt: the edition is common, but no Tycho- or Hagecius-provenance copy has surfaced in the corpus, in the trade, or in the union catalogues. The copy passed into Hagecius's library -- itself the confirmed Hagecius gap in this reconstruction, where at least four letter-documented Hagecius works survive in no inventory -- and any copy recovered from it would be Hagecius's, not Tycho's. The entry is therefore retired as unlocatable.","source":"Norlind 1970 (Ex Bibliotheca Tychoniana, p.358)","unlocatable":true},{"id":"e-norlind-busch-nova1572","key":"tycho-brahe-library","cat_no":"e-norlind-busch-nova1572","type":"Printed Book","status":"ghost","confidence":"C","author_identified":"Georg Busch","title_transcribed":"[Nova-1572 tracts] Von dem Cometen ... 1572 + the fuller Erfurt 1573 redaction","title_normalized":"","edition":"1572","subject":"Astronomy (nova 1572)","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Tycho maste ha agt atminstone tvenne upplagor av skriften' - in Prog. III,279-288 Tycho describes two physical Busch tracts on the new star (Zinner 2574/2609-13 and the fuller Zinner 2614, Erfurt 1573). Reasoned ownership (Tycho's own statement of having two in hand). His separate 1577 comet tract stays cited-only.","source":"Norlind 1970 + Progymnasmata III,279-288"},{"id":"e-norlind-hipparchus-arati","key":"tycho-brahe-library","cat_no":"Norlind-hipparchus-arati","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Hipparchus (ed. princeps, Petrus Victorius)","title_transcribed":"In Arati et Eudoxi Phaenomena libri III","title_normalized":"","edition":"1567","subject":"Astronomy (Greek)","acquisition":{"date":"","place":"Florence","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"hipparchus-arati"},"census_key":"","survivor_ids":[],"editorial_note":"Hipparchus's commentary on the Phaenomena of Aratus and Eudoxus — the only work of the great ancient astronomer to survive — in the Greek editio princeps edited by Petrus Victorius (Florence, 1567). Christiernus Johannis Ripensis, formerly in Tycho's service on Hven, met Scaliger while travelling in Holland and reported that Scaliger owned the Greek text; Tycho wrote in August 1598 asking for the book itself or for transcripts of the passages he needed (Opera VIII,102). Scaliger sent excerpts, acknowledged by Tycho in March 1599 (VIII,151), and — on Kepler's testimony — the annotated book itself: it was still with Tycho's heirs when Kepler asked Jørgen Brahe for it in November 1624. No copy has been traced since."},{"id":"e-mort-rohsska-prachtband","key":"tycho-brahe-library","cat_no":"e-mort-rohsska-prachtband","type":"Printed Book","source":"Mortensen 1965 / Norlind (non-Prague located)","status":"located","confidence":"A","author_identified":"(unidentified — a gilt-supralibros Prachtband)","title_transcribed":"A Tycho gilt-supralibros Prachtband (title not identified)","title_normalized":"","edition":"","subject":"","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-mort-rohsska-prachtband"],"editorial_note":"A Tycho Prachtband at the Röhsska Konstslöjdmuseum, Göteborg; formerly Per Hierta, Frammestad. Its supralibros was reproduced on the binding of Lauritz Nielsen's Tycho Brahes Bogtrykkeri (1946). Mortensen 1965."},{"id":"e-letter-scaliger-emendatione","key":"tycho-brahe-library","cat_no":"e-letter-scaliger-emendatione","type":"Printed Book","source":"tekstnet correspondence (book-orbit mining)","status":"ghost","confidence":"B","author_identified":"Joseph Justus Scaliger","title_transcribed":"De emendatione temporum (revised ed.; Leiden, Plantin 1598)","title_normalized":"","edition":"1598","subject":"Chronology","acquisition":{"date":"1598","place":"","channel":"gift/exchange","channel_key":"AQ-FAIR"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"tekstnet_letter":"brahe-t_15980314001"},"census_key":"","survivor_ids":[],"editorial_note":"Sought in 1584 through Johannes Maior, Tycho's agent at the Frankfurt fairs, and received the same year from Heinrich Brucaeus (brahe-t_15840612001: 'Mitto IOSEPHUM SCALIGERUM de emendatione temporum'). What Brucaeus sent was the first edition of 1583, and that copy survives: Prague, National Library, Sign. 19 A 46, initialled 'T. B.' on the title-page (Kleinschnitzová no.41). This record stands for the revised edition of 1598, which the correspondence has from Scaliger himself (brahe-t_15980314001: 'redintegratum de Temporum Emendatione... primum accepi'); no copy of the revision has been traced, and whether Tycho held the revision at all, or the 1598 letter restates the 1583 book, remains open. Not in Norlind's catalogue."},{"id":"e-mort-lipsius-de-constantia-lost","key":"tycho-brahe-library","cat_no":"mort-lipsius-dconstantia-lost","type":"Printed Book","source":"Mortensen, Fra Tycho Brahes Bogsamling (FoF)","status":"lost","confidence":"B","author_identified":"Justus Lipsius","title_transcribed":"De constantia","title_normalized":"","edition":"","subject":"Philosophy (Stoic)","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"formerly University Library, Copenhagen (noted by Jens Kragh Hoest, Chronos 1822, p.24); now lost","louvain_core":false,"taken_1583":false,"stolen_lost":"lost","recovered":"","later_owners":"","saunder":""},"concordance":{},"census_key":"","survivor_ids":[],"editorial_note":"A lost Danish-collection Tychonianum: Tycho's copy carried his own critical remarks dated 1592 on the first leaf; formerly in the University Library, Copenhagen (Jens Kragh Hoest, Chronos 1822, p.24); now lost."},{"id":"e-mort-niels-krag-laced-lost","key":"tycho-brahe-library","cat_no":"mort-niels-krag-laced-lost","type":"Printed Book","source":"Mortensen, Fra Tycho Brahes Bogsamling (FoF)","status":"lost","confidence":"B","author_identified":"Niels Krag","title_transcribed":"Republica Lacedaemoniorum (1593) — copy with Tycho's autograph distichs","title_normalized":"","edition":"1593","subject":"History/Antiquity","acquisition":{"date":"","place":"","channel":"","channe hes reached the Jesuit colleges at Chomutov (Komotau) and Krumlov and the Professhaus on Prague's Malá Strana; the 1773 suppression of the Society and the secularisation of the monasteries re-converged those fragments in the Clementinum — which is why the mathematical and astronomical books are the part that survives. Gingerich's 2002 survey of the Clementinum volumes counts the marks as follows: sixteen carry the initials 'T.B.O.' tooled on the binding, six the gilt supralibros portrait, twelve the initials written in by hand, and two are author presentations (Bruno and Scaliger). Clear marginalia in Tycho's hand appear in only a few — among them the Ziegler In C. Plinii of 1531, in its Martianus Capella section, and Bartholomaeus Scultetus's Cometae of 1577.","diagnostic_markers":"'Collegii Caesarei Soc. Jesu Pragae 1642' / 'Ex bibliotheca Tychoniana' inscription; the initials 'T.B.O.'/'T.B.O. 1576/1583' tooled on the binding; gilt supralibros portrait","current_locations":"National Library of the Czech Republic (Clementinum), Prague — the largest surviving fragment. Kleinschnitzová (1933) catalogued 97 works in 47 volumes; Šolc (2002) extends this to about 110 titles in some 50 volumes. This store itemises 87 Prague works in 53 volumes.","vol_count":"53 volumes / 87 works itemised here"},{"id":"II","name":"Heirs' sale / dispersal (post-1601)","mechanism":"After Tycho's death (1601) the family progressively sold off the library in Prague before bequeathing the remnant; this route probably took more of it than any other. How large the library was to begin with is itself disputed — estimates run from about 1,000 to about 3,000 volumes; the positions are set out under 'How big was the library?' below.","diagnostic_markers":"later-owner inscriptions (e.g. Gabriel Crusius 1634/1673)","current_locations":"scattered","vol_count":"not enumerated; probably the single largest route"},{"id":"III","name":"Swedish war-loot (1648 sack of Prague)","mechanism":"The 1648 Swedish capture of Prague carried off Rudolfine/Bohemian holdings, including Tycho material, to Sweden and Denmark.","diagnostic_markers":"Swedish royal/library provenance","current_locations":"Uppsala; Stockholm; Copenhagen","vol_count":"some volumes; not enumerated"},{"id":"IV","name":"Rudolfine-imperial absorption","mechanism":"Some volumes passed into the imperial/court orbit under Rudolf II.","diagnostic_markers":"imperial provenance","current_locations":"Vienna (ÖNB)","vol_count":"some volumes; not enumerated"},{"id":"V","name":"Attrition / loss","mechanism":"War, fire, and untraced dispersal account for the gap between the library as it stood at his death and the remnant located today — no single catastrophe, but a long attrition that left no mark to hunt by.","diagnostic_markers":"","current_locations":"","vol_count":"the unrecovered remainder"}],"history":{"intro_hook":"Tycho Brahe assembled one of the great private research libraries of Renaissance Europe — perhaps a thousand to three thousand volumes — and then watched its fate detach from his own. He bought his first book the year a predicted eclipse converted him to astronomy (1560); built the collection through the Frankfurt fairs, a web of correspondent-agents, and the systematic pursuit of dead scholars' libraries; and housed it in the circular “museum” at the heart of Uraniborg, beside his great globe and above his alchemical furnaces. He marked his ownership with an evolving binding programme — plain student stamps, then the gilt T.B.O. cipher, then the gilt supralibros portrait — that is today the forensic key to re-identifying his copies. After his death in 1601 the instruments went one way and the books another: retained by impoverished heirs, and in 1642 the surviving core was given to the Jesuit Clementinum in Prague, which — on the city's east bank — escaped the 1648 Swedish sack that carried other Tychonic books to Stockholm, Rome, and the Vatican.","narrative":[{"heading":"An eclipse, a Ptolemy, and forty years of buying","body":"The library began with a conversion. On 21 August 1560 a thirteen-year-old student at Copenhagen watched a <em>predicted</em> partial solar eclipse and was struck that “men could know the motions of the stars so accurately” (Dreyer). He at once bought the <em>Ephemerides</em> of Stadius; then, on 30 November 1560, two Joachims-thaler bought him Ptolemy in the Basel 1551 edition — a copy that survives in Prague with his autograph note <em>Emptus Haffniae 2 Joachimicis 1560</em>. It is the oldest datable object in this reconstruction. Sent to Leipzig to read law, he bought astronomy books in secret; the 1575 continental journey triggered a surge of acquisitions stamped <strong>T.B.O. 1576</strong>, the year he was given Hven."},{"heading":"The library at the heart of Uraniborg","body":"The books lived in the circular southern rotunda of Uraniborg — room <em>T</em> in Tycho's own plan — which he called his <em>museum</em>, dedicated to Urania. Its centrepiece was the six-foot celestial globe; its walls carried portraits of Hipparchus, Ptolemy, al-Battani, and Copernicus. Below lay the alchemical laboratory, above the observatory, so the books sat at the intersection of observing, publishing, and chemistry. And the library sat inside a self-sufficient book economy: besides the press, Tycho built on Hven “both a bindery and a paper mill, so that he eventually became almost completely independent of the outside world” (Nielsen). The Hven bindery bound not only his own publications but the books he bought for his library, and stamped them with his marks — which is why the marking programme and the island's craft economy are one story."},{"heading":"How the books came in","body":"Tycho was a net importer, and his correspondents were his suppliers. He worked the biannual <strong>Frankfurt fairs</strong> through the Willer catalogues and a string of agents (Maior, Brucaeus, Aslachus, and above all Herwart von Hohenburg). Most distinctively, he tried again and again to engross the whole working library of a <strong>dead scholar</strong> — Ambrose, Brechtalius, Rheticus, Wittich, Dudith, Leovitius — a roster of mostly-failed attempts that tells us what he wanted and where unrecovered copies might be. The Republic of Letters delivered <strong>presentation copies</strong> (Rantzau, Bruno, Kepler, Scaliger, Pitiscus). And in his last Prague years much of his working library was <strong>borrowed</strong>, not owned: ~50 mathematical titles on loan from the Duke of Bavaria's library via Herwart."},{"heading":"The marks: a datable signature of ownership","body":"Tycho's bindery turned ownership into a sequence. <strong>Period 1</strong> (1560–65): student name-stamps ‘BRADE’ / ‘Tycho Brade’ + year. <strong>Period 2</strong> (c.1565–75): brown calf, the gilt cipher <strong>T.B.O.</strong> (Tychonis Brahe Ottonidis), no date. <strong>Period 3</strong> (1576–82): <strong>T.B.O. 1576</strong> (also 1580, 1582), the Uraniborg cohort. <strong>Period 4</strong> (1588–1601): the <strong>gilt supralibros portrait</strong> Prachtband — an oval medallion of Tycho in a ruff wearing the Order-of-the-Elephant chain, his arms on the lower board, each ringed by a Latin distich; earliest documented use 14 May 1588 (the BL Maestlin De mundi, dispatched that day). Books bought ready-bound or received as gifts may carry only handwritten initials — so the <em>absence</em> of a stamp does not exclude Tycho provenance."},{"heading":"Exile, and the parting of the ways","body":"When Christian IV stripped his income, Tycho inventoried the whole library on Hven (21 March 1597) and carried it into exile — Rostock, Wandsbek, a winter at Wittenberg, then Prague (1599) in Rudolf II's service. He died on 24 October 1601, and his scientific estate and his library diverged. Rudolf agreed to buy the instruments and observation-logs for 20,000 thalers (barely 4,000 ever paid); the logs passed through Kepler to Copenhagen. The library proper was <em>not</em> bought: it stayed with the heirs, who — impoverished and converting to Catholicism — progressively sold and gave it away."},{"heading":"The surviving core, and the sack it escaped","body":"The son-in-law Tengnagel held the collection together until his death in 1622, after which dispersal accelerated. In <strong>1642</strong> the surviving core was donated to the Jesuit Clementinum in Prague and stamped <em>Collegij Caesarei Soc. Jesu Pragae A. 1642 / Ex Bibliotheca Tychoniana</em>. Six years later the Swedish general Königsmarck sacked the <em>west</em> bank of Prague — the Castle, the Rudolfine library — and shipped the spoils to Stockholm and (via Queen Christina) to Rome; a Wittich <em>De revolutionibus</em> that Tycho had owned ended in the Vatican. But the Clementinum sat on the <em>east</em> bank, outside the sack's reach — the structural reason the 1642 core survived where the imperial Tychoniana scattered."},{"heading":"Rediscovery","body":"Rebuilding the library has itself taken 150 years: Friis (1868, the first Vienna/Prague survey) → Dreyer (1913, the Opera Omnia) → Prandtl (1932, the first printed catalogue) → Kleinschnitzová (1933, the foundational Clementinum census) → Mortensen (1965, the survivors outside Prague — the Copenhagen Calvin/Theocritus volume and its Lindenov dedication) → Norlind (1970, the ~216-title reconstruction) → Šolc and Gingerich (2002, the ~110-title Clementinum recount and the dispersed-survivor finds in Texas, Chicago, and the Vatican). This reconstruction stands on their work — and on the leads they left open."}],"size_debate":{"summary":"The library's original size is genuinely unresolved — estimates run from ~1,000 to ~3,000 volumes, and the headline figure rests on a single shelf-number.","positions":[{"figure":"~3,000 volumes","who":"Christianson (2000)","basis":"the lone shelf-number 2781 that Studnička found on a Gesner spine and Norlind reported"},{"figure":"“at best speculative”","who":"Gingerich (2002)","basis":"the 2781 appears in no other surviving volume; a 3,000-title library is plausible against Rantzau's 6,000 and Dee's ~4,000, but the number cannot bear the weight"},{"figure":"~1,000 vols / ~2,000 works","who":"Mortensen (1965)","basis":"the best-supported conservative figure"},{"figure":"~5,000 (rejected)","who":"Walde, via Mortensen 1942","basis":"the outlier; Mortensen 1965 rejects it as physically impossible for the 5-metre museum room"}],"note":"Norlind himself wrote that “it is impossible to form any estimate of its size,” crediting the 2781 inference to Studnička."},"events":[{"date":"1546-12-14","label":"Tycho Brahe born at Knutstorp","phase":"life","source":"Christianson 2000"},{"date":"1560-08-21","label":"A predicted solar eclipse converts Tycho to astronomy (aged 13)","phase":"formation","source":"Dreyer 1890 p.13"},{"date":"1560","label":"Buys the Ephemerides of Stadius — his first recorded book","phase":"formation","source":"Dreyer p.14"},{"date":"1560-11-30","label":"Buys Ptolemy (Basel 1551) for 2 thaler; the autograph note survives in Prague","phase":"formation","source":"Dreyer p.14; Friis 1868 p.266"},{"date":"1562","label":"To Leipzig to read law; secret astronomy-book buying begins","phase":"formation","source":"Dreyer p.15"},{"date":"1563","label":"‘Ty Brad 1563’ sammelband (later gifted to Vedel; now Uppsala)","phase":"formation","source":"Mortensen 1955 p.27"},{"date":"1575","label":"Attempt on Dr Ambrose's library (Augsburg) — frustrated","phase":"acquisition","source":"Mosley p.186","agent":"Dr Ambrose of Augsburg"},{"date":"1576","label":"Granted Hven; Uraniborg begun; the T.B.O. 1576 binding cohort","phase":"formation","source":"Norlind 1970 p.335"},{"date":"1576","label":"Attempt on Brechtalius's mathematical books via Camerarius — already sold","phase":"acquisition","source":"Mosley p.186","agent":"Joachim Camerarius"},{"date":"1579-05","label":"Marks 13 titles in a Frankfurt fair catalogue for procurement","phase":"acquisition","source":"Mosley p.178"},{"date":"1580-10","label":"Gives Wittich the Apian Astronomicum Caesareum (departure gift)","phase":"acquisition","source":"Mosley p.187","entry_ids":["e-ging-apianus-wittich"],"agent":"Paul Wittich"},{"date":"1584-02-16","label":"Writes Vedel of his intent to found the Uraniborg press","phase":"production","source":"Nielsen 1921 p.177","agent":"Anders Sørensen Vedel"},{"date":"1585","label":"First Uraniborg imprint: Morsing's calendar for 1586","phase":"production","source":"Christianson p.380"},{"date":"1586","label":"The supralibros portrait design executed (a woodcut at Uraniborg)","phase":"marks","source":"Mortensen 1931 p.142"},{"date":"1587-09","label":"Tycho learns of Wittich's death (from Rothmann)","phase":"acquisition","source":"Mosley p.186","agent":"Paul Wittich"},{"date":"1588-03-20","label":"Earliest dated use of the gilt supralibros portrait (on a De mundi)","phase":"marks","source":"Mortensen 1931 p.142"},{"date":"1588","label":"Bruno's Camoeracensis acrotismus received (author gift)","phase":"acquisition","source":"Mosley p.179","entry_ids":["e-prague-bruno"],"agent":"Giordano Bruno"},{"date":"1589","label":"Wittich pursuit, wave 1 (noble emissaries to Wrocław) — fails","phase":"acquisition","source":"Mosley p.186","agent":"Paul Wittich"},{"date":"1592","label":"Paper-mill operational on Hven (dam engineered by Spangenberg)","phase":"production","source":"Vellev 2017 p.108"},{"date":"1592-03","label":"Seeks Rheticus's & Copernicus's papers from Hagecius","phase":"acquisition","source":"Mosley p.185","agent":"Thaddaeus Hagecius"},{"date":"1595","label":"Wittich pursuit, wave 2 (Hagecius + Monau) — fails","phase":"acquisition","source":"Christianson p.229","agent":"Jakob Monau"},{"date":"1598-03","label":"Kepler's Mysterium cosmographicum arrives (with Ursus's tract)","phase":"acquisition","source":"Mosley p.180","entry_ids":["e-norlind-kepler-mysterium"],"agent":"Johannes Kepler"},{"date":"1598","label":"Wittich pursuit, wave 3 (Longomontanus + Monau) — the library found intact, negotiation opens","phase":"acquisition","source":"Christianson p.229","entry_ids":["e-prague-copernicus"],"agent":"Longomontanus"},{"date":"1597-03-21","label":"The whole library inventoried on Hven (‘all the junker's books’)","phase":"exile","source":"TBOO IX,146; Thoren p.384"},{"date":"1597-03-29","label":"Tycho leaves Hven for the last time","phase":"exile","source":"Thoren p.384"},{"date":"1597-06-02","label":"Departs Copenhagen into exile","phase":"exile","source":"Christianson p.319"},{"date":"1597-10","label":"At Wandsbek with Rantzau; the travelling press prints the Mechanica","phase":"exile","source":"Dreyer ch.10","agent":"Heinrich Rantzau"},{"date":"1598","label":"Winter at Wittenberg","phase":"exile","source":"Christianson p.305"},{"date":"1599","label":"Enters Rudolf II's service; assigned Benátky castle","phase":"prague","source":"Christianson p.305","agent":"Rudolf II"},{"date":"1600","label":"Library + instruments reach Prague (the Golden Griffin house)","phase":"prague","source":"Christianson p.303"},{"date":"1600-10","label":"Monau brings the Wittich De revolutionibus copies to Prague","phase":"acquisition","source":"Gingerich 2002 p.325","entry_ids":["e-prague-copernicus"],"agent":"Jakob Monau"},{"date":"1601-10-13","label":"Tycho falls ill at Baron Rosenberg's banquet","phase":"death","source":"Dreyer ch.11"},{"date":"1601-10-24","label":"Tycho Brahe dies in Prague","phase":"death","source":"Christianson p.309"},{"date":"1601-10-26","label":"Kepler named imperial mathematician (charge of the mss & instruments)","phase":"dispersal","source":"Christianson p.309","agent":"Johannes Kepler"},{"date":"1601-11-04","label":"Tycho buried at the Týn Church, Prague","phase":"death","source":"Christianson p.309"},{"date":"1603-09","label":"Only 4,000 of 20,000 thalers paid for the instruments","phase":"dispersal","source":"Dreyer App. p.368","agent":"Rudolf II"},{"date":"1619","label":"Most instruments destroyed in the Bohemian troubles","phase":"dispersal","source":"Dreyer App. p.366"},{"date":"1622","label":"Tengnagel dies; the book-dispersal accelerates","phase":"dispersal","source":"Kleinschnitzová p.76","agent":"Frans Gansneb Tengnagel"},{"date":"1623","label":"A Brahe book already in private hands (Budějovice)","phase":"dispersal","source":"Kleinschnitzová p.76"},{"date":"1632","label":"The great globe found at Neisse; sent to Denmark","phase":"dispersal","source":"Dreyer App. p.366"},{"date":"1642","label":"The surviving CORE donated to the Jesuit Clementinum, Prague (‘A. 1642’)","phase":"clementinum","source":"Šolc 2002 p.329; Kleinschnitzová pp.78–81"},{"date":"1648-07-16","label":"The Swedish sack of west-bank Prague; the Rudolfine collections looted","phase":"loot","source":"Swedish-loot lit.; Gingerich p.325","agent":"H. C. Königsmarck"},{"date":"1654","label":"Crusius donates 2 Brahe vols to the Chomutov Jesuits","phase":"clementinum","source":"Kleinschnitzová p.78","agent":"Gabriel Crusius"},{"date":"1654","label":"Christina abdicates; takes loot (incl. a Tychonic Copernicus) to Rome","phase":"loot","source":"Gingerich p.325","agent":"Queen Christina"},{"date":"1655","label":"Ludwig Kepler sells the observation-originals to Frederick III (Copenhagen)","phase":"dispersal","source":"Mortensen 1965 p.32"},{"date":"1657","label":"The Vienna apographa set reaches the Hofbibliothek","phase":"dispersal","source":"Friis 1868"},{"date":"1728","label":"Tycho's great globe burns in the Copenhagen fire","phase":"dispersal","source":"Dreyer App."},{"date":"1773","label":"The Jesuit suppression reunites the Chomutov/Krumlov fragments at the Clementinum","phase":"clementinum","source":"Kleinschnitzová p.78"},{"date":"1868","label":"Friis surveys the Tychonic manuscripts in Vienna & Prague","phase":"rediscovery","source":"Friis 1868"},{"date":"1932","label":"Prandtl publishes the first printed catalogue of the library","phase":"rediscovery","source":"Prandtl 1932"},{"date":"1933","label":"Kleinschnitzová's foundational Clementinum census (97 works / 47 vols)","phase":"rediscovery","source":"Kleinschnitzová 1933"},{"date":"1943","label":"Mainx finds 8 supralibros volumes in a Prague monastery — untraced","phase":"rediscovery","source":"Mortensen 1965 p.30","agent":"Felix Mainx"},{"date":"1970","label":"Norlind's reconstructed catalogue (~216 titles) + the ‘2781’ number","phase":"rediscovery","source":"Norlind 1970"},{"date":"2002","label":"Šolc (~110 titles) + Gingerich (the dispersed-survivor finds)","phase":"rediscovery","source":"Šolc/Gingerich 2002"}],"acquisition_channels":[{"key":"AQ-FAIR","name":"Frankfurt book fair","mechanism":"Standing orders via the biannual Willer catalogues, executed by correspondent-agents who scanned the fair and bought to order.","agents":["Johannes Maior","Heinrich Brucaeus","Cunradus Aslachus","Herwart von Hohenburg"]},{"key":"AQ-ABSORB","name":"Absorbed scholar-libraries","mechanism":"The systematic pursuit of a deceased mathematician's whole working library — mostly unsuccessful, but the most distinctive Tychonic method.","agents":["Thaddaeus Hagecius","Jakob Monau","Longomontanus"]},{"key":"AQ-GIFT","name":"Author / correspondent gift","mechanism":"Presentation copies delivered through the gift economy of the Republic of Letters.","agents":["Heinrich Rantzau","Giordano Bruno","Johannes Kepler","Joseph Scaliger","Bartholomaeus Pitiscus","Thaddaeus Hagecius"]},{"key":"AQ-MS","name":"Manuscript copying & transmission","mechanism":"Scribal copies made of texts he could not buy, and library-scouring missions (Vedel).","agents":["Anders Sørensen Vedel","Thaddaeus Hagecius"]},{"key":"AQ-DIRECT","name":"Direct / student purchase","mechanism":"Books bought outright, often with an autograph purchase-note.","agents":[]},{"key":"AQ-BORROW","name":"Borrowed, not owned","mechanism":"~50 mathematical titles on loan from the Duke of Bavaria's library via Herwart in the Prague years — used but never owned, and so outside this catalogue.","agents":["Herwart von Hohenburg"],"out_of_scope":true}],"mark_chronology":[{"period":"1","dates":"1560–c.1565","mark":"Name blind-stamp ‘BRADE’ / ‘Tycho Brade’ + year","indicates":"Student purchases; pre-Hven"},{"period":"2","dates":"c.1565–1575","mark":"Gilt cipher T.B.O. (no date), brown calf, rhomboid arabesque","indicates":"Pre-Hven acquisition"},{"period":"3","dates":"1576–1582","mark":"T.B.O. 1576 (also 1580, 1582)","indicates":"Uraniborg-inauguration cohort; the Hven bindery"},{"period":"4","dates":"1588–1601","mark":"Gilt supralibros portrait + arms (Prachtband)","indicates":"Presentation copies & select library books; earliest documented use 14 May 1588 (the BL Maestlin De mundi, dispatched that day)"},{"period":"—","dates":"throughout","mark":"Handwritten ‘T.B.’ initials or a purchase-note","indicates":"Gifts / ready-bound copies not stamped by the Hven bindery"}],"mark_checklist":["Upper-board oval gilt PORTRAIT medallion (two sizes: 7.6×5.8 cm or 5.8×4.3 cm) with the distich ‘Hic patet exterior Tychonis forma Brahei…’ → Period-4 presentation Prachtband.","Lower-board ARMS oval with ‘Arma genus, fundi pereunt; durabile virtus…’.","Gilt T.B.O. / T.B.O. 1576 cipher on brown calf with a rhomboid arabesque → Period 2/3.","Handwritten ‘T.B.’ initials or a purchase-note on the title-page (gifts / ready-bound copies).","The Jesuit accession inscription ‘A. 1642 / Ex Bibliotheca Tychoniana’ (or Chomutov / Crusius) → Clementinum provenance.","Silk / satin / velvet binding with a hand-painted portrait → the highest gift tier.","A volume bearing ONLY the Jesuit inscription, with no binding-stamp, is still Tycho's — Kleinschnitzová's explicit recovery route."]},"census_meta":{"brahe-diarium-astrologicum-1586":{"title":"Diarium 1586","copies":20},"brahe-flemloes-astrologia-1591-da":{"title":"Flemloes Astrologia (Danish)","copies":2},"brahe-flemloes-astrologia-1591-de":{"title":"Flemloes Astrologia (German)","copies":3}}};

// ---- subject shelves + source-family gloss (shared) ----
/* A shelf label must describe what it actually holds. This one claimed "Astronomy &
   mathematics" while matching 'mathemat' and nothing else — so optics, geometry,
   trigonometry, gnomonics, cosmology and the star charts all fell through to
   "Other / unclassified", which then read as the largest shelf in a library of a
   mathematician. History, theology and alchemy have shelves of their own now rather
   than being swept into the same drawer as the genuinely unclassified. */
function shelfOf(subj){const t=(subj||'').toLowerCase();
 if(!t.trim())return 'Subject not recorded';
 if(/comet|nova/.test(t))return 'Novae & comets';
 if(/geograph|cartograph|geodes|navigat/.test(t))return 'Geography & cartography';
 if(/calendar|chronolog/.test(t))return 'Calendar & chronology';
 if(/astronom|ephemerid|table|instrument|eclipse|world-system|star chart|globe|sphere/.test(t))return 'Astronomy & mathematics';
 if(/mathemat|geometr|trigonometr|arithmet|optic|gnomonic|sundial|cosmolog/.test(t))return 'Astronomy & mathematics';
 if(/astrolog|prophec|prognost/.test(t))return 'Astrology & prophecy';
 if(/alchem|chymic|medicin|paracels/.test(t))return 'Alchemy & medicine';
 if(/natural/.test(t))return 'Natural philosophy';
 if(/theolog|scriptur|reformed/.test(t))return 'Theology';
 if(/histor|antiquit/.test(t))return 'History & antiquities';
 if(/letter|poet|philosoph|humanis|oration|panegyric|encyclopaed|lexicograph|grammar/.test(t))return 'Letters & humanism';
 return 'Other / unclassified';}
const SHELF_ORDER=['Astronomy & mathematics','Novae & comets','Astrology & prophecy','Alchemy & medicine','Natural philosophy','Letters & humanism','History & antiquities','Theology','Geography & cartography','Calendar & chronology','Other / unclassified','Subject not recorded'];
function srcFamily(s){s=s||'';
 if(s.indexOf('Prandtl')===0)return 'Prandtl 1932';
 if(s.indexOf('Kleinschnitz')===0)return 'Kleinschnitzová 1933';
 if(/Solc|Šolc/.test(s))return 'Šolc 2002';
 if(s.indexOf('Norlind')===0)return 'Norlind 1970';
 if(/tekstnet|Mainx|Głombiowski/.test(s))return 'Correspondence';
 if(s.indexOf('Mortensen')===0)return 'Mortensen';
 if(s.indexOf('Gingerich')===0)return 'Gingerich 2002';
 return 'Other';}
function statusLabel(e){
 if(e.status==='located'&&e.tycho_ownership==='rejected')return 'afterlife';
 return e.status;}
function statusGloss(k){return ({located:'located as his own',ghost:'attested, not yet located',
 lost:'recorded as lost',disputed:'disputed identification',afterlife:'in the collection’s afterlife (not his own)'}[k]||k);}

function magBar(label,val,max,bg){
 const pct=Math.max(2.5,val/max*100);
 return `<div class="magrow"><div class="maglab">${label}</div><div class="magbar" style="width:${pct}%;background:${bg}"><span class="magnum">${NF(val)}</span></div></div>`;}
function chanCount(cid){return E.filter(e=>e.dispersal&&e.dispersal.channel===cid).length;}
function renderDispersal(host){
 /* the authored intro lives in META (from the store's [presentation] table), not
    in HIST — so the better sentence, the one that names the diagnostic marks,
    was dead and the generic fallback showed instead (2026-07-12 audit) */
 const intro=(HIST&&HIST.dispersal_intro)||(META&&META.dispersal_intro)||'After 1601 the library scattered along distinct pathways; each channel leaves its own diagnostic markers &mdash; the key to re-identifying Tycho’s books across the world’s collections.';
 let h=`<div class="vintro" style="margin-top:8px">${intro}</div>`;
 const untag=E.length-DATA.channels.reduce((t,c)=>t+chanCount(c.id),0);
 h+=DATA.channels.map(c=>{const n=chanCount(c.id);
  const badge=n?`<span class="b located">${n} entr${n==1?'y':'ies'}</span>`

  return `<div class="chcard"><h4>${esc(c.name)} ${badge}</h4><div style="font-size:13px">${esc(c.mechanism)}</div>`+
   (c.diagnostic_markers?`<div class="mk"><b>Diagnostic markers:</b> ${esc(c.diagnostic_markers)}</div>`:'')+

      a vol_count is a phrase, not a number, so it printed "(≈unknown — the bulk of
      the library)" and "(≈Dozens)". And a channel with no current_locations lost
      its extent entirely, because the whole row was gated on locations being
      present. Two independently-guarded rows (2026-07-12 audit). */
   (c.current_locations?`<div class="mk"><b>Current locations:</b> ${esc(c.current_locations)}</div>`:'')+

 h+=`<div style="font-size:12px;color:var(--muted);margin-top:4px"><b>${untag}</b> of the ${E.length} entries carry no assigned dispersal channel &mdash; owned but with no documented route out.</div>`;

function renderFate(){

 let h=`<div class="vintro"><b>How did a library of perhaps ${NF(H.lib_lo)}&#8211;${NF(H.lib_hi)} volumes become ${H.own_volumes} identified volumes, holding ${H.located_own} of his books?</b> Tycho Brahe’s working library at Uraniborg was dispersed after his death in 1601; no catalogue of it survives. What follows is the reconstruction &mdash; and, honestly, how little of it can still be seen.</div>`;
