"channel_key":""},"dispersal":{"channel":"II","detail":"Dispersed from Tycho's library after 1601; the route to Sweden is undocumented (possibly the 1648 Swedish sack of Prague — channel III — but unconfirmed). By the early 20th c. in the collection of Baron Per Hierta (1864-1924) of Frammestad, Sweden; now at the Röhsska Konstslöjdmuseum, Göteborg. The route INTO Röhsska is unresolved: either Hjalmar Wijk's 1915 donation of Hierta books to the museum, or the posthumous Björck & Börjesson auction (Stockholm, Oct-Nov 1932, cat. 272, 1618 lots) that dispersed the rest of Hierta's collection.","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Baron Per Hierta (1864-1924), Frammestad, Sweden → Röhsska Konstslöjdmuseum, Göteborg","saunder":"","fromond":"","ussher":""},"concordance":{"prandtl_A":"57","prandtl_B_band":"XXV","mortensen_1965":"pp.29-30 (Röhsska, ex Per Hierta)"},"census_key":"","survivor_ids":["s-mort-rohsska-prachtband"],"editorial_note":"Theatri humanae vitae vol. XVIII (Basel 1587), Theodor Zwinger's great Basel encyclopaedia — a mighty folio Tycho acquired already bound and stamped with his gilt portrait+arms superexlibris. Prandtl 1932 catalogued it as no.57 / Einzelband XXV; Mortensen 1965 (pp.29-30) identifies that same volume as the one 'now in the Röhsska Konstslöjdmuseum, Göteborg; formerly Per Hierta, Frammestad'. Its superexlibris is the exemplar reproduced on the binding of Lauritz Nielsen's Tycho Brahes Bogtrykkeri (1946). One of the few Tychonica that reached Nordic rather than Prague/Clementinum hands."},{"id":"e-prandtlA-58","key":"tycho-brahe-library","cat_no":"PrandtlA-58","type":"Printed Book","source":"Prandtl Verzeichnis A","status":"located","confidence":"A","author_identified":"Xenophon","title_transcribed":"Xenophontis opera, Latine — Wittenberg edition","title_normalized":"","edition":"1556","subject":"Letters/Philosophy","acquisition":{"date":"","place":"Wittenberg","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"prandtl_A":"58","prandtl_B_band":"III"},"census_key":"","survivor_ids":["s-band-iii"],"editorial_note":"Prandtl Verzeichnis A no.58; bound in Band III"},{"id":"e-prague-bruno","key":"tycho-brahe-library","cat_no":"e-prague-bruno","type":"Printed Book","source":"Šolc 2002 (Bibliotheca Tychoniana)","status":"located","confidence":"A","author_identified":"Giordano Bruno","title_transcribed":"Camoeracensis acrotismus seu Rationes articulorum physicorum (Wittenberg, Z. Crato 1588)","title_normalized":"","edition":"1588","subject":"Natural philosophy/Polemic","acquisition":{"date":"","place":"","channel":"","channel_key":"AQ-GIFT"},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Jesuit Clementinum 1642","saunder":"","fromond":"","ussher":""},"concordance":{"thesaurus":"O_PRAGUE_BRUNO_AUTOGRAPH"},"census_key":"","survivor_ids":["s-prague-bruno"],"editorial_note":"Dedication copy sent to Tycho ~1588; his autograph pun on Bruno's name. NK Clementinum, Sign. XV K 22 8° (olim 8 I 70). Federates with tycho-thesaurus O_PRAGUE_BRUNO_AUTOGRAPH."},{"id":"e-prague-copernicus","key":"tycho-brahe-library","cat_no":"e-prague-copernicus","type":"Printed Book","source":"Šolc 2002 (Bibliotheca Tychoniana)","status":"located","confidence":"A","author_identified":"Nicolaus Copernicus","title_transcribed":"De revolutionibus orbium coelestium (Tycho's library copy)","title_normalized":"","edition":"","subject":"Astronomy","acquisition":{"date":"","place":"","channel":"","channel_key":"AQ-ABSORB"},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Jesuit Clementinum 1642","saunder":"","fromond":"","ussher":""},"concordance":{"thesaurus":"O_PRAGUE_COPERNICUS_WITTICH","kleinschnitzova":"11","prandtl_A":"14","prandtl_B_band":"X"},"census_key":"","survivor_ids":["s-prague-copernicus"],"editorial_note":"From Tycho's library; the famous mis-attribution copy. The acquisition is documented in the correspondence: after Paul Wittich's death (1586) Tycho was given procuration of Wittich's books/papers (Hagecius 1589-03-22) and pursued buying Wittich's whole library from the surviving sister for six years (1589-1595; brahe-t_15891101001, 15900510001, 15950812001: 'omnem eius supellectilem librariam... iusto pretio nanciscar' / 'de libris VITICHIANIS... a sorore superstite... obtinere queam'). Per Mosley 2007 (pp.175-179; the despatch at p.179, following Gingerich & Westman 1988) Monau eventually succeeded: he despatched three of Wittich's four annotated De revolutionibus volumes to Prague, the fourth remaining in Wroclaw -- Gingerich's Wroclaw 9 (Biblioteka Uniwersytecka 437777), the copy Valentin von Sebisch transcribed c.1604. Gingerich's Annotated Census counts only two copies as reaching Tycho (Prague 3 = NKP 14 B 16; Vatican 1 = Ottob. 1902) and places the Liège copy (ResMS 69C) outside his hands; the two accounts differ over Liège alone -- the disagreement is recorded here, not resolved. The pursuit was bound up with Tycho's Ursus-plagiarism dispute. This is the channel by which the Wittich-annotated De revolutionibus entered the Tychoniana."},{"id":"e-debello-moscovitico","key":"tycho-brahe-library","cat_no":"e-debello-moscovitico","type":"Printed Book","source":"No scholarly attestation traced (the digitised NKP copy, Sign. 22 B 201, is confirmed un-Tychonic)","status":"disputed","confidence":"D","author_identified":"","title_transcribed":"De bello Moscovitico quod Stephanus rex Poloniae gessit (a surviving Tycho copy)","title_normalized":"","edition":"","subject":"History","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":[],"editorial_note":"Heidenstein's account of Stephen Bathory's Muscovite war (Cracow 1584), formerly carried here as a surviving Tycho copy."},{"id":"e-corr-hesse-cometobs","key":"tycho-brahe-library","cat_no":"e-corr-hesse-cometobs","type":"Manuscript","source":"tekstnet correspondence","status":"disputed","confidence":"C","author_identified":"Wilhelm IV, Landgrave of Hesse-Kassel","title_transcribed":"Observations of the comet of 1577 (sent to Tycho)","title_normalized":"","edition":"","subject":"Astronomy","acquisition":{"date":"","place":"","channel":"gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"tekstnet_letter":"brahe-t_15880611001"},"census_key":"","survivor_ids":[],"editorial_note":"Wilhelm IV's 1577 comet data reached Tycho through the Rothmann/Kassel correspondence (Tycho->Rothmann 1588-06-11, brahe-t_15880611001: 'Recensui etiam in hoc libro... Observationes') and was collated into his comet book (-> the Progymnasmata) -- not held as a discrete Wilhelm-IV codex. Wilhelm IV's own observation manuscripts survive at the Universitaetsbibliothek Kassel -- Landesbibliothek und Murhardsche Bibliothek, '2 Ms. astron.' series (obs. corpus 1-7, digitized on ORKA; star catalogue 2 Ms. astron. 74, handbook 2 Ms. astron. 5; Schrimpf & Verbunt 2021), with Wilhelm's correspondence at the Hessisches Staatsarchiv, Marburg -- but those are Wilhelm's, not Tycho's copies."},{"id":"e-corr-scaliger-books","key":"tycho-brahe-library","cat_no":"e-corr-scaliger-books","type":"Printed Book","source":"tekstnet correspondence","status":"ghost","confidence":"B","author_identified":"Joseph Justus Scaliger","title_transcribed":"Two books from Scaliger + his hand-annotated Greek Hipparchus (In Arati et Eudoxi Phaenomena commentaria, ed. pr. Victorius, Florence 1567)","title_normalized":"","edition":"","subject":"Astronomy","acquisition":{"date":"1599","place":"","channel":"gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"tekstnet_letter":"brahe-t_15990417001"},"census_key":"","survivor_ids":[],"editorial_note":"Tycho->Scaliger 1599-04-17 (brahe-t_15990417001: 'Pro utroque autem libro mihi tam benigne concesso') -- two books granted by Scaliger. The 'Hipparchus' Scaliger held and excerpted for Tycho was the printed Greek editio princeps -- Hipparchus, In Arati et Eudoxi Phaenomena commentaria (ed. Petrus Victorius, Florence 1567) -- carrying Scaliger's own hand; Tycho had requested it Aug 1598 (TBOO VIII,102). The Šolc 2002 Clementinum band inventory holds no Hipparchus and no Scaliger excerpt MS (its only T.B.-marked MS, sign. XIV B 38, is scholastic theology) -- a clean Clementinum negative. Searches at the Royal Library, Copenhagen and the Österreichische Nationalbibliothek, Vienna have likewise returned nothing so far. The annotated copy was last attested with Jorgen Brahe in 1624 (Kepler GW, ed. Caspar, nr. 242); fate 1624->1642 unknown, consistent with not entering the Jesuit donation. The Victorius Hipparchus (In Arati et Eudoxi Phaenomena, Florence 1567) is not held by the Czech National Library, and Manuscriptorium returns only Tycho's own works and maps citing his observations: the Czech vein is dry, and the Scaliger-hand copy is now to be sought in Italian and Florentine holdings."},{"id":"e-ghost-albategnius-arabic","key":"tycho-brahe-library","cat_no":"e-ghost-albategnius-arabic","type":"Printed Book","source":"tekstnet correspondence","status":"ghost","confidence":"C","author_identified":"al-Battani (Albategnius)","title_transcribed":"De motu stellarum — a corrected/Arabic edition Tycho sought (1598-1600)","title_normalized":"","edition":"","subject":"Astronomy","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"tekstnet_letter":"brahe-t_15990417001","kleinschnitzova_owned":"16"},"census_key":"","survivor_ids":[],"editorial_note":"Tycho repeatedly sought a better Albategnius: complained Aug 1598 the Latin teemed with errors, asked Scaliger April 1599 for the Arabic, and Herwart von Hohenburg offered a copy Nov 1600 (VIII,386). Tycho did own the 1537 Nürnberg ed. (= Kleinschnitzová no.16); this record stands for the better, Arabic copy he wanted. The acquisition is speculative.","unlocatable":true},{"id":"e-ghost-copernicus-derev-owned","key":"tycho-brahe-library","cat_no":"e-ghost-copernicus-derev-owned","type":"Printed Book","source":"Norlind 1970","status":"located","confidence":"B","author_identified":"Nicolaus Copernicus","title_transcribed":"De revolutionibus (a working copy beyond the Clementinum one)","title_normalized":"","edition":"1543","subject":"Astronomy","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"IV","detail":"Tycho (presumably acquired Oct 1600 via Monau) -> Rudolf II -> 1648 Swedish loot -> Queen Christina -> Rome 1655 -> Ottoboni 1690 -> BAV Ottoboniana 1902","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{},"census_key":"","survivor_ids":["s-vatican-copernicus"],"editorial_note":"Scholarship argues Tycho owned or used more than one De revolutionibus. Located as Biblioteca Apostolica Vaticana, Ottoboniana 1902 (De revolutionibus, Nuremberg 1543), per Gingerich, Annotated Census (2002) p.139: this Wittich-annotated copy Tycho 'eagerly sought... and presumably he got it in October 1600 through the help of Jacob Monaw', thence (Gingerich's conjecture) Rudolf II -> 1648 Swedish loot -> Christina -> Rome 1655 -> Ottoboni -> Vatican. The annotations are Wittich's, not Tycho's -- Gingerich retracts the older belief, the flyleaf longitudes citing Vratislavia rather than Hven or Copenhagen -- so the ownership rests on the documented Monau acquisition, not on a Tycho mark. Distinct from the Clementinum Wittich copy (Sign. 14 B 16, the 1566 Basel edition)."},{"id":"e-kl-1","key":"tycho-brahe-library","cat_no":"FK-1","type":"Manuscript","source":"Kleinschnitzová 1933 (Ex Bibliotheca Tychoniana)","status":"located","confidence":"A","author_identified":"","title_transcribed":"Tychonis Brahe Tabulae sinuum.","title_normalized":"","edition":"","subject":"Astronomy/Mathematics","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Jesuit Clementinum 1642","saunder":"","fromond":"","ussher":""},"concordance":{"kleinschnitzova":"1"},"census_key":"","survivor_ids":["s-kl-1"],"editorial_note":"Kleinschnitzová 1933 no.1; NK Clementinum Sign. VI E 9. Tycho autograph manuscript."},{"id":"e-kl-2","key":"tycho-brahe-library","cat_no":"FK-2","type":"Manuscript","source":"Kleinschnitzová 1933 (Ex Bibliotheca Tychoniana)","status":"located","confidence":"A","author_identified":"","title_transcribed":"Tychonis Brahe Brevissimum planimetriae compendium.","title_normalized":"","edition":"","subject":"Astronomy/Mathematics","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Jesuit Clementinum 1642","saunder":"","fromond":"","ussher":""},"concordance":{"kleinschnitzova":"2"},"census_key":"","survivor_ids":["s-kl-2"],"editorial_note":"Kleinschnitzová 1933 no.2; NK Clementinum Sign. XII A 28. Tycho autograph manuscript."},{"id":"e-kl-6","key":"tycho-brahe-library","cat_no":"FK-6","type":"Printed Book","source":"Kleinschnitzová 1933 (Ex Bibliotheca Tychoniana)","status":"located","confidence":"A","author_identified":"","title_transcribed":"Sammelband, Sign. 5 G 42: Heron Alexandrinus, Spiritalium liber (Urbino 1575); Werner, Libellus super vigintiduobus elementis conicis (Nuremberg 1522) — with three non-Tychoniana bound in","title_normalized":"","edition":"","subject":"Astronomy & mathematics (Sammelband)","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Jesuit Clementinum 1642","saunder":"","fromond":"","ussher":""},"concordance":{"kleinschnitzova":"6","norlind_headword":"Heron Alexandrinus","acquisition":"sought 1584-92, recd via Hagecius/Magini; tekstnet brahe-t_15881101001/15891101001"},"census_key":"","survivor_ids":["s-kl-6"],"editorial_note":"Kleinschnitzová 1933 no.6; NK Clementinum Sign. 5 G 42. A composite volume of five works, three of which Kleinschnitzová marks «Kein Tychonianum» — the Aristarchus (1572), the Maestlin, and de Buckaw's Problema mathematicum of 1641, printed forty years after Tycho died. The volume itself is his. She records the Jesuit accession inscription on the title-page of the third work, Heron's Spiritalium liber (Urbino 1575): «Collegij Caesarei Societatis Jesu Pragae A° 1642. Ex Bibliotheca Tijchonis»; and of the fifth, Werner's Libellus super vigintiduobus elementis conicis (Nuremberg 1522), that it «hat Marginalien von Brahes Hand» and is probably the copy Norlind lists as his no. 32. The Prague catalogue says the same of the volume: that it comes from Tycho Brahe's library and carries his marginalia. It is bound in the white leather of the Clementinum Jesuit college — one of the volumes Kleinschnitzová cites to show that Tycho's Sammelbände were broken up after 1642 and rebound with books of other provenance, which is how three works that were never his came to sit inside one that was."},{"id":"e-kl-7","key":"tycho-brahe-library","cat_no":"FK-7","type":"Printed Book","source":"Kleinschnitzová 1933 (Ex Bibliotheca Tychoniana)","status":"located","confidence":"A","author_identified":"Ziegler, Jacobus","title_transcribed":"Commentarius in C. Plinii de naturalia librum secundum","title_normalized":"Commentarius in C. Plinii de naturali historia librum secundum","edition":"","subject":"","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Jesuit Clementinum 1642","saunder":"","fromond":"","ussher":""},"concordance":{"kleinschnitzova":"7"},"census_key":"","survivor_ids":["s-kl-7"],"editorial_note":"Kleinschnitzová 1933 no.7; NK Clementinum Sign. 7 B 27. Kleinschnitzová prints the title as 'de naturalia librum secundum'; it is normalised here to 'de naturali historia librum secundum', the reading of the book itself (Ziegler's commentary on Book II of Pliny's Natural History, Basel 1531)."},{"id":"e-kl-12","key":"tycho-brahe-library","cat_no":"FK-12","type":"Printed Book","source":"Kleinschnitzová 1933 (Ex Bibliotheca Tychoniana)","status":"located","confidence":"A","author_identified":"Rheticus, Georg Joachim","title_transcribed":"Canon doctrinae triangulorum. Lipsiae 1551.","title_normalized":"","edition":"","subject":"","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Jesuit Clementinum 1642","saunder":"","fromond":"","ussher":""},"concordance":{"kleinschnitzova":"12"},"census_key":"","survivor_ids":["s-kl-12"],"editorial_note":"Kleinschnitzová 1933 no.12; NK Clementinum Sign. 14 C 20. Tycho autograph manuscript."},{"id":"e-kl-14","key":"tycho-brahe-lib ,"confidence":"A","author_identified":"Scheiner, Christoph","title_transcribed":"Pantographice seu Ars delineandi","title_normalized":"","edition":"1631","subject":"","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Jesuit Clementinum 1642","saunder":"","fromond":"","ussher":""},"concordance":{"kleinschnitzova":"17"},"census_key":"","survivor_ids":["s-kl-17"],"editorial_note":"Kleinschnitzová 1933 no.17; NK Clementinum Sign. 14 J 164. Kleinschnitzová's verdict: 'Kein Tychonianum' — the volume's lead work (Scheiner, Pantographice seu Ars delineandi) is not from Tycho's library; ownership rejected. The ground is the imprint: the Pantographice was printed at Rome in 1631, thirty years after Tycho's death. The volume itself is genuinely his — it is built round Christmann's Observationum solarium libri tres (Basel, 1601), which carries 'Ex Bibliotheca Tijchoniana' and the autograph 'Emi Pragae mense Majo' — but the Jesuits bound the Scheiner in ahead of it, and it leads the volume only by accident of rebinding.","tycho_ownership":"rejected"},{"id":"e-kl-20","key":"tycho-brahe-library","cat_no":"FK-20","type":"Printed Book","source":"Kleinschnitzová 1933 (Ex Bibliotheca Tychoniana)","status":"located","confidence":"A","author_identified":"Reinholdus, Erasmus","title_transcribed":"Prutenicae tabulae coelestium motuum.","title_normalized":"","edition":"","subject":"","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"I","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"Jesuit Clementinum 1642","saunder":"","fromond":"","ussher":""},"concordance":{"kleinschnitzova":"20"},"census_key":"","survivor_ids":["s-kl-20"],"editorial_note":"Kleinschnitzová 1933 no.20; NK Clementinum Sign. 14 J 192."},{"id":"e-kl-23","key":"tycho-brahe-library","cat_no":" llonius of Perga","title_transcribed":"Conicorum libri IV (prob. Commandino, Bologna 1566; or Memmo, Venice 1537)","title_normalized":"","edition":"1566","subject":"Mathematics","acquisition":{"date":"","place":"Bologna","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"apollonius-conica"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Vi veta, att biblioteket på Hven ägde ett exemplar av Apollonius' verk (Bil. 6)' — the Hven library is known to have owned a copy, on the evidence Norlind prints as his Bilaga 6; which translation is undetermined. The holding is attested but unlocated: no Tycho-marked copy has been identified."},{"id":"e-norlind-aslaksson-denatura","key":"tycho-brahe-library","cat_no":"Norlind-aslaksson-denatura","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Cort Aslaksson","title_transcribed":"De natura caeli triplicis libelli tres","title_normalized":"","edition":"1597","subject":"Cosmology","acquisition":{"date":"","place":"Siegen","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"aslaksson-denatura","vd16":"A 3899","zinner":"3699"},"census_key":"","survivor_ids":[],"editorial_note":"Cort Aslakssøn (Cunradus Aslacus / Cort Axelsen, Bergen 1564 – 1624), Tycho's own famulus on Hven 1590–93 and later the first Norwegian professor at Copenhagen. Full title: De natura caeli triplicis libelli tres, quorum I. de caelo aëreo, II. de caelo sidereo, III. de caelo perpetuo, e sacrarum litterarum & praestantium philosophorum thesauris concinnati (Siegen / Sigenae Nassoviorum: Christoph Rab = Christophorus Corvinus, 1597). VD16 A 3899; Zinner 3699; [7] Bl. + 214 S., 8° octavo (VD16; Norlind p.339's ‘4°’ is an error). Written/printed while Aslakssøn was abroad as tutor to Otto Brahe (matric. Basel 1596/97). The book is dedicated to Tycho (Norlind p.338; SNL) — hence Norlind's inference that it ‘har väl alltså befunnit sig i Tychos bibliotek.’ Ownership is dedication-inference only: no Tycho-marked or presentation copy is recorded in any inventory (Prandtl / Kleinschnitzová / Šolc / Mortensen) or on the market. Notable: in the preface Aslakssøn declares for Copernicus — a position Tycho rejected — so the dedication sits in tension with the book's own stance. A ‘Mosaic physics’ synthesis of astronomy + scripture (the three heavens: elemental/aerial, astronomical/sidereal, eternal/perpetual); Comenius later listed Aslakssøn among pre-Comenian Mosaic physicists. Afterlife: Book III (de caelo perpetuo) was translated into English as ‘The Description of Heaven … Composed in Latine by Cunradus Aslachus, and conuerted into English by Raph [Ralph] Iennings’, London 1623 (EEBO A22193). Ordinary copies of the edition survive (BSB Munich bsb10192622; ÖNB Vienna; a Royal Library Copenhagen copy), but none is Tycho's. The dedicatory epistle, read first-hand in the BSB copy, to 'Tychoni Brahe de Knudstrup, fundatori Arcis Uraniburgicae... sideralis scientiae scrutatori, instauratori, conservatori unico', dated Basel 16 Nov 1596 and signed 'Cunradus Aslachus Bergensis', hails Tycho as 'indefessus Caeli scrutator & Atlas' and pays eyewitness homage to his celestial Globe and astronomical instruments."},{"id":"e-norlind-carelli-ephemerides","key":"tycho-brahe-library","cat_no":"Norlind-carelli-ephemerides","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Giovanni Battista Carelli","title_transcribed":"Ephemerides ad annos XIX (1557-1575)","title_normalized":"","edition":"1557","subject":"Ephemerides/Tables","acquisition":{"date":"","place":"Venice","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"carelli-ephemerides"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind (Bilaga I, p.342), reading Dreyer: it is this edition that Tycho 'skaffade sig under sin Leipzigvistelse' -- acquired during his Leipzig years -- and that he often cites in his earliest observation journal (Opera X, 5ff). Dreyer's own note is narrower: 'In his observations from 1563-64 he also mentions the Ephemerides of Carellus (Venice, 1557)' (Tycho Brahe, Edinburgh 1890, p.18) -- the acquisition at Leipzig is Norlind's inference, not Dreyer's statement. Earliest stratum of the collection. It is unlocated and most likely lost: a pre-Hven, pre-supralibros Leipzig-years acquisition with no binding marks to trace. Imprint: Venice, Vincenzo Valgrisi, 1557, 4to; the title runs 'ad annos XIX', not 'ad annos IX' (1557 to 1575 is nineteen years; WorldCat OCLC 864162552 / 187068933). At most such a copy would carry a handwritten 'T.B.', so it is essentially untraceable; unmarked copies of the edition survive, e.g. at the BNE Madrid."},{"id":"e-norlind-chytraeus-destella","key":"tycho-brahe-library","cat_no":"Norlind-chytraeus-destella","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"David Chytraeus","title_transcribed":"De stella inusitata et nova ... et de comato sidere 1577","title_normalized":"","edition":"1577","subject":"Astronomy (nova/comet)","acquisition":{"date":"","place":"Rostock","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"chytraeus-destella"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'sannolikt denna upplaga... som Tycho ägde' — owned this Latin edition (not the German), per Prog. III,225-229 and comet-book IV,366-367. The ownership is inferred from the Progymnasmata citations (Norlind p.341); no physical Tycho copy has been identified. Imprint: Rostock, 1577, 4to -- the Latin edition (Zinner 2768 / Hellman 29), which Norlind argues Tycho owned in preference to the German (Zinner 2769 / Hellman 30)."},{"id":"e-norlind-chytraeus-augustana","key":"tycho-brahe-library","cat_no":"Norlind-chytraeus-augustana","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"David Chytraeus","title_transcribed":"Historia Augustanae confessionis","title_normalized":"","edition":"1578","subject":"Theology/History","acquisition":{"date":"","place":"Frankfurt","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"chytraeus-augustana"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Ägdes sannolikt av Tycho' — probably owned, per Tycho's letter to Landgrave Wilhelm Sept 1591 (Opera VI,243)."},{"id":"e-norlind-cramer-isagoge","key":"tycho-brahe-library","cat_no":"Norlind-cramer-isagoge","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Daniel Cramer","title_transcribed":"Isagoge in Metaphysicam Aristotelis","title_normalized":"","edition":"1594","subject":"Philosophy/Metaphysics","acquisition":{"date":"","place":"Hanau","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"cramer-isagoge"},"census_key":"","survivor_ids":[],"editorial_note":"Dedicated to Tycho (title-page); Cramer visited Hven summer 1592; Tycho praised in an epigram p.13 and his world-system named pp.217-218. Norlind: 'bör alltså ha funnits i biblioteket på Hven' — must have been in the Hven library. Ownership is dedication-inference only (Norlind p.343); no Tycho-marked copy has been identified anywhere. Imprint: Hanau (Hanoviae), 1594, 8vo. Norlind p.343 transcribes the dedication 'Ad Tychonem Brahe, Danum, virum nobilem et in astronomia facile principem'. The BSB copy (bsb11111337) is digitised."},{"id":"e-norlind-dresser-historialutheri","key":"tycho-brahe-library","cat_no":"Norlind-dresser-historialutheri","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Matthäus Dresser","title_transcribed":"Historia Lutheri","title_normalized":"","edition":"1598","subject":"History/Theology","acquisition":{"date":"","place":"Leipzig","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"dresser-historialutheri"},"census_key":"","survivor_ids":[],"editorial_note":"Tycho received a packet of 9 copies from Wittenberg (to Rosenkrantz Sept 1598, Opera VIII,115); forwarded them on but 'behåller han ett exemplar av boken för att i lugn och ro kunna studera den' — he kept one copy to study at leisure. The copy is unlocated: a post-Hven 1598 octavo with no binding marks (Norlind p.343), lost in the Prague dispersal. Imprint: Leipzig (Lipsiae), 1598, 8vo -- not Wittenberg; the packet merely came from Wittenberg, and Dresser was a Leipzig professor."},{"id":"e-norlind-everaert-ephemerides","key":"tycho-brahe-library","cat_no":"Norlind-everaert-ephemerides","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Martin Everaert (Everhardus)","title_transcribed":"Ephemerides novae et exactae 1590-1610 ex novis tabulis Belgicis","title_normalized":"","edition":"1597","subject":"Ephemerides/Tables","acquisition":{"date":"","place":"Leiden","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"everaert-ephemerides"},"census_key":"","survivor_ids":[],"editorial_note":"Dedicated to Christian IV; Tycho 'erhöll' (received) it at Wandsbek 7 May 1598 (to Rosenkrantz May 1598, Opera VIII,61), possibly via Longomontanus; Tycho sharply criticised the tables in the letter. The copy is unlocated: a post-supralibros acquisition (Norlind p.344), absent from all the inventories; the edition is recorded in WorldCat, but no Tycho-provenance copy is. Imprint: Leiden (Lugduni Batavorum), 1597, 4to."},{"id":"e-norlind-gemma-prodigiosa","key":"tycho-brahe-library","cat_no":"Norlind-gemma-prodigiosa","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Cornelius Gemma","title_transcribed":"De prodigiosa specie naturaque cometae 1577","title_normalized":"","edition":"1578","subject":"Astronomy (comet)","acquisition":{"date":"","place":"Antwerp","channel":"","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"gemma-prodigiosa"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Var förmodligen med bland de kometskrifter, som Hainzel i Augsburg sände i mars 1579' (Opera VII,50) — probably among the comet tracts Paul Hainzel sent Tycho. Received via Hainzel's parcel.","unlocatable":true},{"id":"e-norlind-gessner-thierbuch","key":"tycho-brahe-library","cat_no":"Norlind-gessner-thierbuch","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Conrad Gessner","title_transcribed":"Thierbuch (German, transl. C. Forer)","title_normalized":"","edition":"1563","subject":"Natural history/Zoology","acquisition":{"date":"","place":"Zürich","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"gessner-thierbuch"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Tycho, som också hade Gesners Thierbuch' — Tycho, who also had Gessner's Thierbuch. The book is attested only by Tycho's own letter to Landgrave Wilhelm of September 1591, which places the Oryx description on fol.68 (Opera VI,244); it is unlocated, and no Tycho-marked copy has been traced. Whether his copy was the 1563 or the 1583 is unrecorded, and immaterial, the two being identical: Zurich, Christoph Froschauer, 1563 (VD16 G 1728), with an interchangeable 1583 reissue (VD16 G 1729), folio. It is a different book from the surviving Gessner, De omni rerum fossilium genere (Zurich 1565; Prandtl Verzeichnis A no.46; now at UT Austin), and must not be conflated with it. The only Thierbuch physically traced in this orbit is Landgrave Wilhelm's Kassel copy -- not Tycho's -- destroyed in an air-raid in September 1941."},{"id":"e-norlind-hagecius-apodixis","key":"tycho-brahe-library","cat_no":"Norlind-hagecius-apodixis","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Thaddaeus Hagecius (Hájek)","title_transcribed":"Apodixis physica et mathematica de cometis","title_normalized":"","edition":"1581","subject":"Astronomy (comet)","acquisition":{"date":"","place":"Görlitz","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"hagecius-apodixis"},"census_key":"","survivor_ids":[],"editorial_note":"A copy was sent by Scultetus in Görlitz (Tycho to Hagecius Oct 1581, Opera VII,64). Discussed in comet-book IV,293-295. It is unlocated, and part of the confirmed Hagecius gap: Tycho owned >=4 Hagecius works (letter-documented) yet not one survives in the Clementinum (Prandtl/Kleinschnitzová/Šolc/Mortensen all silent) - likely small unbound quartos lost before the 1642 incorporation."},{"id":"e-norlind-hagecius-descriptio","key":"tycho-brahe-library","cat_no":"Norlind-hagecius-descriptio","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Thaddaeus Hagecius (Hájek)","title_transcribed":"Descriptio cometae qui apparuit 1577","title_normalized":"","edition":"1578","subject":"Astronomy (comet)","acquisition":{"date":"","place":"Prague","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"hagecius-descriptio"},"census_key":"","survivor_ids":[],"editorial_note":"Sent by Paul Hainzel in Augsburg (letter to Tycho March 1579, Opera VII,50). Discussed in comet-book IV,261-296. It is unlocated, and part of the confirmed Hagecius gap: receipt letter-documented (Norlind p.348) but no Tycho-Hagecius copy survives in any inventory."},{"id":"e-norlind-hagecius-responsio","key":"tycho-brahe-library","cat_no":"Norlind-hagecius-responsio","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Thaddaeus Hagecius (Hájek)","title_transcribed":"Responsio ad ... Hannibalis Raimundi scriptum","title_normalized":"","edition":"1576","subject":"Astronomy (nova polemic)","acquisition":{"date":"","place":"Prague","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"hagecius-responsio"},"census_key":"","survivor_ids":[],"editorial_note":"Tycho received two copies: one sent by the author Aug 1576 (Opera VII,38), another later from Maior (VII,83). A refutation of Raimundus' denial that the 1572 nova was new. A copy-level check of the Czech National Library's old-print catalogue finds the work as the first tract (doc 000030657) of the Jesuit-College-Chomutov Hagecius composite (host volume, doc 000030653); it bears no Tycho mark."},{"id":"e-norlind-hagecius-dialexis","key":"tycho-brahe-library","cat_no":"Norlind-hagecius-dialexis","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Thaddaeus Hagecius (Hájek)","title_transcribed":"Dialexis de novae et prius incognitae stellae ... apparitione","title_normalized":"","edition":"1574","subject":"Astronomy (nova 1572)","acquisition":{"date":"","place":"Frankfurt am Main","channel":"received/gift (author-corrected copy)","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"hagecius-dialexis"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind 1970: \"Måste Tycho ha ägt\" (Tycho must have owned it), cf. Progymnasmata III,19-43, where the Dialexis is treated in detail -- the strongest of the four Hagecius attestations, and the only one in which Norlind uses an explicit ownership verb. Dreyer 1890 + Mosley 2007 (Bearing the Heavens, 'Books and the heavens') document that Hagecius sent Tycho a copy carrying many manuscript corrections and additions in his own hand, hoping Tycho would reprint it; Tycho instead discussed the revised text in the Progymnasmata. So Tycho owned a specific, author-corrected copy: the most identifiable of the missing Hagecius copies, since it would carry Hagecius's autograph corrections as well as, probably, a Tycho ownership mark. It is unlocated, and it completes a striking gap -- Tycho owned at least four works by Hagecius, yet not one survives in any of the four inventories (Prandtl, Kleinschnitzová, Šolc, Mortensen). Two copies of the Frankfurt 1574 edition are held by the Czech National Library -- one inscribed for the Jesuit College at Chomutov ('Collegij Soctis IESV Commotonij Ao. 1671', doc 000154680), one stamped for the Prague academic library ('REGIAE BIBLIOTH: ACAD: PRAGEN.', doc 000014579) -- but the copy-level provenance notes in both catalogue records show only those later owners. No Tycho mark is recorded in either, neither copy has been examined in person, and no Hajek-autograph copy has surfaced."},{"id":"e-norlind-heerbrand-calendario","key":"tycho-brahe-library","cat_no":"Norlind-heerbrand-calendario","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Jakob Heerbrand","title_transcribed":"Disputatio de adiaphoris et calendario Gregoriano (resp. Corbinus)","title_normalized":"","edition":"1584","subject":"Calendar reform","acquisition":{"date":"","place":"Tübingen","channel":"received/gift/exchange","chann ica"},"census_key":"","survivor_ids":[],"editorial_note":"Magini dedicated the work to Tycho and sent a copy (Mechanica; Opera V,127), but it 'aldrig nådde sin bestämmelseort' (never reached its destination); 'Först långt senare erhöll Tycho ett exemplar från Frankfurtmässan' — Tycho only much later got a copy from the Frankfurt fair via an amanuensis (to Magini Nov 1598, Opera VIII,120)."},{"id":"e-norlind-manilius-astronomicon","key":"tycho-brahe-library","cat_no":"Norlind-manilius-astronomicon","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Marcus Manilius (ed. J.J. Scaliger)","title_transcribed":"Astronomicon a Jos. Scaligero repurgatum","title_normalized":"","edition":"1600","subject":"Astronomical poetry","acquisition":{"date":"","place":"Leiden","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"manilius-astronomicon"},"census_key":"","survivor_ids":[],"editorial_note":"Sent by Scaliger March 1600 (Opera VIII,264) to Tycho, who thanked him July 1600 (VIII,329). May relate to the books Scaliger sent him."},{"id":"e-norlind-nunes-navigandi","key":"tycho-brahe-library","cat_no":"Norlind-nunes-navigandi","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Pedro Nunes (Nonius)","title_transcribed":"De arte atque ratione navigandi libri II","title_normalized":"","edition":"","subject":"Navigation/Mathematics","acquisition":{"date":"","place":"","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"nunes-navigandi"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Fanns i någon upplaga i Tychos bibliotek, där Kepler såg den' — it was in Tycho's library in some edition, where Kepler saw it (Kepler to Herwart Jan 1607; Caspar nr 409, p.387).","unlocatable":true},{"id":"e-norlind-nunes-crepusculis","key":"tycho-brahe-library","cat_no":"Norlind-nunes-crepusculis","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Pedro Nunes (Nonius)","title_transcribed":"De crepusculis liber unus (with Alhazen, De causis crepusculorum)","title_normalized":"","edition":"1542","subject":"Optics/Astronomy","acquisition":{"date":"","place":"Lisbon","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"nunes-crepusculis"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'sannolikt denna första upplaga Tycho ägt' — probably owned this first ed., describing the 'nonius' auxiliary scale; comet-book IV,327 calls it 'Libello de crepusculis dudum edito'.","unlocatable":true},{"id":"e-norlind-ortelius-theatrum","key":"tycho-brahe-library","cat_no":"Norlind-ortelius-theatrum","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Abraham Ortelius","title_transcribed":"Theatrum orbis terrarum","title_normalized":"","edition":"1570","subject":"Geography/Cartography","acquisition":{"date":"","place":"Antwerp","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"ortelius-theatrum"},"census_key":"","surv tail":"Sächsische Landesbibliothek Dresden; destroyed in the WWII bombing of Dresden (Feb 1945).","louvain_core":false,"taken_1583":false,"stolen_lost":"Dresden Landesbibliothek copy lost in WWII (Norlind 1970 p.356, per the Dresden library's own communication).","recovered":"","later_owners":"Sächsische Landesbibliothek Dresden","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"Paulus Alexandrinus"},"census_key":"","survivor_ids":[],"editorial_note":"A third-party book Tycho owned (Paulus Alexandrinus, ed. from Heinrich Rantzau's library, Wittenberg 1588), in Tychonic original binding. Reported by Isak Collijn to Flora Kleinschnitzová (1933, p.78 n.1) as a Tychonianum in the Landesbibliothek Dresden -- the companion to the Waldstein/Mnichovo Hradiste copy of Tycho's own De nova stella (a copy of one of Tycho's own works, which falls to that work's census rather than to this library). It is confirmed lost: Norlind 1970 (p.356) records the Dresden library's own communication that the copy 'gatt forlorat under senaste varldskrig' -- i.e. destroyed in the February 1945 bombing of Dresden.","unlocatable":true},{"id":"e-norlind-rantzau-calendarium","key":"tycho-brahe-library","cat_no":"Norlind-rantzau-calendarium","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Heinrich Rantzau","title_transcribed":"Rantzovianum calendarium ad elevationem poli 55 grad.","title_normalized":"","edition":"1590","subject":"Calendar/Astrology","acquisition":{"date":"","place":"Hamburg","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"rantzau-calendarium"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Erhöll Tycho av förf.' — received from the author (Tycho to Rantzau April 1590, Opera VII,243). Two distinct objects must be kept apart: (a) Tycho's own copy, the gift he received from Rantzau; and (b) Rantzau's own copy, into which a transcript of Tycho's elegy to Denmark was bound, and which King Christian leafed through during a visit (Norlind p.360 / TBOO VIII,63). The Royal Library's two surviving copies of the 1590 Hamburg edition (Hielmst. 547 and Hielmst. 146) both descend from the eighteenth-century collector Henrik Hielmstierne, not from Tycho; neither bears a Tycho ownership mark or the bound-in elegy transcript. They are recorded here as located edition-copies; Tycho's own copy is still unlocated. Rantzau's own copy, with the elegy transcript bound in, would have passed into the Breitenburg library and its dispersal."},{"id":"e-norlind-regiomontanus-decometae","key":"tycho-brahe-library","cat_no":"Norlind-regiomontanus-decometae","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Johannes Regiomontanus","title_transcribed":"De cometae magnitudine longitudineque ... problemata XVI","title_normalized":"","edition":"1531","subject":"Astronomy (comet)","acquisition":{"date":"","place":"Nürnberg","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"regiomontanus-decometae"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'fanns säkerligen i hans bibliotek, kanske i flera exemplar' — certainly in his library, perhaps in several copies; cited repeatedly esp. in the comet-book. Also reprinted within Regiomontanus' Scripta. The Nuremberg 1531 edition (De cometae magnitudine, Problemata XVI) is not held by the Czech National Library."},{"id":"e-norlind-regiomontanus-scripta","key":"tycho-brahe-library","cat_no":"N ntains the 'Oratio de Sigismundo Augusto'."},{"id":"e-norlind-ursus-fundamentum","key":"tycho-brahe-library","cat_no":"Norlind-ursus-fundamentum","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Nicolaus Reimers Ursus (Bär)","title_transcribed":"Fundamentum astronomicum, id est nova doctrina sinuum et triangulorum","title_normalized":"","edition":"1588","subject":"Astronomy (world-system)","acquisition":{"date":"","place":"Strasbourg","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"ursus-fundamentum"},"census_key":"","survivor_ids":[],"editorial_note":"Tycho 'erhöll flera exemplar' — received several copies (one sent by Rantzau, Tycho to him Dec 1588, Opera VII,387). Ursus's near-identical world-system ignited Tycho's plagiarism accusation (he suspected Ursus copied a sketch during a 1584 Uraniborg visit). Central to the priority dispute. The Strasbourg 1588 edition is not held by the Czech National Library, whose only three Reimers records are the della Faille host volume of 1632, the Chronotheatron (Prague 1597), and De astronomicis hypothesibus (1597)."},{"id":"e-norlind-ursus-hypothesibus","key":"tycho-brahe-library","cat_no":"Norlind-ursus-hypothesibus","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"B","author_identified":"Nicolaus Reimers Ursus (Bär)","title_transcribed":"De astronomicis hypothesibus, seu de systemate mundano","title_normalized":"","edition":"1597","subject":"Astronomy (world-system polemic)","acquisition":{"date":"","place":"Prague","channel":"received/gift/exchange","channel_key":"AQ-GIFT"},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"ursus-hypothesibus"},"census_key":"","survivor_ids":[],"editorial_note":"Tycho 'erhöll boken' — received it. Printed 'Absque omni privilegio'; Ursus denies stealing the system, dedicates to Landgrave Moritz, prints a laudatory Kepler letter (Graz 15 Nov 1595), and violently attacks Tycho and Rothmann. The Czech National Library does hold the Prague 1597 edition, as 14 J 81/adl.2, bound second to della Faille, Theoremata (Antwerp 1632); but its catalogue record carries no provenance field, so the edition survives with no Tycho mark recorded. The volume belongs to the stratum of re-bound convolutes whose access points were stripped in the Kukula recataloguing, and would need an in-person examination to settle."},{"id":"e-norlind-alhazen-opticae","key":"tycho-brahe-library","cat_no":"Norlind-alhazen-opticae","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Alhazen (Ibn al-Haytham), ed. F. Risner (with Vitellio)","title_transcribed":"Opticae thesaurus. Alhazeni Arabis libri VII ... Item Vitellonis libri X","title_normalized":"","edition":"1572","subject":"Optics","acquisition":{"date":"","place":"Basel","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"alhazen-opticae"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: 'Synes Tycho ha ägt' — seems Tycho owned; cf. comet-book IV,152 and Prog. III,246 (refraction).","unlocatable":true},{"id":"e-norlind-aratus-phaenomena","key":"tycho-brahe-library","cat_no":"Norlind-aratus-phaenomena","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"Aratus (e :"1600","subject":"Poetry","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"brasch-varadino"},"census_key":"","survivor_ids":[],"editorial_note":"Brasch sent the manuscript poem (celebrating Melchior von Roedern's 1598 defence of Grosswardein/Varad) to Tycho twice -- Aug 1600 (lost in transit, TBOO VIII,337) and a replacement Sept 1600 that 'probably reached' him (VIII,380; Norlind p.340); von Roedern died 20 Sept 1600. No surviving manuscript codex has been located in any catalogue. Note: Martin Brasch the Younger also published a printed Varadini Hungariae propugnaculi... anni 1598 (1598) on the same subject -- plausibly the same matter in print vs. a 1600 authorial MS redaction, though no source collates the two.","unlocatable":true},{"id":"e-norlind-buchanan-sphaera","key":"tycho-brahe-library","cat_no":"Norlind-buchanan-sphaera","type":"Printed Book","source":"Norlind 1970 (reconstructed catalogue, pp.333-365)","status":"ghost","confidence":"C","author_identified":"George Buchanan","title_transcribed":"Sphaera","title_normalized":"","edition":"1585","subject":"Cosmological poetry","acquisition":{"date":"","place":"","channel":"","channel_key":""},"dispersal":{"channel":"","detail":"","louvain_core":false,"taken_1583":false,"stolen_lost":"","recovered":"","later_owners":"","saunder":"","fromond":"","ussher":""},"concordance":{"norlind_headword":"buchanan-sphaera"},"census_key":"","survivor_ids":[],"editorial_note":"Norlind: from Tycho's letter to Rothmann Jan 1587 (Opera VI,102), 'synes han ha ägt' a then-'recently published' edition — guessed Paris 1585 (4°) or rather Herborn 1586 (8°); the Herborn 1587 ed. is too late for the letter.","unlocatable":true},{"id":"e-norlind-cardano-subtilitate","key":"tycho-brahe-library","cat_no":"Norlind-cardano
