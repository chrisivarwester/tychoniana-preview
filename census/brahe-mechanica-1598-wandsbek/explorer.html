<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Census Explorer · Astronomiae Instauratae Mechanica (v0.26)</title>
<link rel="stylesheet" href="../../vendor/leaflet/leaflet.css">
<script src="../../vendor/leaflet/leaflet.js"></script>
<style>
:root {
  --bg: #f6f1e6; --surface: #fffdf8; --fg: #1a2238; --muted: #6b6450;
  --border: #ddd3bf; --rule: #e8e0d0;
  --accent: #9a7b32; --accent-soft: #f3ead2;
  /* A-D grade canon — docs/tychoniana/PRESENTATION_DOCTRINE.md 5a.2 */
  --grade-A: #9a7b32; --grade-B: #5070a0; --grade-C: #8b6030; --grade-D: #808080;
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{
  --grade-X: #9e9e9e;  /* ungraded — should not occur in a gated build */
  --status-lost: #8a8a8a; --status-market: #6a1b9a; --status-damaged: #7e5a1f;
  --status-inferred: #7a7f93;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
/* Column layout, order-independent: main takes the remaining height
   explicitly (flex:1). A bar injected as an extra body child (e.g. the
   Tychoniana breadcrumb the portal mirror adds) just stacks — unlike a
   positional grid, where it would shift every row's sizing. */
body {
  font: 14px/1.5 var(--sans); color: var(--fg); background: var(--bg);
  display: flex; flex-direction: column;
}

/* TOPBAR */
header.topbar {
  padding: 14px 18px; border-bottom: 4px solid var(--accent);
  background: linear-gradient(135deg, #1a2238, #2c3a63); color: #f6f1e6;
  display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap;
}
header.topbar h1 {
  font: normal 19px/1.3 var(--serif); letter-spacing: .5px; color: #f6f1e6;
}
header.topbar h1 .work-title { color: #c9a23f; }
header.topbar h1 small {
  font: 400 12px/1 var(--sans); color: #aeb4c6; margin-left: 8px;
}
header.topbar .meta-info {
  color: #aeb4c6; font-size: 12px; display: flex; gap: 14px;
}
header.topbar .badges { display: flex; gap: 6px; margin-left: auto; align-items: center; }
header.topbar .report-link {
  color: #c9a23f; font-size: 12px; text-decoration: none;
  border: 1px solid #4a5578; border-radius: 12px; padding: 3px 11px;
  white-space: nowrap;
}
header.topbar .report-link:hover { text-decoration: underline; }
.grade-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 9px; border-radius: 11px; font-size: 11px; font-weight: 600;
  color: white; cursor: help;
}
.grade-badge.A { background: var(--grade-A); }
.grade-badge.B { background: var(--grade-B); }
.grade-badge.C { background: var(--grade-C); }
.grade-badge.D { background: var(--grade-D); }
.grade-badge.X { background: var(--grade-X); }
.grade-badge .count { font-weight: 700; }

/* FILTER BAR */
nav.filters {
  padding: 8px 18px; border-bottom: 1px solid var(--border);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  background: var(--surface);
}
nav.filters .group-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); margin-right: 2px;
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border: 1px solid var(--border); border-radius: 12px;
  font-size: 12px; cursor: pointer; user-select: none;
  background: var(--surface); transition: all 0.12s;
  /* chips are real <button>s (keyboard access, E3) — neutralise UA button styling */
  font-family: inherit; color: inherit; line-height: inherit; margin: 0;
}
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip:hover { background: #f3eee4; }
.chip.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.confidence-A.active { background: var(--grade-A); border-color: var(--grade-A); }
.chip.confidence-B.active { background: var(--grade-B); border-color: var(--grade-B); }
.chip.confidence-C.active { background: var(--grade-C); border-color: var(--grade-C); }
.chip.confidence-D.active { background: var(--grade-D); border-color: var(--grade-D); }
.chip .ico { font-size: 10px; opacity: 0.7; }
.chip.cluster-active {
  background: var(--accent-soft); border-color: #c9b69a; color: var(--accent);
  font-weight: 600;
}
nav.filters .search {
  flex: 1; max-width: 260px;
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px;
  font: inherit; background: var(--surface);
}
nav.filters .count-text {
  margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
}

/* MAIN GRID */
main.layout {
  display: grid; grid-template-columns: minmax(360px, 1fr) minmax(420px, 1.4fr);
  overflow: hidden;
  flex: 1; min-height: 0;   /* fill whatever height the bars above leave */
}
section.left {
  display: grid; grid-template-rows: 3fr auto 4fr;
  border-right: 1px solid var(--border);
  overflow: hidden;
}
#map { width: 100%; height: 100%; background: #cfd6c5; }
.leaflet-control-attribution { font-size: 9px; }
/* One slim honesty line UNDER the map: what the map does NOT show.
   Markers are national flags (self-explanatory), so no legend is needed. */
.map-strip {
  padding: 4px 14px 5px; background: var(--surface);
  border-top: 1px solid var(--rule);
  font-size: 11px; line-height: 1.5;
}

/* COPY LIST */
ol.copy-list {
  overflow-y: auto; list-style: none; padding: 0; background: var(--surface);
  border-top: 1px solid var(--border);
}
ol.copy-list .empty {
  padding: 14px 18px; color: var(--muted); font-style: italic; font-size: 13px;
}
.list-item {
  display: grid; grid-template-columns: 1fr auto;
  gap: 9px; align-items: center;
  padding: 7px 14px; border-bottom: 1px solid var(--rule);
  cursor: pointer; font-size: 13px;
}
.list-item:hover { background: #f7f2e6; }
.list-item.active {
  background: #efe2c8;
  box-shadow: inset 3px 0 0 var(--accent);
}
.list-item .label-block {
  display: flex; flex-direction: column; min-width: 0;
}
.list-item .label-block .title {
  font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.list-item .label-block .city {
  font-size: 11px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.list-item .label-block .assoc {
  font: italic 11px/1.4 var(--serif); color: #6b6455;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.list-item.status-lost .label-block .title {
  text-decoration: line-through; text-decoration-color: rgba(0,0,0,0.25);
  color: var(--status-lost);
}
.list-item.status-inferred .label-block .title {
  font-style: italic; color: var(--status-inferred);
}
.list-item.status-attested .label-block .title { color: #6b6455; }
.list-item .indicators {
  display: flex; gap: 4px; align-items: center;
}
.list-item .indicators .tag {
  font: 600 9px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.05em;
  padding: 3px 6px; border-radius: 8px;
  background: #edf1ea; color: var(--grade-A); white-space: nowrap;
}
.list-item .indicators .tag.st {
  background: #f0eee8; color: var(--muted);
}
/* Country group headers — the list reads like a printed census. */
li.country-head {
  padding: 8px 14px 4px 14px; border-bottom: 1px solid var(--rule);
  font: 600 10px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--muted); background: var(--surface);
  position: sticky; top: 0; z-index: 5;
}
li.country-head .n { font-weight: 400; margin-left: 4px; }
/* Small inline national flag (list country headers, overview table) */
.flag-ico {
  display: inline-block; width: 16px; height: 11px; margin-right: 7px;
  vertical-align: -1px; border-radius: 2px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.12); line-height: 0;
}
.flag-ico svg { display: block; width: 100%; height: 100%; }

/* MAP MARKERS — one uniform house-gold dot per located copy. Grade and
   status stay in the tooltip, the filter chips, and the copy card; the map
   itself carries no colour code that would need a legend. */
.dot-marker {
  border-radius: 50%; border: 2.5px solid white;
  box-shadow: 0 0 4px rgba(0,0,0,0.4);
  background: var(--accent);
}
.dot-marker.status-lost {
  opacity: 0.55; border-style: dashed; border-color: #d8d3c8;
}
.dot-marker.active {
  transform: scale(1.55); z-index: 1000 !important;
  box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 0 8px rgba(0,0,0,0.6);
}

/* CARD */
section.right {
  overflow-y: auto; padding: 24px 32px;
  background: var(--surface);
}
.empty-state {
  padding: 80px 20px; text-align: center; color: var(--muted);
  font: italic 14px/1.6 var(--serif);
}
.empty-state .hint { font-size: 12px; margin-top: 10px; font-style: normal; }

/* OVERVIEW (default right panel) */
.overview { max-width: 560px; margin: 0 auto; padding: 12px 0; text-align: left; font-style: normal; }
.overview h2 {
  font: 600 19px/1.3 var(--serif); color: var(--fg); margin-bottom: 4px;
}
/* Citation head: author and imprint lines sit smaller around the title */
.overview h2.cite-head { font-weight: 400; line-height: 1.45; }
.overview h2.cite-head i { font-weight: 600; }
.overview h2.cite-head .cite-author,
.overview h2.cite-head .cite-imprint { font-size: 14px; }
.overview .lede { font-size: 13px; color: var(--fg); line-height: 1.65; margin: 10px 0 4px; }
/* Provisional-census banner — shown when the census is not yet exhaustive
   (an unreached mandatory channel, or located < a stated survival target). */
.overview .prov-banner {
  margin: 0 0 14px; padding: 8px 12px; border-radius: 5px;
  background: #f6ecd6; border: 1px solid #d9c9a0; color: #6b5836;
  font: 400 12px/1.55 var(--sans);
}
.overview .prov-banner strong { color: #7a5c1f; }
/* Total-copies headline — the census's clear count, above the country table */
.overview .ov-count {
  margin: 18px 0 2px; font: 400 15px/1.35 var(--serif); color: var(--fg);
}
.overview .ov-count .n { font-weight: 700; font-size: 21px; }
.overview .ov-count .split {
  display: block; margin-top: 3px;
  font: 400 11px/1.5 var(--sans); color: var(--muted);
}
/* Bibliographical anchors from census.toml [work] — gold labels, compact */
.overview .ov-bib { margin: 12px 0 2px; font-size: 12px; line-height: 1.65; }
.overview .ov-bib dt {
  font: 600 10px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--accent); margin-top: 11px;
}
.overview .ov-bib dd { margin: 3px 0 0; color: var(--fg); }
.overview h3 {
  font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin: 22px 0 10px 0;
}
table.ov-countries {
  border-collapse: collapse; font-size: 13px; width: 100%;
}
table.ov-countries td {
  padding: 4px 10px 4px 0; border-bottom: 1px solid var(--rule);
}
table.ov-countries td.n { text-align: right; width: 40px; font-variant-numeric: tabular-nums; }
.ov-grades { font-size: 12px; color: var(--muted); line-height: 1.7; }
.ov-grades .g { font-weight: 700; }
ul.untraced { list-style: none; padding: 0; }
ul.untraced li {
  padding: 7px 0 7px 14px; border-bottom: 1px solid var(--rule);
  font-size: 13px; line-height: 1.5; position: relative;
}
ul.untraced li::before {
  content: ""; position: absolute; left: 0; top: 14px;
  width: 7px; height: 7px; border-radius: 50%;
  border: 1.5px dashed #a89f8d; background: transparent;
}
ul.untraced li .place { color: var(--muted); }
ul.untraced li .why {
  display: block; font: italic 11.5px/1.5 var(--serif); color: #6b6455;
}
/* Discrete disclosure — reference detail folded away until the reader asks
   (grade breakdown, scope & method). */
.overview details.fold { margin-top: 20px; }
.overview details.fold summary {
  cursor: pointer; font: 600 11px/1 var(--sans); text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); padding: 4px 0;
}
.overview details.fold .body {
  font-size: 12px; color: var(--muted); line-height: 1.65; margin-top: 10px;
}
.overview details.fold .body strong { color: var(--fg); }
.overview .permalink-hint {
  margin-top: 20px; font-size: 11px; color: var(--muted); font-style: italic;
}
.map-note { color: var(--muted); }
.explorer-foot {
  padding: 8px 18px; border-top: 1px solid var(--border); background: var(--surface);
  font-size: 11px; color: var(--muted);
}
.copy-card .nav-row {
  display: flex; justify-content: space-between; gap: 8px;
  margin: -8px -4px 16px -4px; padding: 0 4px;
}
.copy-card .nav-row button {
  padding: 5px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; cursor: pointer; font: inherit; font-size: 11px;
  color: var(--muted); max-width: 38%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.copy-card .nav-row button:hover:not(:disabled) {
  background: #f5f0e2; color: var(--fg);
}
.copy-card .nav-row button:disabled { opacity: 0.35; cursor: default; }
.copy-card .nav-row .keyboard-hint { font-size: 10px; color: var(--muted); align-self: center; }

.copy-card .header-row {
  display: flex; gap: 12px; align-items: flex-start; margin-bottom: 6px;
}
.copy-card h2 {
  font: 600 23px/1.25 var(--serif); flex: 1; color: var(--fg);
}
.copy-card .status-row {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
}
.copy-card .status-pill {
  display: inline-block; padding: 2px 9px; border-radius: 10px;
  font-size: 11px; font-weight: 600;
}
.copy-card .status-pill.status-extant { background: #e0eee2; color: var(--grade-A); }
.copy-card .status-pill.status-lost { background: #ebebe8; color: var(--status-lost); }
.copy-card .status-pill.status-market { background: #ece5f2; color: var(--status-market); }
.copy-card .status-pill.status-damaged { background: #f4ead7; color: var(--status-damaged); }
.copy-card .status-pill.status-inferred { background: #e9eaf1; color: var(--status-inferred); font-style: italic; }
.copy-card .status-pill.status-attested { background: #f0ede4; color: #6b6455; font-style: italic; }
.copy-card .subtitle {
  color: var(--muted); margin-bottom: 14px; font-size: 13px; line-height: 1.5;
}
.copy-card .subtitle strong { color: var(--fg); font-weight: 600; }
.copy-card .actions {
  display: flex; gap: 8px; margin: 14px 0 22px 0; flex-wrap: wrap;
}
.copy-card .actions a {
  display: inline-flex; gap: 6px; align-items: center;
  padding: 5px 12px; border-radius: 4px;
  background: #f3efe2; color: var(--fg);
  text-decoration: none; font-size: 12px;
  border: 1px solid var(--border);
}
.copy-card .actions a:hover { background: #e8e1c7; }
.copy-card .actions a.primary {
  background: var(--accent); color: white; border-color: var(--accent);
}
.copy-card .actions a.primary:hover { background: #5e1717; }
.copy-card .actions a .ico { font-size: 10px; opacity: 0.6; }

.copy-card section { margin-bottom: 24px; }
.copy-card section h3 {
  font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 10px;
}

/* PROVENANCE TIMELINE */
ul.provenance {
  list-style: none; padding-left: 4px; position: relative;
}
ul.provenance li {
  padding: 0 0 14px 22px; position: relative;
  border-left: 2px solid var(--border); margin-left: 5px;
}
ul.provenance li:last-child { border-left-color: transparent; }
ul.provenance li::before {
  content: ""; position: absolute; left: -7px; top: 4px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--surface); border: 2.5px solid var(--accent);
}
ul.provenance li.kind-loss::before { border-color: var(--grade-D); background: var(--grade-D); }
ul.provenance li.kind-theft::before { border-color: var(--grade-D); background: var(--grade-D); }
ul.provenance li.kind-bequest::before { border-color: var(--grade-A); }
ul.provenance li.kind-sale::before, ul.provenance li.kind-auction::before {
  border-color: var(--status-market);
}
ul.provenance .owner { font-weight: 600; font-size: 14px; line-height: 1.3; }
ul.provenance .meta-line { font-size: 11px; color: var(--muted); margin-top: 3px; }
ul.provenance .meta-line .kind-tag {
  display: inline-block; padding: 1px 7px; border-radius: 8px;
  background: #f0eee8; color: var(--muted); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px;
}
ul.provenance .evidence {
  font: italic 12px/1.4 var(--serif); margin-top: 5px; color: #444;
  background: #faf8f1; padding: 5px 9px; border-radius: 3px;
  border-left: 2px solid var(--border);
}

/* PHYSICAL */
.physical-grid {
  display: grid; grid-template-columns: 90px 1fr; gap: 4px 14px;
  font-size: 13px;
}
.physical-grid dt { color: var(--muted); font-size: 12px; font-weight: 600; }
.physical-grid dd { line-height: 1.5; }
.physical-grid dd .meta-note {
  display: block; font-size: 11px; color: var(--muted);
  margin-top: 3px; font-style: italic;
}

/* COPY IMAGES */
.copy-images-grid {
  display: flex; flex-wrap: wrap; gap: 10px;
}
.copy-image-fig {
  margin: 0; width: 150px; cursor: zoom-in;
}
.copy-image-fig img {
  width: 150px; height: 112px; object-fit: cover;
  border: 1px solid var(--border); border-radius: 4px;
  background: #f0eee8; display: block;
  transition: box-shadow 0.12s;
}
.copy-image-fig:hover img { box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.copy-image-fig figcaption {
  font-size: 10.5px; line-height: 1.35; color: var(--muted);
  margin-top: 4px;
}
.lightbox {
  position: fixed; inset: 0; z-index: 99999;
  background: rgba(20,18,14,0.88);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; padding: 28px; cursor: zoom-out;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 92vw; max-height: 82vh; object-fit: contain;
  border-radius: 4px; box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  background: #fff;
}
.lightbox .lb-caption {
  color: #f4f0e6; font-size: 12px; line-height: 1.5;
  max-width: 720px; text-align: center;
}
.lightbox .lb-caption .lb-source { color: #b9b2a3; font-size: 11px; }

/* SURROGATES */
.surrogate-row {
  display: flex; gap: 8px; align-items: center; padding: 5px 0;
  font-size: 12px; border-bottom: 1px dotted var(--rule);
}
.surrogate-row:last-child { border-bottom: none; }
.surrogate-row .kind-tag {
  display: inline-block; padding: 2px 7px; border-radius: 3px;
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.04em; white-space: nowrap;
  background: #e3edf6; color: var(--grade-B);
}
.surrogate-row.kind-iiif-manifest .kind-tag { background: #e3edf6; color: var(--grade-B); }
.surrogate-row.kind-viewer .kind-tag { background: #e3f1e3; color: var(--grade-A); }
.surrogate-row.kind-ocr-pdf .kind-tag { background: #f0eee8; color: var(--muted); }
.surrogate-row.kind-facsimile-record .kind-tag { background: #f0e9d8; color: var(--accent); }
.surrogate-row.kind-absent .kind-tag { background: #fbe9e7; color: var(--grade-D); }
.surrogate-row.kind-needs_lookup .kind-tag { background: #fff4e0; color: var(--grade-C); }
.surrogate-row a { color: var(--accent); text-decoration: none; }
.surrogate-row a:hover { text-decoration: underline; }
.surrogate-row .notes {
  font-size: 11px; color: var(--muted); font-style: italic;
  flex: 1 1 100%; padding-left: 0; margin-top: 2px;
}

/* CLUSTERS */
.cluster-pill {
  display: inline-block; padding: 3px 11px; border-radius: 11px;
  background: var(--accent-soft); font-size: 11px;
  border: 1px solid #c9b69a; color: #5e1717;
  cursor: pointer; margin: 0 4px 5px 0;
}
.cluster-pill:hover { background: #e0cdb1; }
/* Standing COLLECTIONS filter chips in the nav bar (one per named cluster). */
.chip.cluster-filter-chip { background: var(--accent-soft); border-color: #c9b69a; color: #5e1717; }
.chip.cluster-filter-chip:hover { background: #e0cdb1; }
.chip.cluster-filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* REFERENCES */
ul.references {
  list-style: none; padding-left: 0;
}
ul.references li {
  padding: 6px 0; border-bottom: 1px dotted var(--rule);
  font-size: 12px; line-height: 1.5;
}
ul.references li:last-child { border-bottom: none; }
ul.references .ref-kind {
  display: inline-block; padding: 1px 7px; border-radius: 3px;
  background: #f0eee8; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.04em; margin-right: 6px; color: var(--muted);
  white-space: nowrap;
}
ul.references .ref-name { font-weight: 600; }
ul.references .ref-text { color: #333; }
ul.references .ref-truncated { color: var(--muted); cursor: pointer; }
ul.references .ref-truncated:hover { color: var(--fg); }

/* CONFIDENCE HISTORY */
.conf-history {
  margin-top: 8px; padding: 8px 12px; background: #fafaf6;
  border-left: 3px solid var(--grade-A); border-radius: 3px;
  font-size: 12px; line-height: 1.5;
}
.conf-history .arrow { color: var(--accent); font-weight: 700; margin: 0 4px; }

/* OPEN QUESTIONS */
ul.open-questions {
  list-style: none; padding-left: 0;
}
ul.open-questions li {
  padding: 6px 0 6px 22px; position: relative; font-size: 13px;
}
ul.open-questions li::before {
  content: "?"; position: absolute; left: 0; top: 4px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--grade-C); color: white; font-weight: 700;
  text-align: center; line-height: 16px; font-size: 11px;
}

/* SCOPE PANEL */
.scope-panel {
  background: #fbf8ee; border: 1px solid #e6dec4; border-radius: 4px;
  padding: 14px 18px; margin-bottom: 16px; font-size: 12px; line-height: 1.55;
}
.scope-panel h4 { font: 600 11px/1.4 var(--sans); text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
.scope-panel p { margin-bottom: 10px; color: #3a3a3a; }
.scope-panel p:last-child { margin-bottom: 0; }

/* HELP TOOLTIP */
.tooltip-host { position: relative; cursor: help; }
.tooltip-host::after {
  content: attr(data-tooltip); position: absolute; bottom: calc(100% + 6px);
  left: 50%; transform: translateX(-50%);
  padding: 6px 10px; background: var(--fg); color: var(--bg);
  border-radius: 4px; font-size: 11px; line-height: 1.4; width: max-content;
  max-width: 240px; text-align: left;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
  z-index: 9999;
}
.tooltip-host:hover::after { opacity: 1; }
/* ---------------------------------------------------------------------------
   NARROW VIEWPORTS (phones, small tablets)

   The desktop explorer is a fixed-viewport app shell: a two-column grid whose
   panes scroll independently inside 100vh. Below ~860px that model breaks —
   the grid's own minimum width (360+420px) exceeds the viewport, so the right
   panel is clipped off-screen and the body scrolls sideways (observed on an
   iPhone, 2026-07-20). Here the shell unwinds into ONE column that scrolls as
   an ordinary page: map, then copy list, then the copy card beneath them.
   Every rule below only relaxes a desktop constraint; none restyles the
   census's visual identity, which stays as specified in spec section 4.bis.
   --------------------------------------------------------------------------- */
@media (max-width: 860px) {
  /* release the 100vh app-shell so the page scrolls normally */
  html, body { height: auto; }
  body { display: block; overflow-x: hidden; }

  main.layout {
    display: block; overflow: visible; flex: none; min-height: 0;
  }
  section.left {
    display: block; overflow: visible; border-right: none;
  }
  section.right {
    overflow: visible; padding: 20px 16px;
    border-top: 1px solid var(--border);
  }

  /* the map needs an explicit height once its grid track is gone */
  #map { height: 44vh; min-height: 250px; }

  ol.copy-list { overflow-y: visible; }

  /* let long institution names and shelfmarks wrap instead of being
     ellipsed to nothing in a narrow column */
  .list-item { padding: 11px 14px; }
  .list-item .label-block .title,
  .list-item .label-block .city,
  .list-item .label-block .assoc {
    white-space: normal; overflow: visible; text-overflow: clip;
  }

  header.topbar { padding: 12px 14px; gap: 10px; }
  header.topbar h1 { font-size: 17px; }
  header.topbar .badges { margin-left: 0; }
  nav.filters { padding: 10px 14px; gap: 8px; }
  nav.filters .count-text { margin-left: 0; width: 100%; }

  .overview { max-width: none; }

  /* wide content scrolls inside itself, never the page body */
  .copy-card table, .overview table, pre { display: block; overflow-x: auto; max-width: 100%; }
  .copy-card { max-width: 100%; }

  /* The card header is a flex row (title | status chips). At this width the
     chip group gets crushed to ~80px while needing ~198px, and overflows the
     page. Give the title its own line and let the chips sit beneath it. */
  .copy-card .header-row { flex-wrap: wrap; }
  .copy-card .header-row h2 { flex: 1 1 100%; min-width: 0; }
  .copy-card .status-row { flex: 0 0 auto; max-width: 100%; }

  /* shelfmarks, URLs and citation lines must break rather than push the page */
  .copy-card, .copy-card a, .copy-card code, .overview, .overview a {
    overflow-wrap: anywhere;
  }
  .copy-card dl { grid-template-columns: 1fr; gap: 2px 0; }
  .copy-card dl dt { margin-top: 8px; }
}
</style>
</head>

), Supreme Chancellor of the Kingdom of Bohemia under Rudolf II", "provenance_chain": [{"kind": "gift", "owner": "Zdeněk Vojtěch Popel z Lobkovic (1568–1628), Supreme Chancellor of the Kingdom of Bohemia under Rudolf II", "evidence": "Tycho's autograph dedication on the front flyleaf verso: 'ILLVSTRI ET GENEROSO DOMINO / DNO SDENCO ADALBERTO POPL / BARONI in LOBKOWITZ DOMINO in CHLVMETZ / et GISIBVRJ SACRÆ CÆSAREÆ MAIESTATIS / CONSILIARIO et SVPRAEMO REGNI BOHEMIÆ / CANCELLARIO / Domino honorandissimo et observan[d]issimo / d.d.t. / Tycho Brahe / Anno 1600 / Augusti / Die 18'. Dedication body in a scribal hand (probably a Tycho-household scribe in Prague); the signature 'Tycho Brahe' and the date 'Anno 1600 / Augusti / Die 18' in Tycho's own cursive autograph (consistent with Tycho's documented late-period cursive: Graphonomicon, brahe-tycho; specimen cambrai-mechanica-lobkowitz, verdict probable). Transmission via amanuensis is corroborated by Tycho's letter to Jessenius, May 1600 (TBOO VIII, 317).", "date": "1600-08-18", "place": "Prague", "confidence": "A", "source": {"kind": "first-hand", "ref": "Direct inspection of the autograph dedication on the Gallica PDF surrogate, 2026-05-25"}}, {"kind": "ownership", "owner": "Unknown intermediate holder (post-Lobkowitz, pre-Abbey of Saint-Sépulcre Cambrai)", "evidence": "Two cursive ink inscriptions on the title page above the abbey's italic ownership inscription, both heavily struck through. Not legible at current image resolution; the obliteration is the abbey's act of asserting ownership over a previously-held volume. Date range bounded by Lobkowitz's gift (1600) and the abbey's dissolution (1790s).", "date": "1600 – c. 1790", "confidence": "C", "source": {"kind": "first-hand", "ref": "Direct inspection of obliterated inscriptions on the Gallica PDF surrogate title page, 2026-05-25"}}, {"kind": "ownership", "owner": "Abbaye Saint-Sépulcre de Cambrai (Benedictine abbey of the Holy Sepulchre, founded 1064 by Bishop Liéb round blue Cambrai BM library stamp on title page and on colophon page. The G3 INGENIOSE manuscript correction (the imperfectly-printed headline word supplied in pen-and-ink, as in most known copies) is PRESENT in this copy and is paleographically distinctive — the diacritical marks Ï and Ê are visible in the hand-supplied 'ÏNGENIOSÊ', a feature that could discriminate hands across surviving copies if compared (e.g. against the same feature in the Lynge / Tosterup copy).", "scribe_suite_ref": "reference/graphonomicon/brahe-tycho/specimens/cambrai-mechanica-lobkowitz.json", "hands_identified": ["Tycho Brahe (autograph dedication to Zdeněk Vojtěch Popel von Lobkowitz, dated 18 August 1600; Mosley 2007 and Norlind 1970 record the dispatch as 8 August — see open questions)", "Tycho Brahe — autograph element (graphonomicon brahe-tycho/cambrai-mechanica-lobkowitz; verdict probable)", "Tycho Brahe — autograph signature 'Tycho Brahe' + date 'Anno 1600 / Augusti / Die 18' on the front flyleaf verso, beneath a scribe-prepared dedication body to Zdeněk Vojtěch Popel von Lobkowitz. The body is in a careful calligraphic hand (likely a scribe in Tycho's Prague household); the signature and date are in Tycho's own cursive autograph hand (consistent with his documented late-period prose hand: Graphonomicon, brahe-tycho).", "Abbey of Saint-Sépulcre at Cambrai — at least one ownership inscription on the front flyleaf recto ('Ex bibliot[heca] S[ancti] Sepulchri Cameraci') and a second on the title page in a different (more formal italic) hand ('Bibliothecæ S[ancti] Sepulcri Cameracen[sis]') — different scribes, separated in time.", "Unknown pre-abbey owner — two cursive inscriptions on the title page above the abbey's italic-hand attribution, both heavily struck-through and not legible at the 400-dpi resolution available; these obliterations are presumably the abbey's act when it asserted ownership over a volume previously held privately or by another institution."]}, "binding": {"period": "contemporary", "style": "original 1598 silk presentation binding: light blue-green silk on both wooden boards, diamond-frame gilt-ribbon decoration forming a central lozenge with small diamond corner ornaments along the borders; dark green silk spine. Spine carries a later gilt 'C' label (Cambrai library marking, presumably C19) plus paper shelfmark labels '976' (twice) and a partially-legible 'R.S xxxx' label.", "originality": "original", "notes": "Twin supralibros on the silk boards (the central oval medallions): (a) FRONT-COVER medallion shows a standing figure in robes with gilt rim inscription — partial letters legible ('TYCH...' or similar) consistent with the documented TYCHO BRAHE PORTRAIT supralibros known from other apex-tier Mechanica presentation copies; (b) BACK-COVER medallion shows a double-headed eagle (Reichsadler) with a central shield and gilt rim inscription — consistent with TYCHO'S OWN ARMS supralibros (incorporating the Imperial double-headed eagle of his 1599 Habsburg ennoblement). The same portrait + arms supralibros pair is documented for the St Petersburg RNL Otto II copy (where the silk is only fragmentary and now pasted onto later pasteboard); the Cambrai copy preserves the same scheme INTACT on the original silk boards. This makes Cambrai (provisionally, pending higher-resolution heraldic verification of the supralibros inscriptions) the only fully-intact silk-bound Mechanica copy with both portrait and arms supralibros surviving on the original presentation binding. Cf. G. Leboyer, Revue des Bibliothèques 33 (1923), 297–303. Inside-board markings: '976' (paper label, upper left) and 'RS XXXX' (paper label, lower left) on front. Faint impression / ghost of the back-cover supralibros visible on the rear flyleaf — confirms the medallion is embossed / raised work."}, "completeness": "complete", "illumination": {"group": "A", "title_page": "coloured-with-gold", "body_leaves": "fully-coloured-with-gold", "portrait": "unknown", "gold_used": true, "evidence": "Direct PDF inspection of the Gallica digital surrogate, 2026-05-25. Title page: the central Suspiciendo / Despicio woodcut allegory (the reclining male figure + putto) and the surrounding roeskenrammer border are both visibly hand-coloured (flesh tones on figures, green grass, red drapery, green/yellow on the border foliage); the printed text TYCHONIS BRAHE / ASTRONOMIAE INSTAURATAE / MECHANICA remains in the standard red-and-black press impression, with the handcolouring applied to the woodcut elements that surround it. Body throughout: the 22 instrument plates show comprehensive handcolouring with multi-pigment palettes (atmospheric blue-to-pink sky gradients, painted floors, multi-colour instrument bodies); text pages carry coloured woodcut initials, coloured roeskenrammer borders, and coloured ornamental cartouches at section headers; the colophon vignette (the complementary Despiciendo / Suspicio allegory) is also fully hand-coloured. No leaf observed without colouring on its woodcut elements.", "notes": "FIRST CONFIRMED GROUP A in our Mechanica colouring taxonomy. The Cambrai / Lobkowitz copy is the apex-tier example: title-page illuminated, body fully coloured with gold, on the original silk presentation binding with twin Tycho-portrait + Tycho-arms supralibros — the maximally-finished presentation state. Lobkowitz was Supreme Chancellor of the Kingdom of Bohemia at Rudolf II's court, and the 18 August 1600 dispatch postdates the documented colourist bottleneck (Tycho to Herwart, 31 August 1599, TBOO VIII, 162.25-29) by nearly a year — by which time the colourist had evidently resumed work on the apex tier of the gift programme. Consistent with the H3 hybrid hypothesis: deliberate recipient-tier intent (silk binding + twin supralibros + apex colouring + autograph dedication) aligned with workflow throughput (the colourist had time and capacity to complete the title-page illumination)."}}, "references": [{"kind": "prior-census", "name" t recover the underlying text. Reconstruction route: the gift was made at Prague to a Bohemian magnate (1600); the next confirmed owner is a Benedictine abbey in Cambrai (Hainaut, Spanish Netherlands at the time). Plausible intermediaries: a Jesuit college in Bohemia or the Spanish Netherlands; a Habsburg court figure who travelled the Prague-Brussels axis; a private collector in the Low Countries who acquired books from the Lobkowitz dispersal (Lobkowitz himself was Habsburg-loyalist and his library partly passed to Roudnice castle, partly dispersed). The route from Bohemian Lobkowitz to Cambrai abbey is the historical puzzle this copy poses.", "Verify the front-cover supralibros identification (standing figure + gilt rim inscription) as the Tycho Brahe portrait medallion via comparison to the documented St Petersburg RNL Otto II copy's portrait supralibros (fragmentary, now on pasteboard). Higher-resolution imaging of the rim inscription on both copies — or correspondence with Cambrai BM curators for direct examination — would settle whether the inscription reads 'TYCHO BRAHE' / 'TYCHONIS BRAHE' or a different formula.", "Verify the back-cover supralibros (double-headed Reichsadler + central shield) as Tycho's own arms with Imperial-eagle augmentation. The 1599 Habsburg ennoblement granted Tycho the use of the Imperial eagle in his arms; if this medallion shows that scheme, the cover-pair is the matched 'portrait + arms' presentation set documented for the highest-status Mechanica gifts.", "Cross-copy G3 INGENIOSE collation: the Cambrai copy is the second documented case (after Lynge / Tosterup) of the manuscript supply of 'ÏNGENIOSÊ' on G3. The two cases now constitute a comparison sample for testing whether the corrections were made centrally (single hand across copies — Tycho or one trusted scribe) or by local owners on Tycho's instruction (varying hands). A side-by-side comparison of the Cambrai and Lynge ÏNGENIOSÊ corrections would discriminate."], "confidenc te private holder between Tosterup (until ca. 1976) and Lynge is not named in Lynge's public description and is not otherwise attested; identifying it would require a direct enquiry to Herman H. J. Lynge & Søn (order-nr. 60123).", "Resolved (2026-06-04): The Lynge/Tosterup copy is a SEPARATE exemplar from the Beltrame copy. Beltrame Library Part I lot 23 (Christie's 2016, passed) is now definitively the HAAB-Weimar recovered Sitsch von Stubendorf copy (ex-Logau / ex-Weimar Loc A:33), acquired privately by HAAB in 2019 (accession 2019/08935, shelfmark 15, 2: 23) — see census record weimar-haab-15-2-23-recovered-2019 (whose market history carries the Beltrame lot; the separate market record was retracted as a duplicate, v0.18/v0.26). The Lynge copy's provenance (continuous Tosterup residence; blue-silk binding; no Weimar/Logau overlap) shares nothing with the Beltrame/HAAB chain. So both the 'Beltrame post-sale fate' and 'Lynge = Beltrame?' questions are closed: Beltrame -> HAAB Weimar; Lynge = independent Tosterup copy. Cross-record basis: weimar-haab-15-2-23-recovered-2019 (incl. its merged Beltrame market events).", "Resolved (2026-06-04): The copy bears NO autograph dedication leaf, so it has no named dedicatee; 'sent to his family at Tosterup' is a provenance inference from four centuries of continuous estate residence, not from a dedication. The foster parents — Jorgen Brahe (d.1565) and Inger Oxe (d.1591) — both predeceased the 1598 printing and cannot be the recipients. Any gift therefore went to the Brahe-family line then holding Tosterup, not to either foster parent; the specific 1598 holder is undetermined from available sources and the 'presentation copy' framing should be qualified accordingly. Basis: Christianson 2000 (foster-parent dates); this record.", "Logged (4 June 2026) as a cross-copy collation feature: the imperfectly-printed headline 'INGENIOSE' on G3, supplied in manuscript ('presumably in Brahe's own hand', Lynge), is a documented print-run f dge of the book block shows green sprinkled / painted edge treatment (visible on the edge-capture pages of the digital surrogate).", "originality": "rebound", "notes": "v0.20 first-hand inspection of the HAAB IIIF surrogate (104 captures including binding views, 25 May 2026) UPGRADED the binding description from 'contemporary, originality unknown' to 'later replacement, originally silk presentation but lost.' The Buntpapier style of the current binding is consistent with a late 18th- or early 19th-century German trade binding — possibly applied at Weimar after the 1704 acquisition, but equally possibly applied during the 1965-1989 theft period when the silk + supralibros would have been a strong identification risk for a stolen institutional copy. The lost binding fragments are not documented as having entered any market record."}, "marginalia": {"density": "sparse", "hands_count": 5, "hands_identified": ["Tycho Brahe (autograph dedication to Johann VI Sitsch von Stubendorf, Bishop of Breslau) — dedication leaf REMOVED, confirmed by first-hand 2026-05-25 inspection (no dedication leaf present between the front flyleaves and the title page). Standard Mosley/Norlind attribution.", "Balthasar Friedrich von Logau (armorial stamp, circular faded-blue, applied tilted) — confirmed first-hand 2026-05-25 at the top margin of the watercolour-portrait leaf (PDF p019 of the IIIF capture), above the painted arch. Stamp is too faded for direct heraldic identification but its size, shape and position match the documented Logau library stamp.", "Manuscript supply of 'JN-GENIOSÉ' on the imperfectly printed headline of G3 (PDF p082 of the IIIF capture) — supplied in pen-and-ink in a cursive italic hand with acute accent over the terminal E; orthographically distinct from the Cambrai/Lobkowitz copy's 'ÏNGENIOSÊ' supply (which uses a circumflex). One of three documented G3 INGENIOSE manuscript supplies in the census (the others: Cambrai, Lynge/Tosterup). Attribution to Tycho's hand routine but not yet forensically verified against the documented specimens of Tycho's hand (Tycho Brahe Graphonomicon).", "Charles Thellusson — engraved bookplate (early-19th-century copperplate style) pasted on a front flyleaf (PDF p015): central crest = rampant collared hound between two outspread wings; copperplate-script signature 'Charles Thellusson' beneath. The Thellusson family were Anglo-Swiss bankers established at Brodsworth (Yorkshire); multiple Charleses are documented in the 18th–19th centuries. The engraving style is firmly 19th-century, which sits in tension with the previously-recorded 'C20-late' provenance attribution — see open questions for the discrepancy.", "Fragmentary blue inked library stamp 'Leitz...au' (×2 impressions on the same flyleaf verso, PDF p017) — partial inking has left the central letters illegible. Possibly a Saxon or Silesian institutional stamp of the late C19 or early C20; identification pending. Same leaf shows bleed-through of a German printed text from the adjacent recto, suggesting an old library-cataloguing insert is bound in between the Thellusson exlibris and the title page."], "languages": ["la", "de"], "character": "Multiple discrete provenance markers across the front matter, none in the body text proper. Front-flyleaf cluster: Thellusson engraved bookplate (p015); 'E 31.' faded-ink old shelfmark (p016); 'Leitz...au' fragmentary blue stamps + German Fraktur bleed-through (p017). Title page (p018) and adjacent watercolour-portrait leaf (p019) carry the Logau armorial stamp at the top margin of p019. Body fully Group A coloured with no reader marginalia or annotations observed. G3 INGENIOSE supplied in manuscript per the bibliographic norm.", "significance": "high"}, "illumination": {"group": "A", "title_page": "coloured-with-gold", "body_leaves": "fully-coloured-with-gold", "portrait": "watercolour-substitute", "gold_used": true, "evidence": "First-hand inspection of the full HAAB IIIF surrogate at native resolution, 25 May 2026. Title page (PDF p018): the Suspiciendo / Despicio woodcut allegory is fully hand-coloured (flesh tones on the reclining male figure, blue robe, green grass, red drapery on the putto); the surrounding roeskenrammer border is hand-coloured in green. Body throughout: every text-page border coloured, every initial coloured, every ornamental cartouche coloured; the 22 instrument plates carry comprehensive multi-pigment handcolouring with atmospheric blue-to-pink sky gradients (parallactic instrument p030 equivalent), painted floors and multi-colour instrument bodies (Armillæ Æquatoriæ p047 etc.). Colophon vignette (PDF p101) fully coloured. The watercolour Tycho portrait at PDF p019 is a hand-painted COPY of the Jacques de Gheyn 1590 engraving — same caption 'ÆTATIS SVÆ ANNO 40. ANNO DNI 1586 COMPL', same architectural arch + 16 ancestor-arms surround, same 'NON HABERI / SED ESSE' motto on the pedestals.", "notes": "SECOND CONFIRMED GROUP A in our Mechanica colouring taxonomy (after the Cambrai / Lobkowitz copy confirmed). Combined with the watercolour-portrait-substitute feature, the HAAB Weimar copy refines the previously-distinct subgroups: the HAAB watercolour portrait is a hand-painted COPY OF THE GHEYN ENGRAVING (showing Tycho aged 40 in 1586 per the caption — identical to the standard engraving), whereas the Stockholm KVA H1 copy's watercolour portrait is described in our record as 'from his last years' (i.e. c. 1600-1601, a different and later likeness). The HAAB and KVA/Kalocsa portraits may therefore be DIFFERENT sub-variants of the watercolour-portrait subgroup: (a) watercolour-Gheyn-replica (HAAB Weimar) — copies where the standard pasted Gheyn engraving was substituted with a high-fidelity painted replica of the same image; (b) watercolour-late-Tycho (KVA, Kalocsa) — copies where a different, later-Tycho likeness was inserted. Side-by-side comparison of the HAAB and KVA/Kalocsa portraits should resolve whether these are genuinely two sub-variants c A:33 as restored' concerns HAAB's own internal register, not this census; our record already represents the recovery correctly. Basis: this record's provenance chain + HAAB digital metadata (already cited).", "G3 INGENIOSE manuscript supply orthography differs: HAAB writes 'JN-GENIOSÉ' with acute over E; Cambrai writes 'ÏNGENIOSÊ' with circumflex. A forensic hand comparison of the two manuscript supplies (now both available in high-resolution captures) would discriminate whether (a) the same hand wrote both with minor orthographic variation, supporting centralised correction by Tycho or a single Prague-workshop scribe; or (b) different hands wrote each, supporting Lynge's framing that the corrections were made by local owners on Tycho's instruction. The bibliographic feature is the same; the paleographic question is now tractable."], "confidence_history": [], "evidence": {}, "checks": [], "images": []}, {"slug": "whipple-cambridge", "display_label": "Cambridge, Whipple Library, University of Cambridge", "institution": "Whipple Library, Department of History and Philosophy of Science, University of Cambridge", "siglum": "Whipple Library", "city": "Cambridge", "country": "GB", "shelfmark": "(not yet retrieved via Whipple OPAC)", "catalogue_url": "", "lat": null, "lng": null, "confidence": "B", "status": "attested", "recipient": "Whipple Library, Department of History and Philosophy of Science, University of Cambridge", "provenance_chain": [], "physical": {}, "references": [{"kind": "prior-census", "name": "Norlind 1933", "ref": "Tycho Brahe Bibliografi och Källskrift, Uppsala 1933, Mechanica chapter"}, {"kind": "prior-census", "name": "Lauritz Nielsen 1921", "number": "LN 432"}, {"kind": "institutional-catalogue", "name": "VD16", "number": "B 6888", "ref": "VD16 master record at gateway-bayern.de/VD16+B+6888 — verified 2026-05-24 via direct catalogue enquiry. VD16 lists 4 holdings: UBM01/DE-19 (Munich UB), VD047/DE-14 (SLUB Dresden), VD075/DE-39 (FB Gotha), VD170/DE // Initial-view state: fit to the located copies, and keep refitting on
// container resizes until the user takes over the map themselves.
let mapBounds = null;
let autoView = true;
function fitToCopies() {
  if (mapBounds) map.fitBounds(mapBounds, { padding: [24, 24], maxZoom: 6 });
}
