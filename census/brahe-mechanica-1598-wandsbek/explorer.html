function flagIco(cc) {
  const fl = FLAGS[cc];
  return fl ? `<span class="flag-ico">${fl}</span>` : "";
}

const markersBySlug = {};
function buildMarker(copy) {
  if (copy.lat == null || copy.lng == null) return null;
  const icon = L.divIcon({
    className: `dot-marker status-${copy.status}`,
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });
  const m = L.marker([copy.lat, copy.lng], { icon });
  m.bindTooltip(
    `<strong>${escapeHtml(copy.display_label)}</strong><br><span style="color:#888">${escapeHtml(copy.city || "")}${copy.country ? ", " + escapeHtml(countryName(copy.country)) : ""} · grade ${copy.confidence}</span>`,
    { direction: "top", offset: [0, -6] }
  );
  m.on("click", () => setActive(copy.slug));
  return m;
}

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, ch => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
  ));
}

function truncate(s, n) {
  if (!s) return "";
  if (s.length <= n) return s;
  return s.slice(0, n - 1) + "…";
}

function filteredCopies() {
  const f = state.filters;
  return DATA.copies.filter(c => {
    if (!f.confidence.has(c.confidence)) return false;
    if (!f.status.has(c.status)) return false;
    if (f.onlySurrogate && !(c.has_surrogate || c.has_iiif)) return false;
    if (f.cluster && !c.clusters.includes(f.cluster)) return false;
    if (f.search) {
      const blob = [
        c.display_label, c.shelfmark, c.institution, c.recipient,
        c.city, c.country, c.siglum,
        ...(c.clusters || []),
      ].join(" ").toLowerCase();
      if (!blob.includes(f.search)) return false;
    }
    return true;
  });
}

// Plain-language country names for the grouped list (ISO 3166-1 alpha-2).
// Fallback: the code itself, so an unmapped code degrades readably.
const COUNTRY_NAMES = {
  AT: "Austria", AU: "Australia", BE: "Belgium", CA: "Canada", CH: "Switzerland",
  CZ: "Czech Republic", DE: "Germany", DK: "Denmark", EE: "Estonia", ES: "Spain",
  FI: "Finland", FR: "France", GB: "Great Britain", GR: "Greece", HU: "Hungary",
  IE: "Ireland", IT: "Italy", JP: "Japan", NL: "Netherlands", NO: "Norway",
  PL: "Poland", PT: "Portugal", RU: "Russia", SE: "Sweden", UA: "Ukraine",
  US: "United States", VA: "Vatican City",
};
function countryName(code) { return COUNTRY_NAMES[code] || code || "Location unrecorded"; }

// Reader-facing label for a status value. The stored/schema value stays
// canonical (e.g. "damaged"); only the display text changes.
const STATUS_LABELS = { attested: "recorded, untraced", damaged: "defective" };
function statusLabel(s) { return STATUS_LABELS[s] || s; }

// Display ordering: country (by located-copy count) → city → label,
// the printed-census convention.
function orderCopies(arr) {
  const countryRank = {};
  Object.keys(DATA.meta.country_counts).forEach((cc, i) => { countryRank[cc] = i; });
  arr.sort((a, b) => {
    let ra = a.country ? (countryRank[a.country] ?? 500) : 900;
    let rb = b.country ? (countryRank[b.country] ?? 500) : 900;
    if (a.status === "attested") ra = 990;   // trailing "not located today" group
    if (b.status === "attested") rb = 990;
    if (ra !== rb) return ra - rb;
    const cc = (a.city || "").localeCompare(b.city || "");
    if (cc !== 0) return cc;
    return a.display_label.localeCompare(b.display_label);
  });
  return arr;
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
function init() {
  document.getElementById("title-text").textContent = DATA.meta.title_short;
  document.getElementById("edition-text").textContent = DATA.meta.edition;
  document.getElementById("version-text").innerHTML =
    `<span>${DATA.meta.author} · ${escapeHtml(DATA.meta.place)} ${DATA.meta.year || ""}</span>`;

  // Version and build date live in the footer, next to the citation guidance,
  // where the citing reader needs them.
  document.getElementById("explorer-foot").innerHTML =
    `Census version ${escapeHtml(DATA.meta.version)} · built ${escapeHtml(DATA.meta.last_built)} · ` +
    `every copy card carries a stable <code style="background:#f0eee8;padding:1px 4px;border-radius:3px">?copy=…</code> permalink and a ready-made citation line.`;

  const GRADE_GLOSS = {
    A: "Verified: examined first-hand, confirmed by a live institutional record, or anchored by a documented dated dispatch",
    B: "Documented: recorded by a named scholar or an institutional catalogue, but not independently examined",
    C: "Reported: attested in a source that has not been re-verified",
    D: "Contested: rumoured, or the evidence conflicts",
  };
  const badges = document.getElementById("grade-badges");
  for (const g of ["A", "B", "C", "D"]) {
    if (!(DATA.meta.grade_counts[g] || 0)) continue;   // a zero grade is noise, not information
    const b = document.createElement("span");
    b.className = "grade-badge " + g + " tooltip-host";
    b.dataset.tooltip = GRADE_GLOSS[g];
    b.innerHTML = `${g}&nbsp;<span class="count">${DATA.meta.grade_counts[g]}</span>`;
    badges.appendChild(b);
  }
  const nInferred = DATA.meta.status_counts["inferred"] || 0;
  const nAttested = DATA.meta.status_counts["attested"] || 0;
  const nTomlUntraced = (DATA.untraced || []).length;
  const nVerified = DATA.meta.n - nInferred - nAttested;
  const tot = document.createElement("span");
  tot.style.fontSize = "12px"; tot.style.color = "var(--muted)"; tot.style.marginLeft = "8px";
  // Copy-record tiers first; library-level attestations ([[untraced]] blocks,
  // which are not copy records) appended as their own figure.
  const parts = [`${nVerified} verified`];
  if (nAttested) parts.push(`${nAttested} recorded, untraced`);
  if (nInferred) parts.push(`${nInferred} inferred (no exemplar)`);
  let headline = `· ${DATA.meta.n} ${DATA.meta.n === 1 ? "copy" : "copies"} documented`
    + (parts.length > 1 || nAttested || nInferred ? ` (${parts.join(" · ")})` : "");
  if (nTomlUntraced) headline += ` · ${nTomlUntraced} further recorded ${nTomlUntraced === 1 ? "holding" : "holdings"} untraced`;
  tot.textContent = headline;
  badges.appendChild(tot);

  // Adaptive filter bar: a chip that matches zero copies filters nothing —
  // hide it rather than teach the reader to distrust the controls.
  for (const chip of document.querySelectorAll('.chip[data-filter="confidence"]')) {
    if (!(DATA.meta.grade_counts[chip.dataset.val] || 0)) chip.style.display = "none";
  }
  for (const chip of document.querySelectorAll('.chip[data-filter="status"]')) {
    if (!(DATA.meta.status_counts[chip.dataset.val] || 0)) chip.style.display = "none";
  }
  if (!DATA.copies.some(c => c.has_surrogate || c.has_iiif)) {
    document.getElementById("surr-chip").style.display = "none";
  }

  // Under-map note: what the map does NOT show — the guard against reading
  // the marker count as the census count. One short muted line.
  const unmapped = DATA.copies.filter(c => (c.lat == null || c.lng == null)
    && c.status !== "inferred" && c.status !== "attested").length;
  const noteParts = [];
  if (unmapped) noteParts.push(`${unmapped} in private hands or unlocalised`);
  if (nAttested) noteParts.push(`${nAttested} recorded but untraced`);
  if (nInferred) noteParts.push(`${nInferred} inferred, never located`);
  if (noteParts.length) {
    const note = document.getElementById("map-note");
    note.textContent = "Not on the map: " + noteParts.join(" · ");
    note.style.display = "";
  }

  for (const c of DATA.copies) {
    const m = buildMarker(c);
    if (m) markersBySlug[c.slug] = m;
  }

  // Open on the copies themselves, not a hard-coded frame: fit the view to
  // every located marker (a Scandinavian census frames Scandinavia; a census
  // with American copies frames the Atlantic). maxZoom caps a one-city
  // census at a readable regional scale.
  const pts = Object.values(markersBySlug).map(m => m.getLatLng());
  if (pts.length) { mapBounds = L.latLngBounds(pts); fitToCopies(); }

  // Leaflet measures its container once; keep tiles + view honest across
  // layout changes. Auto-refit stops as soon as the user touches the map.
  const mapEl = document.getElementById("map");
  for (const ev of ["pointerdown", "wheel"]) {
    mapEl.addEventListener(ev, () => { autoView = false; },
      { capture: true, passive: true });
  }
  new ResizeObserver(() => {
    map.invalidateSize();
    if (autoView) fitToCopies();
  }).observe(mapEl);

  // Default right panel: the census overview — what a scholar arriving at
  // this page wants first. The scope contract stays available, folded.
  const countryRows = Object.entries(DATA.meta.country_counts)
    .map(([cc, n]) => `<tr><td>${flagIco(cc)}${escapeHtml(countryName(cc))}</td><td class="n">${n}</td></tr>`)
    .join("");
  const gradeLine = ["A", "B", "C", "D"]
    .filter(g => DATA.meta.grade_counts[g])
    .map(g => `<span class="g">${g}</span> ${DATA.meta.grade_counts[g]} — ${escapeHtml(GRADE_GLOSS[g].split(":")[1].trim())}`)
    .join("<br>");
  let untracedHtml = "";
  const attestedCopies = DATA.copies.filter(c => c.status === "attested");
  if (nTomlUntraced || attestedCopies.length) {
    // Two kinds of remainder, one strip: attested COPY RECORDS (rich — they
    // carry provenance and dated negative checks; click through to the card)
    // first, then library-level attestations from [[untraced]].
    const copyItems = attestedCopies.map(c => `
      <li><strong><a href="#" data-untraced-slug="${escapeHtml(c.slug)}" style="color:inherit">${escapeHtml(c.display_label)}</a></strong>
        <span class="place"> · last recorded ${escapeHtml(c.city || "—")}${c.country ? ", " + escapeHtml(countryName(c.country)) : ""}</span>
        <span class="why">A documented copy record with no live evidence today — open its card for the provenance and the dated search results behind that judgement.</span>
      </li>`).join("");
    const tomlItems = (DATA.untraced || []).map(u => `
      <li><strong>${escapeHtml(u.institution)}</strong>
        ${u.city ? `<span class="place"> · ${escapeHtml(u.city)}${u.country ? ", " + escapeHtml(countryName(u.country)) : ""}</span>` : ""}
        ${u.note ? `<span class="why">${escapeHtml(u.note)}</span>` : ""}
      </li>`).join("");
    untracedHtml = `
      <h3>Recorded, but not traced today (${attestedCopies.length + nTomlUntraced})</h3>
      <div style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:8px">
        Copies and holdings recorded by the prior literature for which no live
        evidence exists today. Absence from the located list does not mean
        absence of a copy — these are the census&rsquo;s open leads.
      </div>
      <ul class="untraced">${copyItems}${tomlItems}</ul>`;
  }
  // The work itself, before the census statistics: full title (shown
  // nowhere else on the page — the topbar carries only the short title),
  // a short intro, and the proper collation from [work]. (No "Points" list —
  // issue-points belong in the copy records and the report, not the panel.)
  const work = DATA.meta.work || {};
  let workHtml = "";
  if (work.about) workHtml += `<div class="lede">${work.about}</div>`;
  if (work.collation) {
    workHtml += `<dl class="ov-bib"><dt>Collation</dt><dd>${work.collation}</dd></dl>`;
  }
  // Total-copies headline: the census's one clear count. The bold number is
  // the documented copy records; any untraced tier (attested/inferred copies,
  // plus [[untraced]] library holdings) is spelled out in the muted split.
  const nUntracedCopies = nAttested + nInferred;
  const splitBits = [];
  if (nUntracedCopies || nTomlUntraced) {
    if (nVerified) splitBits.push(`${nVerified} located`);
    if (nAttested) splitBits.push(`${nAttested} recorded, untraced`);
    if (nInferred) splitBits.push(`${nInferred} inferred`);
    if (nTomlUntraced) splitBits.push(`${nTomlUntraced} recorded ${nTomlUntraced === 1 ? "holding" : "holdings"} not yet traced`);
  }
  let countHtml = `<div class="ov-count"><span class="n">${DATA.meta.n}</span> ${DATA.meta.n === 1 ? "copy" : "copies"} censused`;
  if (splitBits.length) countHtml += `<span class="split">${splitBits.join(" · ")}</span>`;
  countHtml += `</div>`;

  // Reliability fold — the census MEASURES its verification state and
  // shows the reader, instead of stamping "census" and hoping.
  function reliabilityFold() {
    const s = DATA.meta.status || {};
    if (!s.channels_total && !s.sample) return "";
    const bits = [];
    if (s.channels_total) {
      bits.push(`<strong>Catalogue coverage.</strong> ${s.channels_swept} of ${s.channels_total} mandatory catalogue channels swept${(s.channels_total - s.channels_swept) ? ` — ${s.channels_total - s.channels_swept} still to reach` : ""}.`);
    }
    if (s.sample) {
      const rest = s.sample.n - s.sample.confirmed;
      bits.push(`<strong>Spot-check.</strong> ${s.sample.confirmed} of ${s.sample.n} randomly sampled verified copies re-confirmed at their stated location (${escapeHtml(s.sample.date || "")})${rest ? ` — the remaining ${rest} could not be machine-checked (none contradicted)` : ""}.`);
    }
    if (s.pending_candidates) {
      bits.push(`<strong>Under review.</strong> ${s.pending_candidates} candidate ${s.pending_candidates === 1 ? "sighting" : "sightings"} from the catalogue sweeps still await a verdict.`);
    }
    if (s.identity_pairs) {
      bits.push(`<strong>Identity questions.</strong> ${s.identity_pairs} ${s.identity_pairs === 1 ? "pair" : "pairs"} of records may describe the same physical copy and await adjudication.`);
    }
    if (!bits.length) return "";
    return `<details class="fold">
        <summary>Verification state — how settled this census is</summary>
        <div class="body">${bits.join("<br><br>")}</div>
      </details>`;
  }

  // Provisional banner — honest "not yet exhaustive" flag from the audit.
  const st = DATA.meta.status || {};
  let provBanner = "";
  if (st.provisional) {
    const bits = [];
    if (st.shortfall) bits.push(`${st.shortfall} known ${st.shortfall === 1 ? "copy" : "copies"} not yet located`);
    if ((st.unreached || []).length) bits.push(`catalogues not yet swept: ${st.unreached.map(escapeHtml).join(", ")}`);
    provBanner = `<div class="prov-banner"><strong>Provisional census — not yet exhaustive.</strong> ${bits.join(" · ")}. Further copies may exist.</div>`;
  }

  // Citation head: SURNAME, Given. / <i>Title.</i> / Place: Printer, Year.
  const citeImprint = [
    [DATA.meta.place, DATA.meta.printer].filter(Boolean).join(": "),
    DATA.meta.year,
  ].filter(Boolean).join(", ");
  document.getElementById("empty-state-hint").innerHTML = `
    <div class="overview">
      ${provBanner}
      <h2 class="cite-head">
        <span class="cite-author">${escapeHtml((DATA.meta.author_surname || "").toUpperCase())}, ${escapeHtml(DATA.meta.author_given || "")}.</span><br>
        <i>${escapeHtml(DATA.meta.title)}.</i><br>
        <span class="cite-imprint">${escapeHtml(citeImprint)}.</span>
      </h2>
      ${workHtml}
      ${countHtml}
      <h3>Where the located copies are</h3>
      <table class="ov-countries">${countryRows}</table>
      ${untracedHtml}
      <details class="fold">
        <summary>How securely each copy is attested</summary>
        <div class="body"><div class="ov-grades">${gradeLine}</div></div>
      </details>
      <details class="fold">
        <summary>Scope &amp; method — what this census counts</summary>
        <div class="body">
          <strong>In scope.</strong> ${escapeHtml(DATA.meta.scope_inclusion)}<br><br>
          <strong>Counted as a copy.</strong> ${escapeHtml(DATA.meta.counted_as_copy)}<br><br>
          <strong>Excluded.</strong> ${escapeHtml(DATA.meta.scope_excluded)}
        </div>
      </details>
      ${reliabilityFold()}
      <div class="permalink-hint">
        Share any copy with its permalink
        <code style="font-style:normal;background:#f0eee8;padding:1px 4px;border-radius:3px">?copy=&lt;slug&gt;</code>
        — links stay stable across census versions.
      </div>
      <div class="permalink-hint">
        Corrections and additions are welcome — a copy this census misses,
        a record it misstates:
        write to the editor.
      </div>
    </div>
  `;
  // The untraced strip's attested-copy links open the copy card.
  for (const a of document.querySelectorAll("[data-untraced-slug]")) {
    a.addEventListener("click", e => {
      e.preventDefault();
      setActive(a.dataset.untracedSlug);
    });
  }

  // Wire chips
  for (const chip of document.querySelectorAll(".chip[data-filter]")) {
    chip.addEventListener("click", () => {
      const f = chip.dataset.filter;
      const v = chip.dataset.val;
      if (v) {
        if (state.filters[f].has(v)) state.filters[f].delete(v);
        else state.filters[f].add(v);
      } else {
        state.filters[f] = !state.filters[f];
      }
      chip.classList.toggle("active");
      render();
    });
  }
  document.getElementById("cluster-clear").addEventListener("click", () => {
    state.filters.cluster = null;
    render();
  });

  // Standing COLLECTIONS chips — one per named cluster, so any grouping
  // (e.g. presentation copies) is one click from the top bar rather than
  // reachable only via a pill on a member's card.
  {
    const names = Object.keys(DATA.clusters || {});
    if (names.length) {
      document.getElementById("cluster-grouplabel").style.display = "";
      const box = document.getElementById("cluster-chips");
      for (const name of names) {
        const n = (DATA.clusters[name] || []).length;
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip cluster-filter-chip";
        chip.dataset.cluster = name;
        chip.textContent = `${name} (${n})`;
        chip.title = "Show only this collection";
        chip.addEventListener("click", () => {
          state.filters.cluster = (state.filters.cluster === name) ? null : name;
          render();
        });
        box.appendChild(chip);
      }
    }
  }
  document.getElementById("search-input").addEventListener("input", e => {
    state.filters.search = e.target.value.toLowerCase().trim();
    render();
  });

  // Keyboard nav
  document.addEventListener("keydown", e => {
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    if (e.key === "ArrowDown" || e.key === "j") { nav(1); e.preventDefault(); }
    if (e.key === "ArrowUp" || e.key === "k") { nav(-1); e.preventDefault(); }
    if (e.key === "Escape") { state.filters.cluster = null; render(); }
  });

  render();

  // ?copy=... deep link. Accepts the bare local slug OR the fully-qualified
  // copy reference (<census_key>/<copy_id>, or the hyphen-flattened
  // <census_key>-<copy_id>), so cross-census citations resolve here too.
  const params = new URLSearchParams(location.search);
  let requested = params.get("copy");
  if (requested) {
    if (requested.includes("/")) requested = requested.split("/").pop();
    else if (requested.startsWith(DATA.meta.key + "-")) requested = requested.slice(DATA.meta.key.length + 1);
    if (DATA.copies.some(c => c.slug === requested)) {
      setActive(requested);
    } else {
      // Stale / renamed permalink — say so rather than silently no-op.
      document.getElementById("card-container").innerHTML =
        `<div class="empty-state">
           <div>Copy <code>${escapeHtml(requested)}</code> is not in this census.</div>
           <div class="hint">The slug may have been renamed since this link was made.
           Pick a copy from the list or map.</div>
         </div>`;
    }
  }
}

function nav(delta) {
  const visible = orderCopies([...filteredCopies()]);
  if (!visible.length) return;
  let idx = visible.findIndex(c => c.slug === state.activeSlug);
  idx = (idx === -1) ? 0 : (idx + delta + visible.length) % visible.length;
  setActive(visible[idx].slug);
}

// ---------------------------------------------------------------------------
// Render: filter chips → map, list, count
// ---------------------------------------------------------------------------
function render() {
  const visible = orderCopies([...filteredCopies()]);
  const visibleSet = new Set(visible.map(c => c.slug));

  // Map visibility
  for (const [slug, m] of Object.entries(markersBySlug)) {
    if (visibleSet.has(slug)) {
      if (!map.hasLayer(m)) m.addTo(map);
    } else {
      if (map.hasLayer(m)) m.removeFrom(map);
    }
  }

  // Count
  document.getElementById("count-text").textContent =
    `${visible.length} of ${DATA.copies.length} copies visible`;

  // Cluster indicator
  const clusterIndicator = document.getElementById("cluster-clear");
  if (state.filters.cluster) {
    clusterIndicator.style.display = "inline-flex";
    document.getElementById("cluster-name").textContent = state.filters.cluster;
  } else {
    clusterIndicator.style.display = "none";
  }
  // Sync active state on the standing COLLECTIONS chips.
  for (const chip of document.querySelectorAll(".cluster-filter-chip")) {
    chip.classList.toggle("active", state.filters.cluster === chip.dataset.cluster);
  }

  // List
  const list = document.getElementById("copy-list");
  list.innerHTML = "";
  if (!visible.length) {
    list.innerHTML = '<li class="empty">No copies match these filters. Try toggling a confidence band.</li>';
    return;
  }
  // Attested copies (recorded historically, no live evidence) never sit
  // under a country header — a header would assert a present-day location.
  // They close the list under their own honest heading in place mode.
  const located = visible.filter(c => c.status !== "attested");
  const attestedRows = visible.filter(c => c.status === "attested");

  const appendRow = (c) => {
    const li = document.createElement("li");
    li.className = `list-item status-${c.status}` + (c.slug === state.activeSlug ? " active" : "");
    li.dataset.slug = c.slug;
    const indicators = [];
    if (c.has_surrogate || c.has_iiif) indicators.push('<span class="tag" title="A digital facsimile of this copy can be read online">digitised</span>');
    if (c.status !== "extant") {
      const stLabel = c.status === "attested" ? "untraced" : statusLabel(c.status);
      indicators.push(`<span class="tag st">${escapeHtml(stLabel)}</span>`);
    }
    const cityLine = c.status === "attested"
      ? `last recorded ${escapeHtml(c.city || "—")}${c.country ? " · " + escapeHtml(countryName(c.country)) : ""}`
      : `${escapeHtml(c.city || "—")}${c.country ? " · " + escapeHtml(countryName(c.country)) : ""}`;
    li.innerHTML = `
      <span class="label-block">
        <span class="title">${escapeHtml(c.display_label)}</span>
        <span class="city">${cityLine}</span>
        ${c.assoc_note ? `<span class="assoc">${escapeHtml(c.assoc_note)}</span>` : ""}
      </span>
      <span class="indicators">${indicators.join("")}</span>
    `;
    li.addEventListener("click", () => setActive(c.slug));
    list.appendChild(li);
  };

  let lastCountry = null;
  for (const c of located) {
    if (c.country !== lastCountry) {
      lastCountry = c.country;
      const n = located.filter(v => v.country === c.country).length;
      const head = document.createElement("li");
      head.className = "country-head";
      head.innerHTML = `${flagIco(c.country)}${escapeHtml(countryName(c.country))}<span class="n">· ${n}</span>`;
      list.appendChild(head);
    }
    appendRow(c);
  }
  if (attestedRows.length) {
    const head = document.createElement("li");
    head.className = "country-head";
    head.innerHTML = `Recorded, not located today<span class="n">· ${attestedRows.length}</span>`;
    list.appendChild(head);
    for (const c of attestedRows) appendRow(c);
  }
}

// ---------------------------------------------------------------------------
// Active copy
// ---------------------------------------------------------------------------
function setActive(slug) {
  const copy = DATA.copies.find(c => c.slug === slug);
  if (!copy) return;
  state.activeSlug = slug;

  // Update URL ?copy= without reload
  const u = new URL(location);
  u.searchParams.set("copy", slug);
  history.replaceState(null, "", u);

  // Update list active state
  for (const li of document.querySelectorAll(".list-item")) {
    li.classList.remove("active");
  }
  // Match by slug, not display text — copies can share a display_label.
  const currentLi = document.querySelector(
    `.list-item[data-slug="${CSS.escape(slug)}"]`);
  if (currentLi) {
    currentLi.classList.add("active");
    currentLi.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  // Update map: highlight + fly
  for (const [s, m] of Object.entries(markersBySlug)) {
    const el = m._icon;
    if (el) el.classList.toggle("active", s === slug);
  }
  const marker = markersBySlug[slug];
  if (marker) {
    autoView = false;   // the user picked a copy; stop auto-refitting on resize
    map.flyTo(marker.getLatLng(), Math.max(map.getZoom(), 5), { duration: 0.6 });
  }

  // Render card
  renderCard(copy);

  // On the stacked narrow layout the card renders BELOW the map and the
  // full copy list, so a tap would otherwise appear to do nothing. Bring
  // it into view. Desktop keeps its side-by-side panes and needs no scroll.
  if (window.matchMedia("(max-width: 860px)").matches) {
    const card = document.getElementById("card-container");
    if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

// ---------------------------------------------------------------------------
// Card rendering
// ---------------------------------------------------------------------------
function renderCard(c) {
  const container = document.getElementById("card-container");
  const visible = orderCopies([...filteredCopies()]);
  const idx = visible.findIndex(x => x.slug === c.slug);
  const prev = (idx > 0) ? visible[idx - 1] : null;
  const next = (idx >= 0 && idx < visible.length - 1) ? visible[idx + 1] : null;

  // Actions
  const actions = [];
  if (c.catalogue_url) {
    actions.push(`<a href="${escapeHtml(c.catalogue_url)}" target="_blank" rel="noopener">
      Catalogue <span class="ico">↗</span></a>`);
  }
  for (const s of (c.digital_surrogates || [])) {
    if (s.url && s.kind !== "absent" && s.kind !== "needs_lookup") {
      const label = s.kind === "iiif-manifest"
        ? "IIIF manifest"
        : (s.label || s.kind);
      actions.push(`<a class="primary" href="${escapeHtml(s.url)}" target="_blank" rel="noopener">
        ${escapeHtml(label)} <span class="ico">↗</span></a>`);
    }
  }

  // Copy images (base64-embedded; click to open lightbox)
  let imagesHtml = "";
  if ((c.images || []).length) {
    const figs = c.images.map((im, i) => {
      const cap = im.caption ? escapeHtml(im.caption) : "";
      return `<figure class="copy-image-fig" data-img-idx="${i}">
        <img src="${im.data_uri}" alt="${cap}" loading="lazy">
        ${cap ? `<figcaption>${cap}</figcaption>` : ""}
      </figure>`;
    }).join("");
    imagesHtml = `<section><h3>Images (${c.images.length})</h3>
      <div class="copy-images-grid">${figs}</div></section>`;
  }

  // Clusters
  let clustersHtml = "";
  if ((c.clusters || []).length) {
    clustersHtml = `<section><h3>Provenance clusters</h3>
      ${c.clusters.map(cl => `<span class="cluster-pill" data-cluster="${escapeHtml(cl)}">${escapeHtml(cl)}</span>`).join("")}
    </section>`;
  }

  // Provenance
  let provHtml = "";
  if ((c.provenance_chain || []).length) {
    const items = c.provenance_chain.map(p => {
      const kindClass = p.kind ? `kind-${p.kind}` : "";
      return `
        <li class="${kindClass}">
          <div class="owner">${escapeHtml(p.owner || p.event || "—")}</div>
          <div class="meta-line">
            ${p.kind ? `<span class="kind-tag">${escapeHtml(p.kind)}</span>` : ""}
            ${p.date ? escapeHtml(p.date) : "(undated)"}
            ${p.confidence ? ` · confidence ${escapeHtml(p.confidence)}` : ""}
          </div>
          ${p.evidence ? `<div class="evidence">${escapeHtml(p.evidence)}</div>` : ""}
        </li>`;
    }).join("");
    provHtml = `<section><h3>Provenance chain</h3><ul class="provenance">${items}</ul></section>`;
  }

  // Physical
  let physHtml = "";
  const ph = c.physical || {};
  const physRows = [];
  if (ph.completeness) physRows.push(["Completeness", escapeHtml(ph.completeness)]);
  if (ph.binding) {
    const b = ph.binding;
    // A store value of "unknown" (binding period or originality not yet
    // determined) is a data placeholder, not a fact worth printing — showing
    // the bare word beside the style reads as a cryptic label ("broadsheet,
    // as issued · unknown"). Render only the determined values.
    const bits = [b.style, b.period, b.originality]
      .filter(v => v && String(v).toLowerCase() !== "unknown")
      .map(escapeHtml).join(" · ");
    let v = bits;
    if (b.notes) v += `<span class="meta-note">${escapeHtml(b.notes)}</span>`;
    physRows.push(["Binding", v]);
  }
  if (ph.marginalia) {
    const m = ph.marginalia;
    const bits = [];
    if (m.density) bits.push(escapeHtml(m.density));
    if (m.hands_count) bits.push(`${m.hands_count} hand(s)`);
    if (m.character) bits.push(escapeHtml(m.character));
    let v = bits.join(" · ");
    if (m.hands_identified && m.hands_identified.length) {
      v += `<span class="meta-note">Identified: ${m.hands_identified.map(escapeHtml).join("; ")}</span>`;
    }
    physRows.push(["Marginalia", v]);
  }
  if (ph.notes) physRows.push(["Notes", escapeHtml(ph.notes)]);
  if (physRows.length) {
    physHtml = `<section><h3>Physical</h3>
      <dl class="physical-grid">
        ${physRows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}
      </dl></section>`;
  }

  // Surrogates
  let surrHtml = "";
  if ((c.digital_surrogates || []).length) {
    const rows = c.digital_surrogates.map(s => {
      let main;
      if (s.url) {
        const link = `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.host || s.label || s.url)}</a>`;
        main = link;
      } else {
        main = `<span style="color:var(--muted)">${escapeHtml(s.label || "(no URL captured)")}</span>`;
      }
      const note = s.notes ? `<div class="notes">${escapeHtml(s.notes)}</div>` : "";
      return `<div class="surrogate-row kind-${s.kind}">
        <span class="kind-tag">${escapeHtml(s.kind)}</span>
        ${main}
        ${note}
      </div>`;
    }).join("");
    surrHtml = `<section><h3>Digital surrogates</h3>${rows}</section>`;
  }

  // References
  let refsHtml = "";
  if ((c.references || []).length) {
    const items = c.references.map(r => {
      const parts = [];
      if (r.name) parts.push(`<span class="ref-name">${escapeHtml(r.name)}</span>`);
      if (r.entry) parts.push(escapeHtml(r.entry));
      if (r.canon) parts.push(`canon ${escapeHtml(r.canon)}`);
      if (r.number) parts.push(escapeHtml(r.number));
      const refText = r.ref ? escapeHtml(r.ref) : "";
      const refTruncated = refText.length > 320;
      return `<li>
        <span class="ref-kind">${escapeHtml(r.kind || "ref")}</span>
        ${parts.join(", ")}
        ${refText ? (refTruncated ? `<span class="ref-text" data-full="${refText.replace(/"/g, "&quot;")}">: ${refText.slice(0, 320)}<span class="ref-truncated" onclick="this.parentElement.innerHTML=':' + this.parentElement.dataset.full;"> …(more)</span></span>` : `<span class="ref-text">: ${refText}</span>`) : ""}
      </li>`;
    }).join("");
    refsHtml = `<section><h3>References (${c.references.length})</h3><ul class="references">${items}</ul></section>`;
  }

  // Confidence history
  let confHistHtml = "";
  if ((c.confidence_history || []).length) {
    const items = c.confidence_history.map(h =>
      `<div><strong>${escapeHtml(h.from)}<span class="arrow">→</span>${escapeHtml(h.to)}</strong> · ${escapeHtml(h.date)}<br><span style="font-size:11px;color:var(--muted)">${escapeHtml(h.reason)}</span></div>`
    ).join("<hr style='border:none;border-top:1px solid var(--rule);margin:8px 0'>");
    confHistHtml = `<section><h3>Confidence-grade history</h3><div class="conf-history">${items}</div></section>`;
  }

  // Verification history — dated positive AND negative checks. For an
  // attested (untraced) copy this section IS the justification: it shows
  // what was searched, when, and what was not found.
  let checksHtml = "";
  if ((c.checks || []).length || (c.evidence || {}).method) {
    const evLine = (c.evidence || {}).method
      ? `<div style="font-size:12px;margin-bottom:8px"><strong>Strongest evidence:</strong> ${escapeHtml(c.evidence.method)}${c.evidence.last_verified ? ` · last verified ${escapeHtml(c.evidence.last_verified)}` : ""}${c.evidence.ref ? `<br><span style="color:var(--muted);font-size:11px">${escapeHtml(c.evidence.ref)}</span>` : ""}</div>`
      : "";
    const rows = (c.checks || []).map(ch => {
      const mark = ch.result === "found" ? "✓" : ch.result === "not-found" ? "✗" : "?";
      const color = ch.result === "found" ? "var(--grade-A)" : ch.result === "not-found" ? "var(--grade-D)" : "var(--muted)";
      return `<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--rule)">
        <span style="color:${color};font-weight:700">${mark}</span>
        ${escapeHtml(ch.date)} · ${escapeHtml(ch.channel)} — <strong>${escapeHtml(ch.result)}</strong>
        ${ch.note ? `<br><span style="color:var(--muted);font-size:11px">${escapeHtml(ch.note)}</span>` : ""}
      </div>`;
    }).join("");
    checksHtml = `<section><h3>Verification history</h3>${evLine}${rows}</section>`;
  }

  // Open questions
  let questHtml = "";
  if ((c.open_questions || []).length) {
    const items = c.open_questions.map(q => `<li>${escapeHtml(q)}</li>`).join("");
    questHtml = `<section><h3>Open questions</h3><ul class="open-questions">${items}</ul></section>`;
  }

  // Citation hint.
  // Canonical citable identifier = fully-qualified copy reference
  // (<census_key>/<copy_id>), from which author · title · year · holding · copy
  // can all be read. The bare slug stays the short, stable, local id.
  const url = location.origin + location.pathname + "?copy=" + encodeURIComponent(c.slug);
  const fqid = DATA.meta.key + "/" + c.slug;
  const humanLabel = `${DATA.meta.author}, ${DATA.meta.title_short} (${DATA.meta.year || "n.d."}) — ${c.display_label}`;
  const codeStyle = "background:#f0eee8;padding:1px 5px;border-radius:3px";
  // Ready-to-paste citation (Darwin/e-rara pattern): record + corpus + build + permalink + accessed date
  const accDate = new Date().toISOString().slice(0, 10);
  const citeText = "“" + humanLabel + "”, Tychoniana — Census "
    + DATA.meta.key + " (build " + (DATA.meta.last_built || "") + "), " + url
    + ", accessed " + accDate + ".";
  const citationHtml = `<section><h3>Citation</h3>
    <div style="font-size:12px;line-height:1.6">
      <strong>Reference:</strong> ${escapeHtml(humanLabel)}<br>
      <strong>Full ID:</strong> <code style="${codeStyle}">${escapeHtml(fqid)}</code><br>
      <strong>Local slug:</strong> <code style="${codeStyle}">${escapeHtml(c.slug)}</code><br>
      <strong>Permalink:</strong>
      <a href="${escapeHtml(url)}" style="color:var(--accent);font-size:11px;word-break:break-all">${escapeHtml(url)}</a><br>
      <strong>Cite:</strong> <span class="cite-line">${escapeHtml(citeText)}</span>
      <button class="cite-copy" style="font-size:10px;margin-left:6px;padding:1px 7px;border:1px solid var(--border);border-radius:3px;background:#f0eee8;cursor:pointer"
        onclick="try{navigator.clipboard.writeText(this.previousElementSibling.textContent);this.textContent='copied';}catch(e){}">copy</button>
    </div>
  </section>`;

  container.innerHTML = `
    <div class="copy-card">
      <div class="nav-row">
        <button ${prev ? "" : "disabled"} onclick="${prev ? `setActive('${prev.slug}')` : ''}">
          ← ${prev ? escapeHtml(truncate(prev.display_label, 32)) : "(start)"}
        </button>
        <span class="keyboard-hint">↑ ↓ to navigate</span>
        <button ${next ? "" : "disabled"} onclick="${next ? `setActive('${next.slug}')` : ''}">
          ${next ? escapeHtml(truncate(next.display_label, 32)) : "(end)"} →
        </button>
      </div>
      <div class="header-row">
        <h2>${escapeHtml(c.display_label)}</h2>
        <div class="status-row">
          <span class="status-pill status-${c.status}">${escapeHtml(statusLabel(c.status))}</span>
          <span class="grade-badge ${c.confidence} tooltip-host" data-tooltip="${
            ({ A: 'Verified: examined first-hand, confirmed by a live institutional record, or anchored by a documented dated dispatch',
               B: 'Documented: recorded by a named scholar or an institutional catalogue, but not independently examined',
               C: 'Reported: attested in a source that has not been re-verified',
               D: 'Contested: rumoured, or the evidence conflicts' })[c.confidence] || ''
          }">${escapeHtml(c.confidence)}</span>
        </div>
      </div>
      <div class="subtitle">
        <strong>${escapeHtml(c.institution)}</strong>
        ${c.shelfmark ? `<br>${escapeHtml(c.shelfmark)}` : ""}
        ${c.city ? ` · ${escapeHtml(c.city)}` : ""}${c.country ? `, ${escapeHtml(c.country)}` : ""}
        ${c.siglum ? `<br><span style="font-size:11px;color:var(--muted)">${escapeHtml(c.siglum)}</span>` : ""}
      </div>
      <div class="actions">${actions.join("")}</div>
      ${imagesHtml}
      ${clustersHtml}
      ${provHtml}
      ${physHtml}
      ${surrHtml}
      ${refsHtml}
      ${confHistHtml}
      ${checksHtml}
      ${questHtml}
      ${citationHtml}
    </div>
  `;

  // Wire cluster pills
  for (const pill of container.querySelectorAll(".cluster-pill")) {
    pill.addEventListener("click", () => {
      state.filters.cluster = pill.dataset.cluster;
      render();
    });
  }

  // Wire image thumbnails → lightbox
  for (const fig of container.querySelectorAll(".copy-image-fig")) {
    fig.addEventListener("click", () => {
      const im = c.images[Number(fig.dataset.imgIdx)];
      if (!im) return;
      const lb = document.getElementById("lightbox");
      document.getElementById("lightbox-img").src = im.data_uri;
      document.getElementById("lightbox-caption").innerHTML =
        (im.caption ? escapeHtml(im.caption) : "") +
        (im.source ? `<br><span class="lb-source">${escapeHtml(im.source)}</span>` : "");
      lb.classList.add("open");
      lb.setAttribute("aria-hidden", "false");
    });
  }
}

// Lightbox dismissal (click anywhere / Escape)
(function wireLightbox() {
  const lb = document.getElementById("lightbox");
  if (!lb) return;
  const close = () => { lb.classList.remove("open"); lb.setAttribute("aria-hidden", "true"); };
  lb.addEventListener("click", close);
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
})();

window.setActive = setActive;
init();
</script>
