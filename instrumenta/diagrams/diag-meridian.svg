<svg viewBox="0 0 320 215" font-family="Georgia,serif" font-size="11" fill="#1a2238" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="215" fill="#f8f4ec"/>

  <!-- Title -->
  <text x="160" y="16" font-size="11.5" fill="#1a2238" font-weight="bold" text-anchor="middle">The meridian — transit method</text>

  <!-- Layout: celestial sphere side view (circle); meridian arc N-Z-S.
       Observer at centre O=(155,125). Sphere radius 80.
       Horizon: horizontal line through O.
       Meridian: vertical great circle through N, Z (zenith), S.
       North pole P above O at altitude = latitude φ = 55.9° above N horizon.

       In the diagram:
       - Sphere: cx=155, cy=125, r=80
       - Horizon line: y=125 (horizontal through O)
       - Zenith Z: (155, 45) — top
       - Nadir: (155, 205) — bottom
       - North horizon N: (75, 125)
       - South horizon S: (235, 125)
       - North pole P: altitude φ above N horizon = 55.9° above horizontal on the N side
         P = (155 - 80·cos55.9°, 125 - 80·sin55.9°) = (155-44.9, 125-66.3) = (110, 59)
         Wait: P is on the meridian circle, at latitude φ from N horizon going toward zenith.
         From N (75,125) along the arc 55.9°: P is at angle 55.9° from horizontal (measuring from N).
         But P is on the sphere at altitude φ. Let's just place it on the circle.
         The circle has centre 155,125 radius 80.
         N is at angle 180° from centre: (75,125).
         Z (zenith) is at angle 90° up: (155,45).
         P is 55.9° from zenith toward N:
           angle from top = 90° - 55.9° = 34.1° toward N (left).
           In SVG: angle from positive-x, going CCW = 90°+34.1° = 124.1° from positive-x CCW
           But SVG y is flipped. Let's use: from positive-x CW (standard SVG):
           Z is at 270° (straight up in SVG = -y direction) = 90° in math coordinates.
           P is at 90° + 34.1° = 124.1° in math = 360°-124.1° = 235.9° in SVG convention (CW from +x).
           Or simpler: P is at 55.9° altitude on N side.
           Px = 155 - 80·cos(55.9°) = 155-44.9 = 110.1 ≈ 110
           Py = 125 - 80·sin(55.9°) = 125-66.3 = 58.7 ≈ 59
  -->

  <!-- Celestial sphere outline -->
  <circle cx="155" cy="125" r="80" fill="none" stroke="#c0c8d0" stroke-width="1"/>

  <!-- Horizon line (heavy) -->
  <line x1="75" y1="125" x2="235" y2="125" stroke="#1a2238" stroke-width="2"/>
  <text x="68" y="129" font-size="9.5" fill="#3a3028" text-anchor="end">N</text>
  <text x="242" y="129" font-size="9.5" fill="#3a3028">S</text>

  <!-- Meridian arc (N through Z to S, half-circle in this view — the upper half) -->
  <path d="M 75,125 A 80,80 0 0,1 235,125" fill="none" stroke="#1a2238" stroke-width="2"/>

  <!-- Zenith Z -->
  <circle cx="155" cy="45" r="3" fill="#1a2238"/>
  <text x="163" y="44" font-size="9.5" fill="#3a3028">Z (zenith)</text>

  <!-- North pole P on meridian arc -->
  <circle cx="110" cy="59" r="5" fill="#9a7b32"/>
  <text x="97" y="53" font-size="9.5" fill="#9a7b32" text-anchor="end">N. Pole</text>
  <text x="97" y="64" font-size="9.5" fill="#9a7b32" text-anchor="end">P</text>

  <!-- Latitude angle φ at N horizon from horizontal to P -->
  <path d="M 101,125 A 26,26 0 0,1 88,103" fill="none" stroke="#8090a0" stroke-width="1.3"/>
  <text x="80" y="100" font-size="10" fill="#6070a0" font-style="italic">φ</text>
  <text x="68" y="148" font-size="9" fill="#6070a0" text-anchor="middle">(latitude)</text>

  <!-- Star on meridian at transit — at declination δ=25°N above equator
       On the S upper meridian:
       δ=25° above equator → altitude = 90° - φ + δ = 90°-55.9+25 = 59.1°
       Star on meridian at altitude 59.1°:
       angle from S horizon = 59.1°; from S (235,125) going up along meridian arc:
       The arc from S to Z spans 90°. Star at 59.1°:
         Sx = 155 + 80·cos(59.1°) = 155+41.1 = 196.1 ≈ 196
         Sy = 125 - 80·sin(59.1°) = 125-68.7 = 56.3 ≈ 56
  -->
  <text x="196" y="52" font-size="15" fill="#9a7b32" text-anchor="middle">★</text>
  <text x="213" y="50" font-size="9.5" fill="#9a7b32">Star transit</text>

  <!-- Altitude arc at S from horizon to star -->
  <path d="M 221,125 A 26,26 0 0,0 207,107" fill="none" stroke="#9a7b32" stroke-width="1.8"/>
  <text x="232" y="108" font-size="11" fill="#9a7b32" font-style="italic">h</text>

  <!-- Equator intersection with meridian: at altitude 90°-φ = 34.1° in south
       Eq: (155+80·cos34.1°, 125-80·sin34.1°) = (155+66.2, 125-44.9) = (221, 80)
       That's too close to the star. Let me use the equator point differently.
       The celestial equator crosses the S meridian at altitude 90°-55.9=34.1°
       Eq_S = (155 + 80·sin34.1°, 125-80·cos34.1°) — wait no.
       Meridian points at altitude a in south: x = 155+80·cos(a), y = 125-80·sin(a)
       At a=0: S=(235,125). At a=90: Z=(155,45). At a=34.1°: (155+80·cos34.1°,125-80·sin34.1°)=(155+66.2,125-44.9)=(221,80).
  -->
  <!-- Equator crossing on S meridian at (221,80) -->
  <circle cx="221" cy="80" r="3" fill="#8090a0"/>
  <text x="232" y="83" font-size="9" fill="#6070a0">Equator</text>
  <text x="232" y="93" font-size="9" fill="#6070a0">(0° δ)</text>

  <!-- Declination arc from equator crossing to star -->
  <path d="M 221,80 A 25,25 0 0,0 200,56" fill="none" stroke="#9a7b32" stroke-width="1.3" stroke-dasharray="4,2"/>
  <text x="232" y="68" font-size="10" fill="#9a7b32" font-style="italic">δ</text>

  <!-- Formula box -->
  <rect x="12" y="150" width="130" height="44" fill="#f8f4ec" stroke="#9a7b32" stroke-width="1" rx="3"/>
  <text x="77" y="167" font-size="10" fill="#3a3028" text-anchor="middle">At transit (upper):</text>
  <text x="77" y="182" font-size="11" fill="#9a7b32" font-style="italic" text-anchor="middle">h = 90° &#x2212; &#x3c6; + &#x3b4;</text>

  <!-- Caption -->
  <text x="160" y="209" font-size="10.5" fill="#5a4e40" text-anchor="middle" font-style="italic">Star at meridian = maximum altitude &#x2014; read h, derive &#x3b4;; no azimuth ambiguity</text>
</svg>
