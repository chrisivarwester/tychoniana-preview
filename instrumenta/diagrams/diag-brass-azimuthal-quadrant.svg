<svg viewBox="0 0 320 215" font-family="Georgia,serif" font-size="11" fill="#1a2238" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="215" fill="#f8f4ec"/>

  <!-- Title -->
  <text x="160" y="16" font-size="11.5" fill="#1a2238" font-weight="bold" text-anchor="middle">The azimuthal quadrant</text>

  <!-- Layout:
       Azimuth ring (horizontal circle) viewed from above as ellipse: cx=160, cy=155, rx=90, ry=28
       Quadrant arm rises from the azimuth ring — shown as a quadrant arc in the vertical plane
       Quadrant centre Q=(160,155); radius 80; arm at 50° altitude
       Arc from 0° (horizontal = (240,155)) to 90° (vertical = (160,75))
       Star at ~50° altitude: (160+80·cos50°, 155−80·sin50°) = (211,94) but along arc

       Altitude arc: from H=(240,155) to Z=(160,75), arc through the quadrant
       At 50°: (160+80·cos40°, 155−80·sin40°) = (221, 104) — actually measuring from horizontal
       The alidade points at 50° above H→Z:
         arc point = (160+80·cos(90°-50°), 155-80·sin(90°-50°)) = (160+80·sin50°, 155-80·cos50°)
                   = (160+61.3, 155-51.4) = (221, 104)
  -->

  <!-- Azimuth ring (horizontal, seen in perspective as ellipse) -->
  <ellipse cx="160" cy="155" rx="90" ry="28" fill="none" stroke="#1a2238" stroke-width="2"/>

  <!-- Azimuth pointer / current bearing direction (line across ellipse at some azimuth) -->
  <!-- Bearing shown at ~40° from N; North label at top of ellipse, N=(160,127) -->
  <line x1="160" y1="127" x2="160" y2="183" stroke="#8090a0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="160" y="121" font-size="9" fill="#6070a0" text-anchor="middle">N</text>
  <text x="160" y="195" font-size="9" fill="#6070a0" text-anchor="middle">S</text>
  <text x="68" y="159" font-size="9" fill="#6070a0" text-anchor="middle">W</text>
  <text x="252" y="159" font-size="9" fill="#6070a0" text-anchor="middle">E</text>

  <!-- Azimuth arc label -->
  <path d="M 160,127 A 28,28 0 0,1 176,129" fill="none" stroke="#9a7b32" stroke-width="1.5"/>
  <text x="182" y="124" font-size="10" fill="#9a7b32" font-style="italic">Az</text>

  <!-- Vertical quadrant arm rising from ring -->
  <!-- Quadrant arc from H=(240,155) to Z=(160,75) in the vertical plane (front face) -->
  <path d="M 240,155 A 80,80 0 0,0 160,75" fill="none" stroke="#1a2238" stroke-width="2.2"/>

  <!-- Pivot at Q (where quadrant meets azimuth ring) -->
  <circle cx="240" cy="155" r="4" fill="#8090a0"/>

  <!-- Zenith label -->
  <text x="155" y="70" font-size="9" fill="#6070a0" text-anchor="end">Zenith</text>
  <line x1="157" y1="72" x2="160" y2="75" stroke="#6070a0" stroke-width="0.8"/>

  <!-- Horizon label -->
  <text x="248" y="151" font-size="9" fill="#6070a0">Hz</text>

  <!-- Alidade on quadrant at 50° altitude -->
  <!-- At altitude 50°: arc position = (160+80·sin50°, 155-80·cos50°) = (221.3, 103.6) ≈ (221,104) -->
  <line x1="240" y1="155" x2="221" y2="104" stroke="#9a7b32" stroke-width="2"/>
  <circle cx="221" cy="104" r="5" fill="#9a7b32"/>

  <!-- Altitude angle arc at H -->
  <path d="M 222,155 A 22,22 0 0,0 230,133" fill="none" stroke="#9a7b32" stroke-width="1.5"/>
  <text x="248" y="138" font-size="11" fill="#9a7b32" font-style="italic">h</text>
  <text x="250" y="150" font-size="9" fill="#3a3028">(altitude)</text>

  <!-- Star near alidade end -->
  <text x="212" y="94" font-size="14" fill="#9a7b32" text-anchor="middle">★</text>

  <!-- Two-coordinate callout -->
  <rect x="18" y="70" width="110" height="52" fill="#f8f4ec" stroke="#9a7b32" stroke-width="1" rx="3"/>
  <text x="73" y="87" font-size="10" fill="#3a3028" text-anchor="middle" font-weight="bold">Two coordinates</text>
  <text x="73" y="101" font-size="10" fill="#9a7b32" text-anchor="middle">Altitude <tspan font-style="italic">h</tspan> on arc</text>
  <text x="73" y="115" font-size="10" fill="#9a7b32" text-anchor="middle">Azimuth <tspan font-style="italic">Az</tspan> on ring</text>

  <!-- Caption -->
  <text x="160" y="209" font-size="10.5" fill="#5a4e40" text-anchor="middle" font-style="italic">Quadrant reads altitude; whole instrument rotates on azimuth ring for bearing</text>
</svg>
