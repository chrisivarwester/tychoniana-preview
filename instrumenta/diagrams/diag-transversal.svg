<svg viewBox="0 0 320 215" font-family="Georgia,serif" font-size="11" fill="#1a2238" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="215" fill="#f8f4ec"/>

  <!-- Title -->
  <text x="160" y="20" font-size="12" fill="#1a2238" font-weight="bold" text-anchor="middle">The diagonal (transversal) scale</text>

  <!-- Layout:
       Two main graduation lines (vertical) at x=55 (0') and x=265 (10')
       11 counting lines (horizontal), one per arcminute:
         y[i] = 168 − i·14.3  for i=0..10  →  168, 154, 139, 125, 111, 97, 82, 68, 54, 40, 25
         labeled 0', 1', ..., 10' (bottom to top)
       One diagonal: from (55,168) [bottom-left, 0'] to (265,25) [top-right, 10']
       Thread at x=160 → diagonal y = 168 − 143·(105/210) = 168 − 71.5 = 96.5 ≈ 97 = 5' row ✓
  -->

  <!-- Counting lines (horizontal, light grey) -->
  <g stroke="#b0bbd0" stroke-width="0.8">
    <line x1="46" y1="168" x2="274" y2="168"/>  <!-- 0'  -->
    <line x1="46" y1="154" x2="274" y2="154"/>  <!-- 1'  -->
    <line x1="46" y1="139" x2="274" y2="139"/>  <!-- 2'  -->
    <line x1="46" y1="125" x2="274" y2="125"/>  <!-- 3'  -->
    <line x1="46" y1="111" x2="274" y2="111"/>  <!-- 4'  -->
    <line x1="46" y1="97"  x2="274" y2="97"/>   <!-- 5'  (thread crossing) -->
    <line x1="46" y1="82"  x2="274" y2="82"/>   <!-- 6'  -->
    <line x1="46" y1="68"  x2="274" y2="68"/>   <!-- 7'  -->
    <line x1="46" y1="54"  x2="274" y2="54"/>   <!-- 8'  -->
    <line x1="46" y1="40"  x2="274" y2="40"/>   <!-- 9'  -->
    <line x1="46" y1="25"  x2="274" y2="25"/>   <!-- 10' -->
  </g>

  <!-- Main graduation lines (vertical, solid) -->
  <line x1="55" y1="19" x2="55" y2="175" stroke="#1a2238" stroke-width="2"/>
  <line x1="265" y1="19" x2="265" y2="175" stroke="#1a2238" stroke-width="2"/>

  <!-- Labels on counting lines (right side) — every other to avoid crowding -->
  <text x="275" y="172" font-size="10" fill="#3a3028">0&#x2032;</text>
  <text x="275" y="143" font-size="10" fill="#3a3028">2&#x2032;</text>
  <text x="275" y="115" font-size="10" fill="#3a3028">4&#x2032;</text>
  <text x="275" y="101" font-size="10" fill="#9a7b32" font-weight="bold">5&#x2032;</text>
  <text x="275" y="86"  font-size="10" fill="#3a3028">6&#x2032;</text>
  <text x="275" y="57"  font-size="10" fill="#3a3028">8&#x2032;</text>
  <text x="275" y="29"  font-size="10" fill="#3a3028">10&#x2032;</text>

  <!-- Main scale labels at bottom -->
  <text x="55"  y="188" font-size="10" fill="#3a3028" text-anchor="middle">0&#x2032;</text>
  <text x="265" y="188" font-size="10" fill="#3a3028" text-anchor="middle">10&#x2032;</text>
  <text x="160" y="188" font-size="10" fill="#3a3028" text-anchor="middle" font-style="italic">(one column = 10&#x2032;)</text>

  <!-- The diagonal transversal (gold) -->
  <line x1="55" y1="168" x2="265" y2="25" stroke="#9a7b32" stroke-width="2"/>

  <!-- Indicator thread (dashed vertical) -->
  <line x1="160" y1="19" x2="160" y2="175" stroke="#1a2238" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="155" y="200" font-size="10" fill="#3a3028" text-anchor="middle">Plumb-thread</text>

  <!-- Intersection point at (160, 97) = 5' row -->
  <circle cx="160" cy="97" r="5" fill="#9a7b32"/>

  <!-- Reading callout -->
  <line x1="215" y1="88" x2="168" y2="94" stroke="#9a7b32" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="222" y="85" font-size="11" fill="#9a7b32" font-weight="bold" text-anchor="start">Thread at 5&#x2032;</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9a7b32"/>
    </marker>
  </defs>

  <!-- Caption -->
  <text x="160" y="210" font-size="10.5" fill="#5a4e40" text-anchor="middle" font-style="italic">One diagonal divides 10&#x2032; into 10 rows (1&#x2032; each) &#x2014; read arcminutes directly</text>
</svg>
