<svg viewBox="0 0 320 215" font-family="Georgia,serif" font-size="11" fill="#1a2238" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="215" fill="#f8f4ec"/>

  <!-- Title -->
  <text x="160" y="16" font-size="11.5" fill="#1a2238" font-weight="bold" text-anchor="middle">The cross-staff (radius astronomicus)</text>

  <!-- Main staff: horizontal, eye at left end
       Staff from (30,115) to (290,115)
       Eye at (30,115); crosspiece at x=190, half-height=32 → tips at (190,83) and (190,147) -->

  <!-- Staff -->
  <line x1="30" y1="115" x2="290" y2="115" stroke="#1a2238" stroke-width="3"/>

  <!-- Crosspiece (slides along staff) -->
  <line x1="190" y1="78" x2="190" y2="152" stroke="#9a7b32" stroke-width="3"/>

  <!-- Crosspiece bracket (shows it slides) -->
  <rect x="185" y="110" width="10" height="10" fill="#9a7b32" opacity="0.4"/>

  <!-- Eye at left end -->
  <ellipse cx="30" cy="115" rx="8" ry="6" fill="#f8f4ec" stroke="#1a2238" stroke-width="1.5"/>
  <circle cx="30" cy="115" r="3" fill="#1a2238"/>
  <text x="30" y="132" font-size="9.5" fill="#3a3028" text-anchor="middle">Eye</text>

  <!-- Star A at top of crosspiece -->
  <text x="190" y="72" font-size="15" fill="#9a7b32" text-anchor="middle">★</text>
  <text x="190" y="64" font-size="9" fill="#9a7b32" text-anchor="middle">Star A</text>

  <!-- Star B at bottom of crosspiece -->
  <text x="190" y="167" font-size="15" fill="#9a7b32" text-anchor="middle">★</text>
  <text x="190" y="180" font-size="9" fill="#9a7b32" text-anchor="middle">Star B</text>

  <!-- Sight lines from eye to star tips -->
  <line x1="30" y1="115" x2="190" y2="78" stroke="#9a7b32" stroke-width="1.2" stroke-dasharray="5,3"/>
  <line x1="30" y1="115" x2="190" y2="152" stroke="#9a7b32" stroke-width="1.2" stroke-dasharray="5,3"/>

  <!-- Angle arc at eye -->
  <path d="M 66,99 A 40,40 0 0,1 66,131" fill="none" stroke="#9a7b32" stroke-width="1.8"/>
  <text x="73" y="122" font-size="13" fill="#9a7b32" font-style="italic">θ</text>

  <!-- Dimension labels -->
  <!-- L = distance from eye to crosspiece -->
  <line x1="30" y1="103" x2="190" y2="103" stroke="#8090a0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="30" y1="99" x2="30" y2="107" stroke="#8090a0" stroke-width="1"/>
  <line x1="190" y1="99" x2="190" y2="107" stroke="#8090a0" stroke-width="1"/>
  <text x="110" y="98" font-size="10" fill="#6070a0" text-anchor="middle" font-style="italic">L  (staff length)</text>

  <!-- h = half-height of crosspiece -->
  <line x1="204" y1="115" x2="204" y2="78" stroke="#8090a0" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="200" y1="115" x2="208" y2="115" stroke="#8090a0" stroke-width="1"/>
  <line x1="200" y1="78" x2="208" y2="78" stroke="#8090a0" stroke-width="1"/>
  <text x="218" y="100" font-size="10" fill="#6070a0" font-style="italic">h</text>

  <!-- Formula -->
  <text x="240" y="140" font-size="10.5" fill="#3a3028" text-anchor="middle">tan(θ/2) =</text>
  <text x="240" y="155" font-size="12" fill="#9a7b32" font-style="italic" text-anchor="middle">h / L</text>

  <!-- Caption -->
  <text x="160" y="210" font-size="10.5" fill="#5a4e40" text-anchor="middle" font-style="italic">Slide crosspiece until tips bracket both stars &#x2014; angle from h/L (tangent)</text>
</svg>
