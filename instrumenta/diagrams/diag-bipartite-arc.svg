<svg viewBox="0 0 320 215" font-family="Georgia,serif" font-size="11" fill="#1a2238" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="215" fill="#f8f4ec"/>

  <!-- Title -->
  <text x="160" y="16" font-size="11.5" fill="#1a2238" font-weight="bold" text-anchor="middle">The bipartite arc</text>

  <!-- Concept: split arc with two sights. At zero, both sight-lines are parallel.
       Show two sight-arms diverging from a split pivot. Left arm fixed, right arm (alidade) moved.
       Pivot split point at x=160.

       Show two states:
       1) Zero position: both arms horizontal, parallel → small star pair overhead
       2) Reading position: right arm angled slightly up → small angle θ between them

       Layout: left sight-arm from (60,100) pointing right; right sight-arm from (260,100) pointing left
       The "arc" is between them at the bottom, centred at (160, 140)
  -->

  <!-- Arc segment at bottom (the physical arc between the two observers) -->
  <path d="M 70,140 A 90,40 0 0,0 250,140" fill="none" stroke="#1a2238" stroke-width="2.5"/>

  <!-- Zero mark at arc centre -->
  <line x1="160" y1="132" x2="160" y2="148" stroke="#1a2238" stroke-width="1.5"/>
  <text x="160" y="162" font-size="10" fill="#3a3028" text-anchor="middle">0°</text>

  <!-- Tick marks on arc -->
  <line x1="115" y1="136" x2="117" y2="148" stroke="#1a2238" stroke-width="1"/>
  <line x1="205" y1="136" x2="203" y2="148" stroke="#1a2238" stroke-width="1"/>

  <!-- Observer 1 (left, FIXED) — sight-line horizontal to right -->
  <ellipse cx="72" cy="100" rx="8" ry="6" fill="#f8f4ec" stroke="#1a2238" stroke-width="1.5"/>
  <circle cx="72" cy="100" r="2.5" fill="#1a2238"/>
  <text x="72" y="117" font-size="9" fill="#3a3028" text-anchor="middle">Obs. 1</text>
  <text x="72" y="128" font-size="9" fill="#3a3028" text-anchor="middle">(fixed)</text>
  <!-- Fixed sight line horizontal -->
  <line x1="80" y1="100" x2="250" y2="100" stroke="#8090a0" stroke-width="1.3" stroke-dasharray="6,3"/>

  <!-- Observer 2 (right, MOVABLE) — sight-line angled up slightly -->
  <ellipse cx="250" cy="100" rx="8" ry="6" fill="#f8f4ec" stroke="#9a7b32" stroke-width="1.5"/>
  <circle cx="250" cy="100" r="2.5" fill="#9a7b32"/>
  <text x="250" y="117" font-size="9" fill="#9a7b32" text-anchor="middle">Obs. 2</text>
  <text x="250" y="128" font-size="9" fill="#9a7b32" text-anchor="middle">(alidade)</text>
  <!-- Alidade sight line: angled 12° up from horizontal to the left -->
  <line x1="242" y1="100" x2="80" y2="79" stroke="#9a7b32" stroke-width="1.6" stroke-dasharray="6,3"/>

  <!-- Stars at distant left: star A on fixed line, star B on alidade line -->
  <text x="55" y="96" font-size="14" fill="#1a2238" text-anchor="middle">★</text>
  <text x="48" y="89" font-size="9" fill="#3a3028" text-anchor="middle">A</text>
  <text x="60" y="73" font-size="14" fill="#9a7b32" text-anchor="middle">★</text>
  <text x="50" y="67" font-size="9" fill="#9a7b32" text-anchor="middle">B</text>

  <!-- Small angle θ between the two sight lines, shown at right observer -->
  <path d="M 232,100 A 18,18 0 0,0 228.5,89" fill="none" stroke="#9a7b32" stroke-width="1.5"/>
  <text x="218" y="88" font-size="12" fill="#9a7b32" font-style="italic">θ</text>

  <!-- Key text — zero position = parallel -->
  <text x="160" y="40" font-size="10" fill="#3a3028" text-anchor="middle" font-weight="bold">At zero: both sight-lines parallel</text>
  <line x1="80" y1="50" x2="240" y2="50" stroke="#8090a0" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="80" y1="58" x2="240" y2="58" stroke="#8090a0" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="255" y="51" font-size="9" fill="#6070a0">→ A</text>
  <text x="255" y="59" font-size="9" fill="#6070a0">→ A</text>

  <!-- Caption -->
  <text x="160" y="200" font-size="10.5" fill="#5a4e40" text-anchor="middle" font-style="italic">Zero = parallel sight-lines; small rotation of alidade reads tiny angular separation</text>
  <text x="160" y="211" font-size="9.5" fill="#5a4e40" text-anchor="middle" font-style="italic">between two close objects without observers colliding</text>
</svg>
